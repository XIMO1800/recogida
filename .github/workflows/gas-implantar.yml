# Sube gas/ al Apps Script y hace «Nueva versión» sobre la MISMA implementación (la dirección de la API no cambia).
# Se ejecuta SOLO cada vez que se sube a main un cambio en gas/*.gs o gas/appsscript.json (y también a mano si hace falta).
name: Apps Script · implantar
on:
  push:
    branches: [main]
    paths: ['gas/*.gs', 'gas/appsscript.json']
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Qué cambia (sale en la descripción de la versión)'
        required: false
        default: 'Actualización'
concurrency: { group: gas-implantar, cancel-in-progress: false }
jobs:
  implantar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Comprobaciones
        run: |
          test -f gas/appsscript.json || { echo "Falta gas/appsscript.json: ejecutar antes «traer lo implantado»"; exit 1; }
          for f in gas/*.gs; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" || { echo "Error de sintaxis en $f"; exit 1; }; done
      - name: Credenciales de clasp
        env: { CLASPRC: '${{ secrets.CLASPRC_JSON }}' }
        run: |
          test -n "$CLASPRC" || { echo "Falta el secreto CLASPRC_JSON en Settings → Secrets → Actions"; exit 1; }
          printf '%s' "$CLASPRC" > ~/.clasprc.json
      - name: Subir y crear nueva versión
        run: |
          ID=$(node -p "require('./gas/clasp-id.json').scriptId"); DEP=$(node -p "require('./gas/clasp-id.json').deploymentId")
          mkdir -p sube && cp gas/*.gs gas/appsscript.json sube/ && cd sube
          echo "{\"scriptId\":\"$ID\",\"rootDir\":\".\"}" > .clasp.json
          npx -y @google/clasp@2.4.2 push --force
          MOTIVO="${{ github.event.inputs.motivo }}"; [ -n "$MOTIVO" ] || MOTIVO="$(git log -1 --pretty=%s | cut -c1-90)"
          npx -y @google/clasp@2.4.2 deploy -i "$DEP" -d "$MOTIVO · $(date -u +%F)"
          npx -y @google/clasp@2.4.2 deployments
