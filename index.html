<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#862133">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recogida">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Recogida de Leche · El Hidalgo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Tema único claro, a propósito: se usa en la cabina y al sol, necesita el máximo contraste. */
:root{
  color-scheme:light;
  --brand:#862133; --brand-deep:#6a1010; --brand-soft:#f7e8eb; --brand-ink:#ffffff;
  --gold:#c4952b; --gold-soft:#fbf1dc;
  --bg:#f2efee; --surface:#ffffff; --surface2:#f7f4f3; --ink:#1d1618; --muted:#6a5f61; --line:#ddd4d5;
  --accent:var(--brand); --accent-ink:#fff; --accent-soft:var(--brand-soft);
  --ok:#1e7443; --ok-soft:#e1f2e7; --warn:#9c5c00; --warn-soft:#fdf0d8; --bad:#c0262d; --bad-soft:#fde4e4;
  --sp-do:#1c6b35; --sp-ov:#1d5796; --sp-ca:#b3262d; --sp-va:#5a5254;   /* texto: colores del tapón del bote de muestra */
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
/* Recepción: pantalla de cuadro (15" o más, horizontal) */
body.ancho .app,body.ancho .top-in{max-width:1180px}
.recgrid{display:grid;gap:12px}
@media (min-width:900px){.recgrid{grid-template-columns:repeat(2,minmax(0,1fr))}body.ancho .big{font-size:40px}}
.ordn{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.ordb{border:2px solid var(--line);background:#fff;border-radius:10px;min-width:44px;min-height:40px;font-weight:700;font-size:16px}.ordb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tl{display:grid;grid-template-columns:auto auto 1fr;gap:6px 12px;align-items:center}.tl .n{font-family:var(--display);font-size:24px;font-weight:700;color:var(--muted)}.tl .tag{font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}.tl .tag{margin-left:10px}.vm{display:grid;grid-template-columns:1fr 1fr;gap:8px}[data-mz]:disabled{opacity:.4;cursor:not-allowed}.vm .tg .tiny{min-width:0!important;margin-right:4px}.tl .ini{background:#e1ecf9;color:#1d5796}.tl .fin{background:#fde4e4;color:#b3262d}
.dep-card{display:flex;flex-direction:column;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;gap:1px;cursor:pointer;font:inherit;color:inherit}.dep-card:active{background:var(--brand-soft)}
.rc .tiny,.tiny{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chead{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.chead .cel{display:flex;align-items:center;gap:6px;min-height:44px;flex-wrap:wrap}
.rc>.card{position:relative;overflow:hidden}.ctop{gap:8px;padding:12px;background:rgba(255,255,255,.6);border-bottom:2px solid var(--cb,var(--line))}.cmid{gap:8px;padding:10px 12px 12px;border-bottom:2px solid var(--cb,var(--line))}.cbot{gap:8px;padding:10px 12px 12px;background:rgba(0,0,0,.025)}.chead .ordd{position:absolute;top:7px;left:7px;font-family:var(--display);font-size:15px;line-height:1;font-weight:700;color:var(--cs,var(--muted));opacity:.75;border:1.5px solid var(--cb,var(--line));border-radius:8px;padding:4px 6px}.chead .cel b{font-size:19px}
.chead .ncel{flex-direction:column;align-items:stretch;gap:0}.ncb{display:flex;gap:4px;min-width:150px}.ncb button{flex:1;min-width:0;min-height:38px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-weight:700;font-size:17px}.ncb button.on{background:var(--brand);border-color:var(--brand);color:#fff}.ncb button.on.bad{background:var(--bad);border-color:var(--bad)}.ncs{font:inherit;font-size:20px;font-weight:700;min-height:40px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:2px 8px}.ncs.mal{border-color:var(--bad);color:var(--bad)}
.mini5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.mini5 label,.mini5>div{display:flex;flex-direction:column;gap:2px;min-width:0}.mini5 input{width:100%;min-width:0}.tg.ci button{min-height:42px;font-size:16px;padding:0}
@media (max-width:520px){.mini5{grid-template-columns:repeat(3,minmax(0,1fr))}}
input.sm{width:100%;font-family:var(--display);font-weight:700;font-size:20px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.d5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.d5 .dest{min-height:48px;padding:4px 2px;border-top-width:2px}
.tg{display:flex;gap:4px}.tg button{flex:1;min-height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;font-family:inherit}.tg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}.tg button.on.bad{background:var(--bad);border-color:var(--bad)}
.lnk{border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;color:var(--muted);font-family:inherit;flex:1}
.xbox{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.pendc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:180px;border-style:dashed;border-width:2px;font:inherit;color:inherit;cursor:pointer}
.camgrid{display:grid;gap:10px}
@media (min-width:900px){body.ancho .recgrid.rc{grid-template-columns:repeat(var(--n),minmax(0,1fr))}.camgrid{grid-template-columns:1.3fr 1fr 1fr 1.6fr;align-items:start}}
.xrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.xrow .unit{flex:1 1 150px;min-width:150px}.xrow .btn{width:auto;min-height:48px;padding:6px 12px}
.rc .xrow{flex-wrap:nowrap;gap:4px}.rc .xrow .unit{flex:1 1 70px;min-width:70px}.rc .xrow .btn{min-height:40px;padding:4px 6px;font-size:14px}.rc .xrow .lnk{flex:0 0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:.02em}

/* Cabecera corporativa */
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 0 var(--brand-deep)}
.top-in{max-width:480px;margin:0 auto;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;padding-block:8px 6px;border-bottom:1px solid rgba(255,255,255,.18)}
.logo{display:flex;align-items:center;background:#fff;border-radius:8px;padding:3px 8px}
.logo img{height:34px;width:auto;display:block}
.wordmark{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.brand .pill{margin-left:auto}
.brand .app-name{white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ver{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.8;white-space:nowrap}   /* versión junto al logotipo */
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.back{border:0;background:rgba(255,255,255,.16);color:#fff;width:44px;height:44px;border-radius:12px;font-size:26px;line-height:1;flex:none}
.bar-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bar-t b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t span{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:#6fdc97;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.pill.off .dot{background:#ffc04d}
.decabtn{border:0;background:#fff;color:var(--brand);border-radius:12px;height:44px;padding:0 14px;font-weight:700;font-size:15px;letter-spacing:.04em;flex:none;display:flex;align-items:center;gap:6px}
.decabtn svg{width:18px;height:18px}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

.btn{border:0;border-radius:14px;min-height:58px;padding:14px 16px;font-weight:700;font-size:19px;width:100%;background:var(--brand);color:#fff;box-shadow:0 2px 0 var(--brand-deep)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px dashed var(--line);box-shadow:none;font-size:16px;min-height:48px}
.row{display:flex;gap:10px}
.row>*{flex:1}

.route{display:flex;flex-direction:column;gap:10px}
.route-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.route-head h2{font-size:32px}
.comps{display:flex;gap:6px;flex-wrap:wrap}
.tank{font-family:var(--mono);font-weight:600;font-size:14px;border:2px solid currentColor;border-radius:8px;padding:2px 8px;background:var(--surface)}
.sp-D{color:var(--sp-do)} .sp-O{color:var(--sp-ov)} .sp-C{color:var(--sp-ca)} .sp-V{color:var(--sp-va)}
.sp-MX{color:var(--sp-ca)}
/* Especie = color del tapón del bote de muestra. Cada ficha: fondo muy suave, borde fino del color y franja gruesa a la izquierda */
.bg-D{--cf:#eef7f0;--cb:#a9d4b4;--cs:var(--sp-do)} .bg-O{--cf:#eff5fd;--cb:#a9c5e8;--cs:var(--sp-ov)}
.bg-C{--cf:#fdf0f0;--cb:#ebb2b4;--cs:var(--sp-ca)} .bg-V{--cf:#ffffff;--cb:#d3cccd;--cs:#a39a9c}
.bg-MX{--cf:linear-gradient(90deg,#fdf0f0,#fff);--cb:#ebb2b4;--cs:var(--sp-ca)}
.farm[class*="bg-"],.dest[class*="bg-"],.tally div[class*="bg-"],.card[class*="bg-"]{background:var(--cf);border-color:var(--cb)}
.farm[class*="bg-"],.card[class*="bg-"]{border-left:6px solid var(--cs)}
.farm.next[class*="bg-"]{background:var(--cf);border-color:var(--brand);border-width:2px;border-left:6px solid var(--cs);box-shadow:0 2px 8px rgba(134,33,51,.15)}
.farm.done[class*="bg-"],.farm.skip[class*="bg-"]{background:var(--cf)}
.dest[class*="bg-"]{border-top:5px solid var(--cs)}
.dest[aria-pressed="true"][class*="bg-"]{background:var(--cf);border-color:var(--brand);border-top-color:var(--cs)}
.tally div[class*="bg-"]{border-top:4px solid var(--cs)}
.tank.sp-D{background:#eef7f0} .tank.sp-O{background:#eff5fd} .tank.sp-C{background:#fdf0f0} .tank.sp-V{background:#fff;color:#5a5254}
.tank.sp-MX{background:linear-gradient(90deg,#fdf0f0,#fff)}
.sp-badge.sp-D{background:#eef7f0} .sp-badge.sp-O{background:#eff5fd} .sp-badge.sp-C{background:#fdf0f0} .sp-badge.sp-V{background:#fff}
/* Tablas de consulta (oficina e historial): cada ganadero es una ficha separada */
table.hist{border-collapse:separate!important;border-spacing:0 8px}
table.hist thead th{border-bottom:0!important;padding-bottom:0}
table.hist tbody td{background:var(--cf,#fff);border-top:1.5px solid var(--cb,var(--line));border-bottom:1.5px solid var(--cb,var(--line))!important;padding:10px 6px}
table.hist tbody td:first-child{border-left:6px solid var(--cs,#a39a9c);border-radius:12px 0 0 12px;padding-left:10px}
table.hist tbody td:last-child{border-right:1.5px solid var(--cb,var(--line));border-radius:0 12px 12px 0;padding-right:10px}
table.hist td .tank{display:inline-block;margin-bottom:3px}

.deca{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;border-top:6px solid var(--brand)}
#qr{background:#fff;padding:8px;border-radius:8px;width:148px;height:148px;border:1px solid var(--line)}
#qr img,#qr canvas{width:130px!important;height:130px!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
@media (max-width:440px){.brand .app-name{display:none}}
@media (max-width:400px){.deca{grid-template-columns:1fr}#qr{justify-self:center}}

.progress{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.tally div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.tally b{font-family:var(--display);font-size:26px;font-weight:700}
.tally .tank{align-self:flex-start;font-size:13px;padding:0 6px}

.farm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;min-height:64px}
.farm .n{font-family:var(--display);font-size:22px;font-weight:700;width:28px;flex:none;color:var(--muted)}
.farm .main{flex:1;min-width:0;display:flex;flex-direction:column}
.farm .name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.farm .sub{font-size:14px;color:var(--muted)}
.farm .st{font-size:15px;font-weight:700;text-align:right;flex:none}
.farm.done{background:var(--surface2)}
.farm.done .n{color:var(--ok)}
.farm.done .st{color:var(--ok)}
.farm.skip{opacity:.7}
.farm.skip .st{color:var(--muted)}
.farm.next{border-color:var(--brand);border-width:2px;background:var(--brand-soft)}
.farm.next .n,.farm.next .st{color:var(--brand)}

.next-card{background:var(--brand);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 3px 0 var(--brand-deep)}
.next-card .lbl{color:rgba(255,255,255,.8)}
.next-card h2{font-size:32px}
.next-card p{opacity:.9}
.next-card .btn{background:#fff;color:var(--brand);box-shadow:none}

.field{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.pair .big{font-size:38px;padding:4px 12px}
.pair .unit span{font-size:17px;right:10px}
/* Con el teclado abierto la cabecera se encoge para que se vea lo que se escribe */
body.kb .brand{display:none}
body.kb .bar{padding-block:6px}
body.kb .bar-t b{font-size:20px}
body.kb .back,body.kb .decabtn{height:38px}
body.kb .back{width:38px}
.big{font-family:var(--display);font-size:46px;font-weight:700;width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 16px;font-variant-numeric:tabular-nums}
.big:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.unit{position:relative}
.tally .unit{padding:0;border:0;background:none}.tally input[data-ag]{padding:6px 24px 6px 8px}.tally .unit:has(input[data-ag]) span{right:8px;font-size:16px}
.unit span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:20px}
.msg{font-size:15px;font-weight:600;border-radius:12px;padding:10px 12px;border-left:5px solid currentColor}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.scan{display:flex;gap:8px}
.scan input{flex:1;min-width:0;font-family:var(--mono);font-size:22px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px}
.scan button{flex:none;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;padding:0 18px}
.dests{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.dest{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;justify-content:center}
.dest b{font-family:var(--mono);font-size:22px}
.dest small{font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.dest[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.dest .hab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand)}
.fname{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.farmer-head{padding-block:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-left:6px solid var(--brand)}
.sp-badge{font-size:13px;font-weight:700;border:2px solid currentColor;border-radius:99px;padding:3px 10px;white-space:nowrap}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:700;padding:6px;border-bottom:2px solid var(--line)}
td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td input{width:80px;font:inherit;text-align:right;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px}
.d-ok{color:var(--ok);font-weight:700}.d-bad{color:var(--bad);font-weight:700}
pre{font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:0;line-height:1.5}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:600;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{margin:0}
.btn:disabled{opacity:.6}
#scanner{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:16px}
#scanner p{color:#fff;text-align:center;font-weight:700;margin:0}
#reader{width:100%;max-width:480px;margin:0 auto;background:#000;border-radius:12px;overflow:hidden}
#scanner .btn{max-width:480px;margin:0 auto;background:#fff;color:var(--brand)}
  table.hist { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.hist th { text-align: left; font-size: 12px; color: var(--muted, #777); font-weight: 600; padding: 4px 4px 6px; border-bottom: 1px solid rgba(0,0,0,.12); }
  table.hist td { padding: 8px 4px; border-bottom: 1px solid rgba(0,0,0,.07); vertical-align: top; }
  table.hist td.num { text-align: right; font-weight: 700; white-space: nowrap; }
  table.hist td:last-child { white-space: nowrap; }
  tr.muted td { opacity: .55; }

/* ═══ Escritorio: oficina y recepción en pantalla de ordenador (≥ 1100 px) ═══ */
#side{display:none}
body.esc #side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:232px;background:var(--brand-deep);color:#fff;z-index:6;padding:18px 12px;gap:4px}
body.esc .top{margin-left:232px}
body.esc .top-in,body.esc.ancho .top-in{max-width:none;padding-inline:28px}
body.esc .app,body.esc.ancho .app{max-width:none;margin-left:232px;padding:20px 28px 48px}
body.esc .solo-movil{display:none!important}
body.esc .agGrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
body.esc .agGrid .agDer{position:sticky;top:12px}
body.esc .agGrid .tally{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
body.esc .agGrid .tally div{padding:6px}body.esc .agGrid .tally input{font-size:20px!important;padding:4px 22px 4px 8px;border-radius:10px}body.esc .agGrid .tally .unit span{right:8px;font-size:15px}
body.esc .agGrid .tally b{font-size:15px!important}
body.esc .agGrid .agDer .card{padding:14px 16px}
.side-t{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1;padding:4px 10px 14px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px}
.side-t small{display:block;font-family:var(--body);font-size:13px;font-weight:500;opacity:.75;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button,.navb{display:block;width:100%;text-align:left;background:transparent;border:0;color:rgba(255,255,255,.82);padding:11px 12px;border-radius:10px;font-weight:600;font-size:15.5px}
.nav button:hover,.navb:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav button small{display:block;font-weight:500;font-size:12px;opacity:.7}
.navb{border:1px solid rgba(255,255,255,.2);margin-top:6px;text-align:center}
.ofi2{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.ofi2 .lista{position:sticky;top:96px;max-height:calc(100vh - 116px);overflow:auto;padding:10px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:9px 10px;align-items:center}
.vrow:hover{background:var(--surface2)}.vrow.on{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.vrow small{display:block;font-size:12.5px;color:var(--muted)}.vrow .num{text-align:right}
.vrow .badge{font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;background:var(--warn-soft);color:var(--warn)}
.dia{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 4px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:110px}
.kpi span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.kpi b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
table.dt{width:100%;border-collapse:collapse;font-size:14.5px}
table.dt th{position:sticky;top:88px;background:var(--surface2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);z-index:1}
table.dt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt td.n,table.dt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt tr[class*="bg-"] td:first-child{box-shadow:inset 4px 0 0 var(--cs,transparent)}
table.dt tr.click{cursor:pointer}table.dt tr.click:hover td{background:var(--brand-soft)}
table.dt tr.sin td{opacity:.5}
.esc2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:20px;align-items:start}
table.dt td{text-align:left}table.dt td.n{text-align:right}table.dt td:nth-child(3){min-width:200px}table.dt td:nth-child(4){white-space:nowrap}
#vOfiE input:not([type=checkbox]):not(.big),#drawerIn input:not([type=checkbox]):not(.big){width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
#vOfiE label.row,#drawerIn label.row{justify-content:flex-start}#vOfiE label.row input,#drawerIn label.row input{flex:0 0 auto}
.esc2 .tally{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.esc2 .dep-card>b:first-child{font-size:14px!important;white-space:nowrap}.esc2 .dep-card{padding:8px;overflow:hidden}.esc2 .dep-card b.num{font-size:22px}.esc2 .dep-card small b{font-size:12.5px}
.repw{display:inline-flex;flex-direction:column;align-items:center}.reparto{display:flex;justify-content:center;margin-top:3px;padding-top:3px;border-top:1px solid var(--line)}.reparto>span{display:flex;flex-direction:column;align-items:center;padding:0 7px;line-height:1.2}.reparto>span+span{border-left:1px solid var(--line)}.reparto b{font-size:14px}.reparto i{font-style:normal;font-size:12px;font-weight:700}
#veil{position:fixed;inset:0;background:rgba(29,22,24,.35);z-index:8}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);box-shadow:-10px 0 30px rgba(0,0,0,.2);z-index:9;overflow:auto;padding:22px 24px 40px}
</style>

<script>
/* ═══════════ CONFIGURACIÓN ═══════════ */
const API = 'https://script.google.com/macros/s/AKfycbx7uB5N55ZiEpH2EpCQBNsK-YI0X_7wVlkDvweUWNcBNplai0csOa34sMIEKptRdVRe/exec';   // Implementar → Aplicación web → URL que termina en /exec
const LS = 'rl_estado_v1';
const VERSION = 'v52 · 08/10/2026';   // cambiar en cada subida (y la caché de sw.js)

/* ═══════════ ESTADO ═══════════
   S se guarda en el móvil (sobrevive a cierres y a falta de cobertura). U es solo de pantalla. */
const S0 = { pin: null, datos: null, sel: [], pref: null, cam: null, nuevosCam: [],
             viaje: null, cadena: [], decas: [], list: [], rec: {}, lastI: null,
             cola: { recs: {}, cierres: [] } };
let S = Object.assign({}, S0, cargar() || {});
// Migración: viajes en curso guardados antes de la clave código|especie
(S.list || []).forEach(x => { if (x.k) return; const g = (S.datos && S.datos.ganaderos || []).find(g => g.cod === x.cod) || { cod: x.cod, esp: 'O' }; x.esp = g.esp; x.k = g.cod + '|' + g.esp; if (S.rec && S.rec[x.cod]) { S.rec[x.k] = S.rec[x.cod]; delete S.rec[x.cod]; } });
const U = { view: null, camMode: null, nt: null, map: null, volver: null, vistaPrev: null, pos: null, ocupado: false };
function cargar() { try { return JSON.parse(localStorage.getItem(LS)); } catch (e) { return null; } }
function persistir() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }

const $ = s => document.querySelector(s);
const fmt = n => Math.round(n || 0).toLocaleString('es-ES');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hhmm = () => new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
const hoyTxt = () => new Date().toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric' });
const num = s => parseFloat(String(s).replace(',', '.'));

/* ═══════════ DATOS ═══════════ */
const SP = { D: 'D.O.', O: 'Oveja', C: 'Cabra', V: 'Vaca' };
const labelEsp = e => e === 'D' ? 'Oveja D.O.' : (SP[e] || e);
const D = () => S.datos;
const CFG = () => D().config;
const misRutas = () => Object.keys(D().rutas).sort();
const ganRuta = r => D().ganaderos.filter(g => g.ruta === r);
const camiones = () => D().camiones.concat(S.nuevosCam);
const CAM = id => camiones().find(k => k.id === id);
const T = () => CAM(S.cam) || camiones()[0];
const rt = () => S.sel.map(x => +x).join(' y ');
function pref() {
  if (S.pref && S.sel.includes(S.pref)) return String(+S.pref);
  const p = S.sel.map(r => D().rutas[r] && D().rutas[r].pref).find(p => p && S.sel.includes(p));
  return String(+(p || S.sel[0]));
}
// Compartimentos de la ruta: los marcados con esa RUTA en COMPARTIMENTOS; si no hay, los generales (RUTA vacía)
const letrasDe = k => { const r = String(pref()).padStart(2, '0'), p = k.letras.filter(x => x.ruta === r); return p.length ? p : k.letras.filter(x => !x.ruta); };
const compsDe = k => letrasDe(k).map(x => ({ id: pref() + x.l, l: x.l, esp: x.esp, mezcla: x.mezcla || [], cap: Number(x.cap) || 0 }));
const comps = () => compsDe(T());
const comp = id => comps().find(c => c.id === id);
const compLabel = c => c.esp.map(e => SP[e] || e).join(' + ');
const spClass = c => c.esp.length > 1 ? 'sp-MX' : 'sp-' + c.esp[0];
const bgComp = c => spClass(c).replace('sp-', 'bg-');                          // sp-O → bg-O
const bgEsp = e => ({ D: 'bg-D', O: 'bg-O', C: 'bg-C', V: 'bg-V' })[String(e || '').toUpperCase()] || '';
const letraDe = id => String(id || '').replace(/^\d+/, '').toUpperCase();   // 5D → D, 4v → V
const bgId = id => bgEsp(letraDe(id));
const tq = id => `<span class="tank sp-${esc(letraDe(id))}">${esc(id)}</span>`;
function mezclaMsg(esp, c) {
  return c.esp.includes('D') && esp !== 'D'
    ? `${labelEsp(esp)} en ${c.id}: todo el compartimento deja de ser D.O.`
    : `${labelEsp(esp)} en ${c.id}, que es de ${compLabel(c)}: se mezclan.`;
}
function compat(esp, c) {
  if (c.esp.includes(esp)) return { ok: true };
  if (esp === 'V' && c.esp.includes('C')) return { ok: true };
  if (esp === 'D' && c.esp.includes('O')) return { ok: true, warn: 'Leche D.O. en compartimento de oveja: pierde la D.O.' };
  if (c.mezcla.includes(esp)) return { ok: true, bad: true, warn: mezclaMsg(esp, c) };
  return { ok: false };
}
const recsViaje = () => Object.values(S.rec);
const mixed = c => recsViaje().some(x => !x.sin && (x.dest === c.id && !compat(x.esp, c).ok || x.arr && x.arr.dest === c.id && x.arr.tipo === 'reparto' && !compat(x.esp, c).ok || x.rep && x.rep.dest === c.id && !compat(x.esp, c).ok));
const grp = e => (e === 'O' || e === 'D') ? 'OV' : 'VC';
const vcComps = () => comps().filter(c => !c.esp.includes('O') && !c.esp.includes('D'));
function addTot(tot, x) { if (x.sin) return; const a = x.arr ? x.arr.l : 0, p = x.rep ? x.rep.l : 0; tot[x.dest] = (tot[x.dest] || 0) + x.litros - a - p; if (a) tot[x.arr.dest] = (tot[x.arr.dest] || 0) + a; if (p) tot[x.rep.dest] = (tot[x.rep.dest] || 0) + p; }
function totales() { const t = {}; comps().forEach(c => t[c.id] = 0); recsViaje().forEach(x => addTot(t, x)); return t; }
function habitual(g) { const c = comps().find(c => c.l === g.dl); return c ? c.id : (comps().find(c => compat(g.esp, c).ok) || comps()[0]).id; }

/* ═══════════ SERVIDOR Y COLA SIN COBERTURA ═══════════ */
async function api(accion, datos) {
  if (API.startsWith('PEGAR')) throw new Error('Falta configurar la dirección del servidor (API) en la app.');
  if (!S.dev) { S.dev = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); persistir(); }
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ accion, pin: S.pin, dev: S.dev }, datos)) });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'PIN incorrecto' && accion !== 'login') { pinCaducado(); throw new Error('El PIN ha cambiado. Escribe el nuevo.'); }
    throw new Error(j.error || 'Error del servidor');
  }
  return j;
}
const esRed = e => !(e instanceof Error) || /fetch|network|Failed|Load failed|NetworkError/i.test(e.message);
const pendientes = () => Object.keys(S.cola.recs).length + S.cola.cierres.length;
function encolar(rec) { S.cola.recs[rec.recId] = rec; persistir(); syncPill(); flush(); }
let flushing = false;
async function flush() {
  if (flushing || !S.pin || !pendientes()) { syncPill(); return; }
  flushing = true;
  try {
    const recs = Object.values(S.cola.recs);
    if (recs.length) {
      const r = await api('guardar', { recs });
      r.ids.forEach(id => delete S.cola.recs[id]); persistir();
      if (r.sinViaje) toast(r.sinViaje + (r.sinViaje > 1 ? ' recogidas eran' : ' recogida era') + ' de un viaje que ya no existe: se han guardado aparte para la oficina');
    }
    while (S.cola.cierres.length) {
      await api('cerrarViaje', S.cola.cierres[0]);
      S.cola.cierres.shift(); persistir();
      toast('Viaje cerrado y enviado a la oficina');
    }
    S.online = true; U.errServ = null;
  } catch (e) { S.online = !esRed(e) ? S.online : false; if (!esRed(e)) { U.errServ = e.message; toast('Error al enviar: ' + e.message); } }
  flushing = false; syncPill();
}
function syncPill() {
  const p = pendientes(), on = navigator.onLine && S.online !== false;
  $('#sync').classList.toggle('off', !on || p > 0);
  $('#syncTxt').textContent = p ? `${p} sin enviar` : (on ? 'Todo enviado' : 'Sin cobertura');
}
window.addEventListener('online', () => { S.online = true; flush(); });
window.addEventListener('offline', () => { S.online = false; syncPill(); });
setInterval(flush, 30000);
$('#sync').onclick = () => { S.online = true; flush(); toast(pendientes() ? 'Intentando enviar…' : 'Todo está enviado'); };

/* ═══════════ PANTALLAS ═══════════ */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); }
const VIEWS = ['vHisto', 'vDep', 'vAgua', 'vPin', 'vRutas', 'vCamion', 'vTras', 'vDeca', 'vLista', 'vFicha', 'vFin', 'vHist', 'vOfi', 'vOfiV', 'vOfiE', 'vRecep', 'vRecepC'];
function show(v, title, sub) {
  VIEWS.forEach(id => $('#' + id).hidden = id !== v);
  document.body.classList.toggle('ancho', ['vRecep', 'vRecepC', 'vAgua', 'vDep'].includes(v));
  U.ocupado = false; U.view = v; $('#barTitle').textContent = title; $('#barSub').textContent = sub || '';
  $('#back').hidden = ['vPin', 'vDeca', 'vRutas', 'vOfi'].includes(v) || (v === 'vLista') || (v === 'vRecep' && !(S.datos && S.datos.oficina));
  $('#decaBtn').hidden = !(S.viaje && ['vLista', 'vFicha', 'vFin', 'vTras'].includes(v) || (v === 'vCamion' && U.camMode === 'trasvase'));
  window.scrollTo(0, 0); syncPill(); marcoEsc();
}
$('#decaBtn').onclick = () => { U.volver = U.view === 'vFicha' ? S.i : null; U.vistaPrev = U.view; deca(); };
$('#back').onclick = () => {
  if (U.view === 'vCamion') return U.camMode === 'trasvase' ? lista() : rutas();
  if (U.view === 'vTras') return camion('trasvase');
  if (U.view === 'vFicha' || U.view === 'vFin') return lista();
  if (U.view === 'vOfiE') return ofiViaje(U.ofiV);
  if (U.view === 'vOfiV') return oficina(true);
  if (U.view === 'vHisto') return oficina(true);
  if (U.view === 'vRecepC') { R.ed = null; return recepcion(true); }
  if (U.view === 'vAgua' || U.view === 'vDep') return recepcion(true);
  if (U.view === 'vRecep' && D().oficina) return oficina(true);
  if (U.view === 'vHist') { if (U.histI != null) { U.histI = null; return histRender(); } return rutas(); }
};
function ocupado(btn, txt) { U.ocupado = true; btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = txt; }
function libre(btn) { U.ocupado = false; btn.disabled = false; if (btn.dataset.t) btn.textContent = btn.dataset.t; }

/* 0. PIN */
// La oficina ha cambiado el PIN: se pide el nuevo sin borrar el viaje ni lo pendiente de enviar
function pinCaducado() { if (!S.pin) return; S.pin = null; persistir(); syncPill(); pinView('La oficina ha cambiado tu PIN. Escribe el nuevo. No se ha perdido nada de lo apuntado.'); }
function pinView(msg) {
  const v = $('#vPin');
  v.innerHTML = `<div class="card stack">
    <h2>Entrar</h2>
    <p class="muted">Escribe tu PIN de conductor. Solo verás tus rutas.</p>
    <input class="big" id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="····" style="text-align:center;letter-spacing:.3em">
    ${msg ? `<div class="msg bad">${esc(msg)}</div>` : ''}
    <button class="btn" id="entrar">Entrar</button>
  </div>
  <p class="small muted">Si no tienes PIN o no ves tus ganaderos, llama a la oficina.</p>
  <p class="small muted" style="text-align:center">App ${esc(VERSION)}</p>`;
  const go = async () => {
    const pin = $('#pin').value.trim(); if (!pin) return;
    const b = $('#entrar'); ocupado(b, 'Entrando…');
    const antes = S.datos && S.datos.conductor && !S.datos.oficina ? S.datos.conductor.id : null;
    try {
      S.pin = pin; const d = await api('login', {});
      if (antes && (!d.conductor || d.conductor.id !== antes) && (pendientes() || S.viaje)) {
        S.pin = null; libre(b);
        pinView(`Hay un viaje o datos sin enviar de ${S.datos.conductor.nombre}. Entra con su PIN y termínalo antes de cambiar de conductor.`); return;
      }
      if (d.rol === 'RECEPCION') { S.datos = { recepcion: true, calidad: (d.roles || []).includes('CALIDAD'), usuario: d.usuario }; persistir(); recepcion(); return; }
      if (d.rol === 'CALIDAD') { S.datos = { calidad: true, usuario: d.usuario }; persistir(); R.fecha = ''; recepcion(); return; }
      if (d.rol === 'OFICINA') { S.datos = { oficina: true, calidad: (d.roles || []).includes('CALIDAD'), usuario: d.usuario, config: d.config }; persistir(); oficina(); return; }
      cargarDatos(d);
      if (S.viaje) (S.viaje.empezado ? lista : deca)(); else rutas();
      flush();
    }
    catch (e) { S.pin = null; libre(b); pinView(esRed(e) ? 'Sin cobertura. Para entrar hace falta conexión.' : e.message); }
  };
  $('#entrar').onclick = go; $('#pin').onkeydown = e => { if (e.key === 'Enter') go(); };
  show('vPin', 'Recogida de leche', 'Quesos El Hidalgo');
}
function cargarDatos(d) {
  S.datos = { conductor: d.conductor, rutas: d.rutas, ganaderos: d.ganaderos, camiones: d.camiones, config: d.config, hoy: d.hoy || { viajes: [], recs: {} } };
  const rs = misRutas();
  S.sel = S.sel.filter(r => rs.includes(r)); if (!S.sel.length && rs.length) S.sel = [rs[0]];
  if (!CAM(S.cam)) S.cam = CAM(d.conductor.habitual) ? d.conductor.habitual : (d.camiones[0] || {}).id;
  S.online = true; persistir();
}

/* 1. Viaje de hoy: rutas y camión */
function estSel() { const seen = new Set(); let t = 0; S.sel.forEach(r => ganRuta(r).forEach(g => { if (seen.has(kg(g))) return; seen.add(kg(g)); t += g.ult || 0; })); return t; }
function rutas() {
  const c = D().conductor, keys = misRutas(), v = $('#vRutas');
  if (!T()) { v.innerHTML = `<div class="msg bad">No tienes ningún camión dado de alta. Avisa a la oficina o da de alta uno.</div><button class="btn" id="cambiarCam">Dar de alta camión</button><button class="btn ghost" id="salirSin">Salir · entrar con otro PIN</button>`;
    $('#cambiarCam').onclick = () => camion('inicio');
    $('#salirSin').onclick = () => { if (pendientes()) return toast('Hay datos sin enviar. Espera a tener cobertura.'); S = Object.assign({}, S0, { cola: { recs: {}, cierres: [] }, dev: S.dev }); persistir(); pinView(); };
    show('vRutas', 'Viaje de hoy', c.nombre); return; }
  const seen = new Set(); const n = S.sel.reduce((a, r) => a + ganRuta(r).filter(g => !seen.has(kg(g)) && seen.add(kg(g))).length, 0);
  v.innerHTML = `<p class="muted" style="text-transform:capitalize">${new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' })}</p>
  <div class="card stack">
    <div class="route-head"><h2>${esc(c.nombre)}</h2><span class="mono muted">${esc(T().matricula)}</span></div>
    <p class="small muted">${esc(T().desc)}${T().letraQ ? ' · Letra Q <span class="mono">' + esc(T().letraQ) + '</span>' : ''}</p>
    ${S.cam !== c.habitual ? `<div class="msg warn">Hoy no llevas tu camión habitual. El DeCA saldrá con la matrícula ${esc(T().matricula)}.${T().nuevo ? ' La oficina revisará este camión nuevo.' : ''}</div>` : ''}
    <button class="btn sec" id="cambiarCam" style="padding:10px">Cambiar camión</button>
    ${keys.length > 1 ? `<span class="lbl">Rutas de hoy</span>
    <div class="dests">${keys.map(r => `<button class="dest" aria-pressed="${S.sel.includes(r)}" data-r="${r}"><b>Ruta ${+r}</b><small>${ganRuta(r).length} ganaderos</small></button>`).join('')}</div>
    <p class="small muted">Marca las dos cuando las juntes (sábados, lunes…).</p>` : ''}
    ${S.sel.length > 1 ? `<span class="lbl">Los destinos van como</span>
    <div class="dests">${S.sel.map(r => `<button class="dest" aria-pressed="${pref() === String(+r)}" data-p="${r}"><b>Ruta ${+r}</b></button>`).join('')}</div>` : ''}
    <div class="comps">${comps().map(x => `<span class="tank ${spClass(x)}" title="${compLabel(x)}">${x.id}</span>`).join('')}</div>
    <p class="small muted">${n} ganaderos en la lista.</p>
    <div class="field"><label class="lbl" for="estL">Litros estimados de hoy (para el DeCA)</label>
      <div class="unit"><input class="big" id="estL" inputmode="numeric" autocomplete="off" placeholder="0" value="${S.estManual || estSel() || ''}" style="font-size:34px"><span>l</span></div>
      <span class="small muted">Sale calculado con la última recogida de cada ganadero. Corrígelo si hoy llevas más o menos.</span></div>
    ${n ? '' : `<div class="msg bad">No hay ganaderos cargados en ${S.sel.length > 1 ? 'estas rutas' : 'esta ruta'}. Avisa a la oficina.</div>`}
    ${viajesHoy(S.sel).length ? `<div class="msg warn"><b>Hoy ya hay ${viajesHoy(S.sel).length > 1 ? 'viajes' : 'un viaje'} de ${S.sel.length > 1 ? 'estas rutas' : 'esta ruta'}:</b><br>${viajesHoy(S.sel).map(v => esc(txtViaje(v))).join('<br>')}<br>Inicia otro solo si de verdad vuelves a salir.</div>` : ''}
    <div id="iniMsg" hidden></div>
    <button class="btn" id="ini" ${n ? '' : 'disabled'}>${viajesHoy(S.sel).length ? 'Iniciar otro viaje' : 'Iniciar viaje'}</button>
  </div>
  <p class="small muted">Al iniciar se genera el DeCA con su QR. Hace falta cobertura en ese momento.</p>
  <button class="btn sec" id="histBtn">Consultar días anteriores</button>
  <div class="row"><button class="btn ghost" id="refrescar">Actualizar datos</button><button class="btn ghost" id="salir">Cambiar de conductor</button></div>`;
  $('#histBtn').onclick = () => historial();
  v.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
    const r = b.dataset.r;
    if (S.sel.includes(r)) { if (S.sel.length > 1) S.sel = S.sel.filter(x => x !== r); }
    else S.sel = keys.filter(x => S.sel.includes(x) || x === r);
    persistir(); rutas();
  });
  v.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { S.pref = b.dataset.p; persistir(); rutas(); });
  $('#cambiarCam').onclick = () => camion('inicio');
  $('#estL').oninput = e => { S.estManual = e.target.value.replace(/\D/g, ''); };
  $('#ini').onclick = iniciar;
  $('#refrescar').onclick = async () => { const b = $('#refrescar'); ocupado(b, 'Actualizando…'); try { cargarDatos(await api('login', {})); toast('Datos actualizados'); rutas(); } catch (e) { libre(b); toast(esRed(e) ? 'Sin cobertura' : e.message); } };
  $('#salir').onclick = () => {
    const b = $('#salir');
    if (pendientes() && !(U.errServ && b.dataset.ok)) {

      if (!U.errServ) { toast('Hay datos sin enviar. Espera a tener cobertura.'); return; }
      b.dataset.ok = '1'; b.textContent = 'Salir y borrar ' + pendientes() + ' sin enviar'; b.style.color = 'var(--bad)';

    }
    S = Object.assign({}, S0, { cola: { recs: {}, cierres: [] }, dev: S.dev }); U.errServ = null; persistir(); pinView();
  };
  show('vRutas', 'Viaje de hoy', c.nombre + (keys.length ? ' · rutas ' + keys.map(x => +x).join(', ') : ''));
}

/* 1b. Elegir camión o darlo de alta */
const TIPOS = { D: { t: 'D.O.', l: 'D', esp: ['D'] }, O: { t: 'Oveja', l: 'O', esp: ['O'] }, CV: { t: 'Cabra + vaca', l: 'C', esp: ['C', 'V'] }, C: { t: 'Cabra', l: 'C', esp: ['C'] }, V: { t: 'Vaca', l: 'V', esp: ['V'] } };
function camion(mode) {
  U.camMode = mode; const v = $('#vCamion');
  const lst = camiones().filter(k => !(mode === 'trasvase' && k.id === S.cam));
  if (!U.nt) U.nt = { mat: '', lq: '', n: 3, tipos: ['D', 'O', 'CV'] };
  const nt = U.nt;
  v.innerHTML = `${mode === 'trasvase' ? `<div class="msg warn">Trasvase por avería. Elige el camión al que pasa la leche. Se cerrará el DeCA actual y se generará uno nuevo con la otra matrícula.</div>` : ''}
  ${lst.length ? `<span class="lbl">Camiones</span>
  <div class="stack">${lst.map(k => `<button class="farm${S.cam === k.id && mode !== 'trasvase' ? ' next' : ''}" data-k="${k.id}">
    <span class="main"><span class="name mono">${esc(k.matricula)}</span><span class="sub">${esc(k.desc)}${k.letraQ ? ' · Letra Q ' + esc(k.letraQ) : ''}${k.id === D().conductor.habitual ? ' · habitual' : ''}</span></span>
    <span class="comps">${letrasDe(k).map(x => `<span class="tank ${x.esp.length > 1 ? 'sp-MX' : 'sp-' + x.esp[0]}">${x.l}</span>`).join('')}</span></button>`).join('')}</div>` : ''}
  <div class="card stack">
    <span class="lbl">Otro camión</span>
    <div class="field"><label class="lbl" for="ntMat">Matrícula</label>
      <input class="big" id="ntMat" autocomplete="off" autocapitalize="characters" placeholder="0000-XXX" value="${esc(nt.mat)}" style="font-size:28px;font-family:var(--mono)"></div>
    <div class="field"><label class="lbl" for="ntLq">Código Letra Q de la cisterna</label>
      <div class="scan"><input id="ntLq" inputmode="numeric" autocomplete="off" placeholder="Etiqueta de la cisterna" value="${esc(nt.lq)}"><button id="ntLqScan">Escanear</button></div>
      <span class="small muted">Está en la etiqueta con código de barras pegada en la cisterna. Si no la encuentras, déjalo vacío.</span></div>
    <span class="lbl">Compartimentos</span>
    <div class="row">${[1, 2, 3, 4, 5].map(n => `<button class="btn ${nt.n === n ? '' : 'sec'}" data-n="${n}" style="padding:10px;min-height:48px">${n}</button>`).join('')}</div>
    <div class="stack">${Array.from({ length: nt.n }, (_, i) => `<div class="field"><span class="small muted">Compartimento ${i + 1}</span>
      <div class="dests">${Object.entries(TIPOS).map(([k, t]) => `<button class="dest" aria-pressed="${nt.tipos[i] === k}" data-ci="${i}" data-t="${k}" style="padding:6px;min-height:48px"><b style="font-size:13px;font-family:var(--body)">${t.t}</b></button>`).join('')}</div></div>`).join('')}</div>
    <div id="ntMsg" hidden></div>
    <button class="btn" id="ntOk">Usar este camión</button>
  </div>`;
  v.querySelectorAll('[data-k]').forEach(b => b.onclick = () => elegido(b.dataset.k));
  $('#ntMat').oninput = e => { nt.mat = e.target.value.toUpperCase().replace(/\s/g, ''); e.target.value = nt.mat; };
  $('#ntLq').oninput = e => { nt.lq = e.target.value.trim(); };
  $('#ntLqScan').onclick = () => escanear(code => { nt.lq = code; $('#ntLq').value = code; });
  v.querySelectorAll('[data-n]').forEach(b => b.onclick = () => { nt.n = +b.dataset.n; while (nt.tipos.length < nt.n) nt.tipos.push('D'); nt.tipos.length = nt.n; camion(mode); });
  v.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => { nt.tipos[+b.dataset.ci] = b.dataset.t; camion(mode); });
  $('#ntOk').onclick = () => {
    const m = $('#ntMsg'), err = t => { m.hidden = false; m.className = 'msg bad'; m.textContent = t; };
    if (nt.mat.replace(/[^A-Z0-9]/g, '').length < 5) return err('Escribe la matrícula completa. Sale en el DeCA.');
    const letras = [], usadas = {}; let nD = 0;
    for (const k of nt.tipos) {
      const t = TIPOS[k]; let l = t.l;
      if (l === 'D') { nD++; if (nD === 2) l = 'd'; else if (nD > 2) return err('Como mucho dos compartimentos de D.O. (D y d).'); }
      if (usadas[l]) return err(`Dos compartimentos serían ${l}. La oficina no podría distinguirlos: cambia uno.`);
      usadas[l] = 1; letras.push({ l, esp: t.esp, mezcla: [] });
    }
    const id = 'NUEVO-' + nt.mat;
    S.nuevosCam = S.nuevosCam.filter(k => k.id !== id).concat([{ id, matricula: nt.mat, desc: `Cisterna ${nt.n} comp. · alta del conductor`, letraQ: nt.lq, letras, nuevo: true }]);
    U.nt = null; persistir(); elegido(id);
  };
  show('vCamion', mode === 'trasvase' ? 'Trasvase' : 'Camión de hoy', D().conductor.nombre);
}
function elegido(id) {
  if (U.camMode === 'trasvase') { U.camNuevo = id; U.map = null; trasvase(); }
  else { S.cam = id; persistir(); rutas(); }
}
const camionPayload = k => k.nuevo ? { matricula: k.matricula, letraQ: k.letraQ || '', letras: k.letras } : k.id;
function adoptarCamion(resp, localId) {
  if (resp.camion && !CAM(resp.camion.id)) D().camiones.push(resp.camion);
  if (resp.camion) { S.nuevosCam = S.nuevosCam.filter(k => k.id !== localId); return resp.camion.id; }
  return localId;
}

/* 2. Iniciar viaje: genera el DeCA en el servidor */
async function iniciar() {
  if (U.ocupado) return;
  const b = $('#ini'), m = $('#iniMsg');
  const seen = new Set(), list = [];
  S.sel.forEach(r => ganRuta(r).forEach(g => { if (seen.has(kg(g))) return; seen.add(kg(g)); list.push({ cod: g.cod, esp: g.esp, k: kg(g), ruta: r, ord: g.ord }); }));
  const est = Math.round(num($('#estL').value) || 0);
  if (!(est > 0)) { m.hidden = false; m.className = 'msg bad'; m.textContent = 'Escribe los litros estimados de hoy. El DeCA no puede salir con 0 kg.'; $('#estL').focus(); return; }
  const id = 'V' + Date.now().toString(36).toUpperCase() + '-' + D().conductor.id;
  ocupado(b, 'Generando DeCA…');
  try {
    const r = await api('iniciarViaje', { viaje: { id, rutas: S.sel, pref: pref(), camion: camionPayload(T()), estLitros: est, confirmado: !!U.otroViaje } });
    if (r.hoy) { S.datos.hoy = r.hoy; persistir(); }
    if (r.aviso) {
      libre(b); m.hidden = false; m.className = 'msg bad';
      m.innerHTML = `<p><b>Hoy ya se ha hecho ${S.sel.length > 1 ? 'esta ruta' : 'la ruta ' + (+S.sel[0])}:</b></p><p class="small">${r.aviso.map(v => esc(txtViaje(v))).join('<br>')}</p>
        <p style="margin-top:6px">Si es un segundo viaje de verdad, confírmalo. Si no, no lo inicies: se repetirían los ganaderos.</p>
        <button class="btn" id="otroOk" style="margin-top:10px;background:var(--bad);box-shadow:none">Sí, es otro viaje. Iniciar</button>`;
      $('#otroOk').onclick = () => { U.otroViaje = true; iniciar(); };
      return;
    }
    U.otroViaje = false;
    S.cam = adoptarCamion(r, S.cam);
    S.viaje = Object.assign({}, r.viaje, { rutas: S.sel.slice(), prefijo: pref(), est, empezado: false });
    S.cadena = [r.viaje.id]; S.decas = []; S.list = list; S.rec = {}; S.lastI = null; S.estManual = '';
    persistir(); U.vistaPrev = null; deca();
  } catch (e) {
    libre(b); m.hidden = false; m.className = 'msg bad';
    m.textContent = esRed(e) ? 'Sin cobertura: el DeCA necesita conexión para generarse. Busca cobertura y vuelve a pulsar.' : e.message;
  }
}
// Lo ya recogido HOY en otros viajes (de esta u otra app): para no repetir la ruta por error
const HOY = () => (D() && D().hoy) || { viajes: [], recs: {} };
const hoyOtro = k => { const h = HOY().recs[k]; return h && !(S.cadena || []).includes(h.viaje) ? h : null; };
const viajesHoy = rs => HOY().viajes.filter(v => !(S.cadena || []).includes(v.id) && String(v.rutas).split(/[,\s]+/).some(r => rs.map(x => String(+x)).includes(String(+r))));
const txtViaje = v => `DeCA ${v.deca} · ${v.matricula} · ${v.ini}${v.fin ? '–' + v.fin : ''}${/CURSO/.test(v.estado) ? ' (sin cerrar)' : ''} · ${fmt(v.litros)} l${v.conductor !== D().conductor.id ? ' · ' + v.conductor : ''}`;
// Un mismo ganadero puede tener dos especies (oveja y cabra): cada especie es una parada distinta (clave código|especie)
const kg = g => g.cod + '|' + g.esp;
const gan = k => D().ganaderos.find(g => kg(g) === k) || D().ganaderos.find(g => g.cod === k) || { cod: String(k).split('|')[0], nom: String(k).split('|')[0], esp: String(k).split('|')[1] || 'O', dl: '', pue: '', ult: 0 };

function deca() {
  const c = D().conductor, cfg = CFG(), V = S.viaje, enCurso = V.empezado, v = $('#vDeca');
  v.innerHTML = `${V.trasvase ? `<div class="msg warn">DeCA nuevo por trasvase. Sustituye al ${esc(V.trasvase.anterior)} (${esc(V.trasvase.desde)}), cerrado con ${fmt(V.trasvase.litros)} l.</div>` : ''}
  <div class="msg ok">${enCurso ? 'Viaje en curso.' : 'DeCA generado. Ya puedes salir.'} Emitido a las ${esc(V.hora)}.</div>
  <div class="card deca"><div id="qr" aria-label="Código QR del DeCA"></div>
    <dl class="kv">
      <dt>Nº</dt><dd class="mono">${esc(V.decaNum)}</dd>
      <dt>Cargador</dt><dd>${esc(cfg.cargador)}</dd>
      <dt>Transportista</dt><dd>${esc(c.transportista)}</dd>
      <dt>Matrícula</dt><dd class="mono">${esc(V.matricula)}</dd>
      ${V.letraQ ? `<dt>Cisterna Letra Q</dt><dd class="mono">${esc(V.letraQ)}</dd>` : ''}
      <dt>Rutas</dt><dd>${V.rutas.map(x => +x).join(' y ')}</dd>
      <dt>Mercancía</dt><dd>${esc(cfg.mercancia || 'Leche cruda')}</dd>
      <dt>Peso estimado</dt><dd class="num">${fmt(V.est * (cfg.factorKg || 1.03))} kg</dd>
      <dt>Destino</dt><dd>${esc(cfg.destino)}</dd>
    </dl></div>
  <a class="btn sec" href="${esc(V.decaUrl)}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center">Abrir el PDF</a>
  <p class="small muted">Si te para la Guardia Civil, enseña esta pantalla: el QR descarga el PDF sin pedir clave. Durante el viaje lo tienes siempre en el botón <b>DeCA</b> de arriba.</p>
  <button class="btn" id="go">${enCurso ? 'Volver a la recogida' : 'Empezar recogida'}</button>
  ${anulable() ? '<button class="btn ghost" id="anular">Me he equivocado: anular este viaje</button>' : ''}`;
  try { new QRCode($('#qr'), { text: V.decaUrl, width: 130, height: 130, colorDark: '#1d1618', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { $('#qr').innerHTML = '<p class="small">QR no disponible</p>'; }

/* Anular un viaje iniciado por error (sin ningún ganadero apuntado) */
const anulable = () => S.viaje && !Object.keys(S.rec).length && (S.cadena || []).length <= 1 && !pendientes();
function anular() {
  const v = U.view === 'vDeca' ? $('#vDeca') : $('#vLista'), b = $('#anular');

    b.insertAdjacentHTML('beforebegin', '<div class="msg warn" id="anuMsg">Se anulará el DeCA ' + esc(S.viaje.decaNum) + '. No se envía nada a la oficina y podrás iniciar el viaje de nuevo cuando toque.</div>');

  api('anularViaje', { viajeId: S.viaje.id }).then(() => {

}

/* 3. Lista de ganaderos */
function siguiente() {
  const L = S.list, desde = S.lastI == null ? -1 : S.lastI;
  let k = L.findIndex((x, j) => j > desde && !S.rec[x.k]);
  if (k < 0) k = L.findIndex(x => !S.rec[x.k]);
  return k;
}
function lista() {
  const L = S.list, done = L.filter(x => S.rec[x.k]).length, next = siguiente(), tot = totales();

  v.innerHTML = `${nx ? `<div class="next-card">

  </div>

  <div class="stack">${L.map((x, i) => {

    const st = r ? (r.sin ? 'No recogido' : xs.length

      : fmt(r.litros) + ' l · ' + r.dest) : ho ? `<span style="color:var(--bad)">Ya hoy ${esc(ho.hora)}<br>${fmt(ho.l)} l</span>` : (i === next ? 'Siguiente' : '');
    const prevRuta = i > 0 && L[i - 1].ruta !== x.ruta;
    const cambio = i > 0 && !prevRuta && grp(gan(L[i - 1].k).esp) !== grp(g.esp);
    return `${prevRuta || (i === 0 && S.viaje.rutas.length > 1) ? `<span class="lbl" style="margin-top:6px">Ruta ${+x.ruta}</span>` : ''}${cambio ? `<span class="small" style="color:var(--warn);font-weight:700;padding-left:4px">↓ Cambio de manguera: ${grp(g.esp) === 'OV' ? 'vaca/cabra → oveja' : 'oveja → vaca/cabra'}</span>` : ''}
      <button class="farm ${cls} ${bgEsp(g.esp)}" data-i="${i}"><span class="n">${i + 1}</span>

  <button class="btn ${done === L.length ? '' : 'sec'}" id="fin">Terminar viaje</button>
  <button class="btn ghost" id="averia">Avería: trasvase a otro camión</button>

  if ($('#anular')) $('#anular').onclick = anular;
  v.querySelectorAll('[data-i]').forEach(b => b.onclick = () => ficha(+b.dataset.i));
  if (nx) $('#anotar').onclick = () => ficha(next);

  $('#averia').onclick = () => camion('trasvase');
  show('vLista', 'Ruta ' + S.viaje.rutas.map(x => +x).join(' y '), `${T().matricula} · DeCA ${S.viaje.decaNum}`);

/* 4. Ficha de recogida */
function ficha(i) {

    <button class="btn ghost" id="sin">Hoy no se recoge</button>`;
  const drawDests = () => {
    $('#dests').innerHTML = comps().map(c => `<button class="dest ${bgComp(c)}" aria-pressed="${c.id === dest}" data-d="${c.id}">
      <b class="${spClass(c)}">${c.id}</b><small>${compLabel(c)}</small>${c.id === hab ? '<span class="hab">habitual</span>' : ''}</button>`).join('');
    $('#dests').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { dest = b.dataset.d; confirmMix = false; drawDests(); drawArr(); drawRep(); chkCap(); });

    if (!k.ok) { m.hidden = false; m.className = 'msg bad'; m.textContent = mezclaMsg(g.esp, comp(dest)) + ' Si no hay otro sitio, puedes guardarla igualmente y quedará como incidencia.'; }
    else if (k.warn) { m.hidden = false; m.className = 'msg ' + (k.bad ? 'bad' : 'warn'); m.textContent = k.warn; }
    else if (dest !== hab) { m.hidden = false; m.className = 'msg warn'; m.textContent = `Cambiado. Lo habitual es ${hab}.`; }
    else m.hidden = true;

  let confirmMix = !!r.mezcla, confirmDup = !!r.litros;
  drawDests();
  // Hasta tres destinos: el principal, el arrastre de manguera (oveja → vaca/cabra) y lo que no cabe (reparto)
  const otros = () => comps().filter(c => c.id !== dest);
  // Lo que ya lleva cada compartimento sin contar esta recogida
  const llevaYa = () => { const t = {}; comps().forEach(c => t[c.id] = 0); recsViaje().filter(y => y.recId !== r.recId).forEach(y => addTot(t, y)); return t; };
  const mejorOtro = () => {   // compatible > compatible con aviso > otro que no sea D.O. > el resto; a igualdad, el que tenga más sitio
    const t = llevaYa(), libre = c => c.cap ? c.cap - (t[c.id] || 0) : 1e9;
    const nota = c => { const k = compat(g.esp, c); return k.ok && !k.warn ? 0 : k.ok ? 1 : !c.esp.includes('D') ? 2 : 3; };
    return (otros().sort((a, b) => nota(a) - nota(b) || libre(b) - libre(a))[0] || {}).id; };
  const esOV = grp(g.esp) === 'OV' && vcComps().length > 0;
  // Recogidas guardadas con la v6–v8 (un solo "otro compartimento"): si era reparto, pasa al panel de reparto
  let rArr = r.arr && r.arr.tipo !== 'reparto' ? r.arr : null, rRep = r.rep || (r.arr && r.arr.tipo === 'reparto' ? r.arr : null);
  if (r.arr && r.arr.tipo === 'reparto' && r.rep) rArr = r.arr;
  let arrOn = !!rArr, arrDest = rArr ? rArr.dest : (vcComps()[0] || {}).id;
  let repOn = !!rRep, repDest = rRep ? rRep.dest : null;
  const vArr = () => arrOn ? (num($('#arrL').value) || 0) : 0, vRep = () => repOn ? (num($('#repL').value) || 0) : 0;
  let drawArr = () => {}, drawRep = () => {};
  const resumen = () => {
    const el = $('#repRes'), l = num($('#lit').value) || 0, a = vArr(), p = vRep();

      : `En <b>${esc(dest)}</b> quedan unos <b>${fmt(libre)} l</b> (lleva ${fmt(lleva)} de ${fmt(c.cap)}). Si no cabe todo, pasa el resto a otro compartimento.
      ${otros().length ? `<button class="btn sec" id="capOk" style="margin-top:8px">Pasar ${fmt(resto)} l a otro compartimento</button>` : ''}`;
    const ba = $('#capAll'); if (ba) ba.onclick = () => { dest = alt; confirmMix = false; repOn = false; $('#repL').value = ''; drawDests(); drawArr(); drawRep(); };
    const b = $('#capOk'); if (b) b.onclick = () => { repOn = true; $('#repL').value = Math.round(vRep() + resto); if (!repDest || repDest === dest) repDest = mejorOtro(); drawRep(); $('#repL').scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  };
  if (esOV) {
    $('#arrBox').hidden = false;
    const prev = i > 0 ? gan(S.list[i - 1].k) : null, next = i < S.list.length - 1 ? gan(S.list[i + 1].k) : null;
    const hint = prev && grp(prev.esp) === 'VC' ? `Vienes de ${labelEsp(prev.esp).toLowerCase()}: el arrastre del principio va a vaca/cabra.`
      : next && grp(next.esp) === 'VC' ? `El siguiente es ${labelEsp(next.esp).toLowerCase()}: si cambias la llave antes, anota aquí lo que pase.` : '';
    if (hint) { $('#arrHint').hidden = false; $('#arrHint').textContent = hint; if (!r.litros) arrOn = true; }
    if (rArr) $('#arrL').value = rArr.l;
    drawArr = () => {
      const vc = vcComps().filter(c => c.id !== dest);
      if (!vc.some(c => c.id === arrDest)) arrDest = (vc[0] || {}).id;
      $('#arrBody').hidden = !arrOn;
      $('#arrTog').textContent = arrOn ? 'Quitar arrastre' : 'Arrastre de manguera (a vaca/cabra)';
      $('#arrDests').innerHTML = vc.map(c => `<button class="dest ${bgComp(c)}" aria-pressed="${c.id === arrDest}" data-a="${c.id}"><b class="${spClass(c)}">${c.id}</b><small>${compLabel(c)}</small></button>`).join('');
      $('#arrDests').querySelectorAll('[data-a]').forEach(b => b.onclick = () => { arrDest = b.dataset.a; drawArr(); });
      const a = num($('#arrL').value), m = $('#arrMsg');
      if (a > cf.arrastreAviso) { m.hidden = false; m.className = 'msg bad'; m.textContent = `Más de ${cf.arrastreAviso} l de ${labelEsp(g.esp).toLowerCase()} en ${arrDest}: ya no es arrastre, se anota como mezcla.`; }
      else m.hidden = true;
      resumen(); chkCap();
    };
    $('#arrTog').onclick = () => { arrOn = !arrOn; if (!arrOn) $('#arrL').value = ''; drawArr(); };
    $('#arrQuick').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { $('#arrL').value = b.dataset.q; drawArr(); });
    $('#arrL').oninput = drawArr;
  }
  if (comps().length > 1) {
    $('#repBox').hidden = false;
    if (rRep) $('#repL').value = rRep.l;
    drawRep = () => {
      if (!repDest || repDest === dest) repDest = mejorOtro();
      $('#repBody').hidden = !repOn;
      $('#repTog').textContent = repOn ? 'Quitar: todo cabe en ' + dest : 'No cabe todo: parte a otro compartimento';
      $('#repDests').innerHTML = otros().map(c => `<button class="dest ${bgComp(c)}" aria-pressed="${c.id === repDest}" data-p="${c.id}"><b class="${spClass(c)}">${c.id}</b><small>${compLabel(c)}</small></button>`).join('');
      $('#repDests').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { repDest = b.dataset.p; drawRep(); });
      const m = $('#repMsg'), c2 = comp(repDest), k2 = c2 ? compat(g.esp, c2) : { ok: true };
      if (c2 && !k2.ok) { m.hidden = false; m.className = 'msg bad'; m.textContent = mezclaMsg(g.esp, c2) + ' Quedará anotado como mezcla.'; }
      else if (c2 && k2.warn) { m.hidden = false; m.className = 'msg ' + (k2.bad ? 'bad' : 'warn'); m.textContent = k2.warn; }
      else m.hidden = true;

    };
    $('#repTog').onclick = () => { repOn = !repOn; if (!repOn) $('#repL').value = ''; drawRep(); };
    $('#repL').oninput = drawRep;
  }
  drawArr(); drawRep(); chkCap();
  const chkLit = () => { const l = num($('#lit').value), m = $('#litMsg');
    if (l > 0 && g.ult > 0 && Math.abs(l - g.ult) / g.ult > 0.4) { m.hidden = false; m.className = 'msg warn'; m.textContent = `Muy distinto de la última recogida (${fmt(g.ult)} l). Si hoy lleva dos días de leche es normal; si no, comprueba el dato.`; } else m.hidden = true; };
  const chkTmp = () => { const t = num($('#tmp').value), m = $('#tmpMsg');
    if (isNaN(t)) { m.hidden = true; return; } m.hidden = false;
    if (t > cf.tempAlerta) { m.className = 'msg bad'; m.textContent = `Por encima de ${cf.tempAlerta} °C. Avisa a fábrica antes de cargar.`; }
    else if (t > cf.tempAviso) { m.className = 'msg warn'; m.textContent = `Por encima de ${cf.tempAviso} °C (recogida en días alternos). Quedará anotado como incidencia.`; }
    else { m.className = 'msg ok'; m.textContent = 'Temperatura correcta.'; } };
  $('#lit').oninput = () => { chkLit(); chkCap(); resumen(); }; chkCap(); resumen(); $('#tmp').oninput = chkTmp; chkLit(); chkTmp();
  $('#scanBtn').onclick = () => escanear(code => { $('#mue').value = code; });
  const guardarFicha = (sin) => {
    const l = Math.round(num($('#lit').value)), t = num($('#tmp').value), mu = $('#mue').value.trim(), e = $('#err');
    if (!sin) {
      const falta = []; if (!(l > 0)) falta.push('litros'); if (isNaN(t)) falta.push('temperatura'); if (!mu) falta.push('muestra');
      if (falta.length) { e.hidden = false; e.textContent = 'Falta: ' + falta.join(', ') + '.'; e.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
      const ho = hoyOtro(kg(g));
      if (ho && !confirmDup) {
        e.hidden = false;
        e.innerHTML = `<p>Este ganadero <b>ya se ha recogido hoy</b> a las ${esc(ho.hora)} con ${fmt(ho.l)} l (DeCA ${esc(ho.deca)}).</p><p style="margin-top:6px">¿Es otra recogida distinta?</p>
          <button class="btn" id="dupOk" style="margin-top:10px;background:var(--bad);box-shadow:none">Sí, es otra recogida. Guardar</button>`;
        $('#dupOk').onclick = () => { confirmDup = true; guardarFicha(false); };
        e.scrollIntoView({ block: 'center', behavior: 'smooth' }); return;
      }
      if (!compat(g.esp, comp(dest)).ok && !confirmMix) {
        e.hidden = false;
        e.innerHTML = `<p>${esc(mezclaMsg(g.esp, comp(dest)))}</p><p style="margin-top:6px">¿La leche va ahí de verdad?</p>
          <button class="btn" id="mixOk" style="margin-top:10px;background:var(--bad);box-shadow:none">Sí, va mezclada. Guardar</button>`;
        $('#mixOk').onclick = () => { confirmMix = true; guardarFicha(false); };

      if (a + p > 0 && a + p >= l) { e.hidden = false; e.textContent = 'Lo que va a otros compartimentos tiene que ser menos que el total del ganadero.'; return; }
      if (a > 0) {

      }
    }
    const viajeId = r.viajeId || S.viaje.id;
    const rec = {
      recId: viajeId + '-' + g.cod + '-' + g.esp, viajeId, fecha: hoyTxt(), hora: hhmm(), ruta: x.ruta, ord: x.ord, cod: g.cod, esp: g.esp,

/* 1c. Trasvase por avería */
function trasvase() {

  if (!U.map) { U.map = {}; comps().forEach(o => { const d = nc.find(d => d.l === o.l && okPara(o, d)) || nc.find(d => okPara(o, d)) || nc[0]; U.map[o.id] = d.id; }); }
  const conL = comps().filter(o => tot[o.id] > 0);
  const destDe = o => nc.find(d => d.id === U.map[o.id]);
  const errores = conL.filter(o => !okPara(o, destDe(o)));
  v.innerHTML = `<div class="card stack"><span class="lbl">De <span class="mono">${esc(T().matricula)}</span> a <span class="mono">${esc(nuevo.matricula)}</span></span>

  ${conL.length ? conL.map(o => `<div class="card stack">
    <div class="route-head"><span><span class="tank ${spClass(o)}">${o.id}</span> <span class="small muted">${compLabel(o)}</span></span><b class="num">${fmt(tot[o.id])} l</b></div>
    <span class="lbl">Pasa a</span>
    <div class="dests">${nc.map(d => `<button class="dest ${bgComp(d)}" aria-pressed="${U.map[o.id] === d.id}" data-o="${o.id}" data-d="${d.id}"><b class="${spClass(d)}">${d.id}</b><small>${compLabel(d)}</small></button>`).join('')}</div>
    ${!okPara(o, destDe(o)) ? `<div class="msg bad">${compLabel(o)} a un compartimento de ${compLabel(destDe(o))}: se mezclan${destDe(o).esp.includes('D') ? ' y deja de ser D.O.' : ''}. Si no hay otro sitio, confirma igualmente y quedará como incidencia.</div>` : ''}
  </div>`).join('') : `<div class="msg ok">Todavía no hay leche recogida. Solo cambian el camión y el DeCA.</div>`}
  <div id="trMsg" hidden></div>
  <button class="btn" id="trOk" ${errores.length ? 'style="background:var(--bad);box-shadow:none"' : ''}>${errores.length ? 'Confirmar trasvase con mezcla' : 'Confirmar trasvase'}</button>`;
  v.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { U.map[b.dataset.o] = b.dataset.d; trasvase(); });
  $('#trOk').onclick = async () => {
    if (U.ocupado) return;

    const pend = S.list.filter(x => !S.rec[x.k]).reduce((a, x) => a + (gan(x.k).ult || 0), 0);
    const id = 'V' + Date.now().toString(36).toUpperCase() + '-' + D().conductor.id;
    ocupado(b, 'Generando DeCA nuevo…');
    try {
      const r = await api('trasvase', { viajeId: S.viaje.id, litrosHasta: litros,
        nuevo: { id, rutas: S.viaje.rutas, pref: S.viaje.prefijo, camion: camionPayload(nuevo), estLitros: litros + pend } });
      const antes = { num: S.viaje.decaNum, matricula: S.viaje.matricula, litros };
      const map = Object.assign({}, U.map);
      S.cam = adoptarCamion(r, nuevo.id);
      // Las recogidas ya hechas pasan a figurar en el compartimento del camión nuevo (se reenvían)
      recsViaje().forEach(x => { if (x.sin) return; x.destOrig = x.destOrig || x.dest; x.dest = map[x.dest] || x.dest; x.letra = (comp(x.dest) || {}).l || x.letra; x.noHabitual = true; x.mezcla = x.mezcla || !compat(x.esp, comp(x.dest)).ok; if (x.arr) x.arr.dest = map[x.arr.dest] || x.arr.dest; if (x.rep) x.rep.dest = map[x.rep.dest] || x.rep.dest; S.cola.recs[x.recId] = x; });
      S.decas.push(antes);
      S.viaje = Object.assign({}, r.viaje, { rutas: S.viaje.rutas, prefijo: S.viaje.prefijo, est: litros + pend, empezado: true,
        trasvase: { anterior: antes.num, desde: antes.matricula, litros } });

}

/* 8. RECEPCIÓN EN FÁBRICA (PIN con ROL RECEPCION; la oficina entra desde su pantalla).
   Por camión: cada compartimento en el orden de descarga con su parcial de contador, controles y reparto a silos.
   Al final, el total del contador del camión (debe ser la suma de los parciales), limpieza de cisterna y filtro. */
const R = { viajes: null, deps: [], hasta: '', ed: null };
const ESPS = { D: 'Oveja D.O.', O: 'Oveja', C: 'Cabra', V: 'Vaca' };

  return (k.esps.length && k.esps.every(e => e === 'D' || e === 'O')) || (d && /oveja|d\.?o/i.test(d.uso) && !/mezcla/i.test(d.uso)); };
// Lo que ha entrado hoy en un depósito (recepciones guardadas + agua) y el tipo de leche que resulta
function contenidoDep(dep) {
  const items = [];
  (R.viajes || []).filter(x => x.recep && x.recep.comps).forEach(x => x.recep.comps.forEach(c => c.reps.forEach(r => {
    if (r.dep === dep) items.push({ hora: x.recep.hora, quien: x.conductor, mat: x.matricula, comp: c.id, esp: c.esp, l: r.l, tipo: r.tipo });
  })));
  (R.agua || []).filter(a => a.dep === dep).forEach(a => items.push({ hora: '', quien: 'Agua de arrastre', mat: '', comp: a.cod, esp: 'AGUA', l: a.l, tipo: 'AGUA' }));
  const esps = [...new Set(items.filter(i => i.esp !== 'AGUA' && i.l > 0).map(i => i.esp))];

  if (esps.length) tipo = esps.every(e => e === 'D') ? 'Oveja D.O.' : esps.every(e => e === 'D' || e === 'O') ? 'Oveja' : esps.length === 1 ? (ESPS[esps[0]] || esps[0]) : 'Mezcla';

/* Repintar una pantalla al salir de una casilla sin perder el sitio: si se ha pulsado otra casilla o un botón,

function recepCamion(x) {
  // Borrador de la recepción: se parte de lo guardado o de los compartimentos del camión (en su orden)

  const base = x.comps.map(c => ({ id: c.id, esp: espComp(c), decl: c.decl || 0, cap: c.cap || 0, n: c.n || 0 }));
  const nBase = id => String((base.find(b => b.id === id) || {}).n || '');
  const comps = prev ? prev.comps.map((c, k) => Object.assign({ decl: (base.find(b => b.id === c.id) || {}).decl || 0 }, c, { nComp: c.nComp || nBase(c.id), ord: k + 1, contador: String(c.contador), reps: c.reps.map(p => Object.assign({}, p, { l: String(p.l) })) })) : [];
  base.forEach(b => { if (!comps.find(c => c.id === b.id)) comps.push({ id: b.id, esp: b.esp, decl: b.decl, nComp: nBase(b.id), ord: 0, contador: '', temp: '', ph: '', dornic: '', visual: 'C', reps: [] }); });
  if (x.unico) comps.forEach(c => { c.ord = 1; });
  R.ed = { x, comps, nMax: Math.min(4, x.otra ? 4 : (x.nCompCam || Math.max(0, ...base.map(b => b.n)) || comps.length)), total: prev && prev.total ? String(prev.total) : '', limpieza: prev ? prev.limpieza || 'C' : 'C', filtro: prev ? prev.filtro || 'C' : 'C', obs: prev ? prev.obs || '' : '' };

}

      <div><span class="tiny">Depósito</span><div class="d5">${silos.map(s => { const k = contenidoDep(s); return `<button class="dest" aria-pressed="${ppal(c) === s}" data-silo="${s}" data-i="${i}"><b style="font-size:20px">${s}</b><small style="font-size:10px">${esc(k.tipo || '')}</small></button>`; }).join('')}</div></div>
      ${ppal(c) && usoMalo(c.esp, ppal(c)) ? `<div class="msg bad" style="padding:6px 10px">¡Atención! ${esc(ESPS[c.esp])} al ${ppal(c)}, que lleva oveja/D.O.: pasaría a mezcla.</div>` : ''}
      ${extras(c).map((p, j) => `<div class="xbox"><span class="tiny">${p.tipo === 'ARRASTRE' ? 'Arrastre a' : 'Parte a'}</span>
        <div class="d5">${silos.map(s => `<button class="dest" aria-pressed="${p.dep === s}" ${s === ppal(c) ? 'disabled style="opacity:.35"' : ''} data-xdep="${s}" data-i="${i}" data-j="${j}"><b>${s}</b></button>`).join('')}</div>
        <div class="xrow"><div class="unit"><input class="sm" style="font-size:22px" data-xl="${i}" data-j="${j}" inputmode="numeric" value="${esc(p.l)}"><span>l</span></div>
          ${[100, 500, 1000].map(q => `<button class="btn sec" data-q="${q}" data-i="${i}" data-j="${j}">${q}</button>`).join('')}<button class="lnk" data-xdel="${i}" data-j="${j}">✕</button></div></div>`).join('')}
      ${1 + extras(c).length < 3 ? `<div class="row" style="gap:6px"><button class="lnk" data-xadd="${i}" data-t="ARRASTRE">+ Arrastre</button><button class="lnk" data-xadd="${i}" data-t="OTRO">+ Otro dep.</button></div>` : '<p class="small muted" style="margin:0">Máximo 3 depósitos por compartimento (como en el programa).</p>'}
      ${ppal(c) && num(c.contador) ? `<p class="small" style="margin:0"><b>${fmt(resto(c))} l al ${ppal(c)}</b>${extras(c).map(p => ` · ${fmt(num(p.l) || 0)} l al ${esc(p.dep || '¿?')}`).join('')}</p>` : ''}
      ${resto(c) < 0 ? '<div class="msg bad">Lo pasado a otros depósitos es más que el parcial.</div>' : ''}
      ${x.unico && E.comps.length === 1 ? '' : `<div style="text-align:right"><button class="lnk" data-unord="${i}" style="flex:0">${x.otra ? 'Quitar este compartimento' : 'No era este (quitar del orden)'}</button></div>`}
    </div></div>`).join('')}
    ${pend.map(c => `<button class="card pendc ${bgEsp(c.esp)}" data-sel="${E.comps.indexOf(c)}"><b class="sp-${esc(c.esp)}" style="font-size:34px;font-family:var(--mono)">${esc(c.id)}</b><span>${esc(ESPS[c.esp] || '')}${ofi && c.decl ? ' · ' + fmt(c.decl) + ' l' : ''}</span>${c.nComp ? `<span class="small muted">suele ir en el comp. ${esc(c.nComp)} de la cisterna</span>` : ''}
      <span class="btn" style="width:auto;min-height:44px;padding:8px 14px">${desc.length ? 'Descargo este ahora' : 'Empiezo por este'}</span><span class="small muted">${desc.length ? `será el ${desc.length + 1}º` : 'será el 1º'}</span></button>`).join('')}
    ${x.otra ? `<div class="card stack pendc" style="cursor:default"><span class="tiny">Otro compartimento</span><div class="d5" style="grid-template-columns:repeat(4,1fr)">${Object.entries(ESPS).map(([k, t]) => `<button class="dest ${bgEsp(k)}" data-addc="${k}"><b class="sp-${k}">+ ${k}</b><small style="font-size:10px">${t}</small></button>`).join('')}</div></div>` : ''}</div>
    ${pend.length && !desc.length ? '<p class="small muted">Toca el compartimento que empiezas a descargar. Si alguno viene vacío, déjalo sin tocar.</p>' : ''}
    ${x.otra || !ofi ? '' : `<div class="card stack" id="reCuadre">${cuadreHtml()}</div>`}
    <div class="card stack">
      <div class="camgrid">
        <div><span class="tiny">Total contador del camión</span><div class="unit"><input class="big" style="font-size:34px;padding:4px 12px" id="reTot" inputmode="numeric" value="${esc(E.total)}" placeholder="0"><span>l</span></div>
          <div id="reSuma" class="small">${tot ? (Math.round(tot) === Math.round(suma) ? `<span class="d-ok">Cuadra con los parciales (${fmt(suma)} l)</span>` : `<span class="d-bad">No cuadra: parciales ${fmt(suma)} l (dif. ${fmt(tot - suma)} l)</span>`) : `Suma de parciales: ${fmt(suma)} l`}</div></div>
        <div><span class="tiny">Limpieza cisterna</span><div class="tg">${['C', 'I'].map(k => `<button class="${E.limpieza === k ? 'on' + (k === 'I' ? ' bad' : '') : ''}" data-ci="limpieza" data-i="" data-val="${k}">${k === 'C' ? 'C correcto' : 'I incorrecto'}</button>`).join('')}</div></div>
        <div><span class="tiny">Limpieza filtro</span><div class="tg">${['C', 'I'].map(k => `<button class="${E.filtro === k ? 'on' + (k === 'I' ? ' bad' : '') : ''}" data-ci="filtro" data-i="" data-val="${k}">${k === 'C' ? 'C correcto' : 'I incorrecto'}</button>`).join('')}</div></div>
        <div><span class="tiny">Observaciones / acciones correctivas</span><input class="sm" id="reObs" style="font-size:18px" value="${esc(E.obs)}"></div>
      </div>
      <div id="reMsg" hidden></div>
      ${ofi ? '' : `<div class="field" style="max-width:360px"><label class="lbl" for="reFirma">Firma: PIN de quien hace la recepción</label><input class="big" id="reFirma" type="password" inputmode="numeric" autocomplete="off" style="font-size:28px;letter-spacing:.3em" placeholder="••••"></div>`}
      <button class="btn" id="reGuardar">${ofi ? 'Guardar recepción' : 'Firmar y guardar recepción'}</button>
      ${x.recep ? `<button class="btn ghost" id="reAnular" style="color:var(--bad)">Anular esta recepción (prueba o error)</button>
      <div class="card stack" id="reAnu" hidden style="border:2px solid var(--bad)">
        <b>Anular la recepción de ${esc(x.matricula || '')} · ${esc(x.conductor)}</b>
        <p class="small">Se borra como si no se hubiera descargado: sale de los depósitos y el fichero del día <b>${esc(x.recep.fichero || '')}</b> se rehace sin este camión (al importarlo, el programa machaca lo anterior).${x.otra ? '' : ' El camión vuelve a «Por recibir».'} Queda apuntado en CAMBIOS.</p>
        <div class="field"><label class="lbl" for="reAnuMot">Motivo</label><input class="sm" id="reAnuMot" style="font-size:18px" placeholder="Ej.: era una prueba / puesto en el día equivocado"></div>
