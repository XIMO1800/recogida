<style>
/* Tema único claro, a propósito: se usa en la cabina y al sol, necesita el máximo contraste. */
:root{
  color-scheme:light;
  --brand:#862133; --brand-deep:#6a1010; --brand-soft:#f7e8eb; --brand-ink:#ffffff;
  --gold:#c4952b; --gold-soft:#fbf1dc;
  --bg:#f2efee; --surface:#ffffff; --surface2:#f7f4f3; --ink:#1d1618; --muted:#6a5f61; --line:#ddd4d5;
  --accent:var(--brand); --accent-ink:#fff; --accent-soft:var(--brand-soft);
  --ok:#1e7443; --ok-soft:#e1f2e7; --warn:#9c5c00; --warn-soft:#fdf0d8; --bad:#c0262d; --bad-soft:#fde4e4;
  --sp-do:#1c6b35; --sp-ov:#1d5796; --sp-ca:#b3262d; --sp-va:#5a5254;   /* texto: colores del tapón del bote de muestra */
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
/* Recepción: pantalla de cuadro (15" o más, horizontal) */
body.ancho .app,body.ancho .top-in{max-width:1180px}
.recgrid{display:grid;gap:12px}
@media (min-width:900px){.recgrid{grid-template-columns:repeat(2,minmax(0,1fr))}body.ancho .big{font-size:40px}}
.ordn{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.ordb{border:2px solid var(--line);background:#fff;border-radius:10px;min-width:44px;min-height:40px;font-weight:700;font-size:16px}.ordb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tl{display:grid;grid-template-columns:auto auto 1fr;gap:6px 12px;align-items:center}.tl .n{font-family:var(--display);font-size:24px;font-weight:700;color:var(--muted)}.tl .tag{font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}.tl .tag{margin-left:10px}.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.g2 .farm{min-height:0;padding:8px 12px;margin:0}.g2 .farm .comps .tank{font-size:11px;padding:1px 5px}
.r2otra{border-style:dashed!important;justify-content:center}.r2otra .name{color:var(--brand)}
@media (max-width:700px){.g2{grid-template-columns:1fr}}
.vm{display:grid;grid-template-columns:1fr 1fr;gap:8px}[data-mz]:disabled{opacity:.4;cursor:not-allowed}.vm .tg .tiny{min-width:0!important;margin-right:4px}.tl .ini{background:#e1ecf9;color:#1d5796}.tl .fin{background:#fde4e4;color:#b3262d}
.dep-card{display:flex;flex-direction:column;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;gap:1px;cursor:pointer;font:inherit;color:inherit}.dep-card:active{background:var(--brand-soft)}
.rc .tiny,.tiny{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chead{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.chead .cel{display:flex;align-items:center;gap:6px;min-height:44px;flex-wrap:wrap}
.rc>.card{position:relative;overflow:hidden}.ctop{gap:8px;padding:12px;background:rgba(255,255,255,.35);border-bottom:2px solid var(--cb,var(--line))}.cmid{gap:8px;padding:10px 12px 12px;border-bottom:2px solid var(--cb,var(--line))}.cbot{gap:8px;padding:10px 12px 12px;background:rgba(0,0,0,.025)}.chead .ordd{position:absolute;top:7px;left:7px;font-family:var(--display);font-size:15px;line-height:1;font-weight:700;color:var(--cs,var(--muted));opacity:.75;border:1.5px solid var(--cb,var(--line));border-radius:8px;padding:4px 6px}.chead .cel b{font-size:19px}
.chead .ncel{flex-direction:column;align-items:stretch;gap:0}.ncb{display:flex;gap:4px;min-width:150px}.ncb button{flex:1;min-width:0;min-height:38px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font:inherit;font-weight:700;font-size:17px}.ncb button.on{background:var(--brand);border-color:var(--brand);color:#fff}.ncb button.on.bad{background:var(--bad);border-color:var(--bad)}.ncs{font:inherit;font-size:20px;font-weight:700;min-height:40px;border:2px solid var(--line);border-radius:10px;background:#fff;padding:2px 8px}.ncs.mal{border-color:var(--bad);color:var(--bad)}
.mini5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.mini5 label,.mini5>div{display:flex;flex-direction:column;gap:2px;min-width:0}.mini5 input{width:100%;min-width:0}.tg.ci button{min-height:42px;font-size:16px;padding:0}
@media (max-width:520px){.mini5{grid-template-columns:repeat(3,minmax(0,1fr))}}
input.sm{width:100%;font-family:var(--display);font-weight:700;font-size:20px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.d5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.d5 .dest{min-height:48px;padding:4px 2px;border-top-width:2px}
/* Depósitos: el número siempre a la misma altura; debajo, dos líneas reservadas para lo que lleva (vacías si no lleva nada) */
.d5 .dest[data-silo]{justify-content:flex-start;padding-top:6px}.d5 .dest[data-silo] small{display:block;height:2.4em;line-height:1.2;overflow:hidden;margin-top:1px}
.tg{display:flex;gap:4px}.tg button{flex:1;min-height:38px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;font-family:inherit}.tg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}.tg button.on.bad{background:var(--bad);border-color:var(--bad)}
.lnk{border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;color:var(--muted);font-family:inherit;flex:1}
.xbox{background:rgba(255,255,255,.75);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px}
.pendc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:180px;border-style:dashed;border-width:2px;font:inherit;color:inherit;cursor:pointer}
.camgrid{display:grid;gap:10px}
@media (min-width:900px){body.ancho .recgrid.rc{grid-template-columns:repeat(var(--n),minmax(0,1fr))}.camgrid{grid-template-columns:1.3fr 1fr 1fr 1.6fr;align-items:start}}
.xrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.xrow .unit{flex:1 1 150px;min-width:150px}.xrow .btn{width:auto;min-height:48px;padding:6px 12px}
.rc .xrow{flex-wrap:nowrap;gap:4px}.rc .xrow .unit{flex:1 1 70px;min-width:70px}.rc .xrow .btn{min-height:40px;padding:4px 6px;font-size:14px}.rc .xrow .lnk{flex:0 0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:.02em}

/* Cabecera corporativa */
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 0 var(--brand-deep)}
.top-in{max-width:480px;margin:0 auto;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;padding-block:8px 6px;border-bottom:1px solid rgba(255,255,255,.18)}
.logo{display:flex;align-items:center;background:#fff;border-radius:8px;padding:3px 8px}
.logo img{height:34px;width:auto;display:block}
.wordmark{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.brand .pill{margin-left:auto}
.brand .app-name{white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ver{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.8;white-space:nowrap}   /* versión junto al logotipo */
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.back{border:0;background:rgba(255,255,255,.16);color:#fff;width:44px;height:44px;border-radius:12px;font-size:26px;line-height:1;flex:none}
.bar-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bar-t b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t span{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:#6fdc97;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.pill.off .dot{background:#ffc04d}
.decabtn{border:0;background:#fff;color:var(--brand);border-radius:12px;height:44px;padding:0 14px;font-weight:700;font-size:15px;letter-spacing:.04em;flex:none;display:flex;align-items:center;gap:6px}
.decabtn svg{width:18px;height:18px}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

.btn{border:0;border-radius:14px;min-height:58px;padding:14px 16px;font-weight:700;font-size:19px;width:100%;background:var(--brand);color:#fff;box-shadow:0 2px 0 var(--brand-deep)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px dashed var(--line);box-shadow:none;font-size:16px;min-height:48px}
.row{display:flex;gap:10px}
.row>*{flex:1}

.route{display:flex;flex-direction:column;gap:10px}
.route-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.route-head h2{font-size:32px}
.comps{display:flex;gap:6px;flex-wrap:wrap}
.tank{font-family:var(--mono);font-weight:600;font-size:14px;border:2px solid currentColor;border-radius:8px;padding:2px 8px;background:var(--surface)}
.sp-D{color:var(--sp-do)} .sp-O{color:var(--sp-ov)} .sp-C{color:var(--sp-ca)} .sp-V{color:var(--sp-va)}
.sp-MX{color:var(--sp-ca)}
/* Especie = color del tapón del bote de muestra. Cada ficha: fondo muy suave, borde fino del color y franja gruesa a la izquierda */
.bg-D{--cf:#e2f1e6;--cb:#93c6a0;--cs:var(--sp-do)} .bg-O{--cf:#e3edfa;--cb:#93b4de;--cs:var(--sp-ov)}
.bg-C{--cf:#fbe4e4;--cb:#e29a9d;--cs:var(--sp-ca)} .bg-V{--cf:#f4f2f2;--cb:#c7bfc0;--cs:#a39a9c}

.farm[class*="bg-"],.card[class*="bg-"]{border-left:6px solid var(--cs)}
.farm.next[class*="bg-"]{background:var(--cf);border-color:var(--brand);border-width:2px;border-left:6px solid var(--cs);box-shadow:0 2px 8px rgba(134,33,51,.15)}
.farm.done[class*="bg-"],.farm.skip[class*="bg-"]{background:var(--cf)}
.dest[class*="bg-"]{border-top:5px solid var(--cs)}
.dest[aria-pressed="true"][class*="bg-"]{background:var(--cf);border-color:var(--brand);border-top-color:var(--cs)}
.tally div[class*="bg-"]{border-top:4px solid var(--cs)}
.tank.sp-D{background:#eef7f0} .tank.sp-O{background:#eff5fd} .tank.sp-C{background:#fdf0f0} .tank.sp-V{background:#fff;color:#5a5254}
.tank.sp-MX{background:linear-gradient(90deg,#fdf0f0,#fff)}
.sp-badge.sp-D{background:#eef7f0} .sp-badge.sp-O{background:#eff5fd} .sp-badge.sp-C{background:#fdf0f0} .sp-badge.sp-V{background:#fff}
/* Tablas de consulta (oficina e historial): cada ganadero es una ficha separada */
table.hist{border-collapse:separate!important;border-spacing:0 8px}

.deca{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;border-top:6px solid var(--brand)}

.farm .name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.farm .st{font-size:15px;font-weight:700;text-align:right;flex:none}
.farm.done{background:var(--surface2)}.farm.ya{background:#fff}.ya-txt{color:#8a5a00;font-weight:700}.reg-ok{display:inline-block;background:#c98a00;color:#fff;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;margin-right:6px}
.farm.done .n{color:var(--ok)}
.farm.done .st{color:var(--ok)}

.c2h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:19px}.c2n{background:var(--brand);color:#fff;border-radius:8px;padding:0 9px;font-weight:800}
.c2pend{display:flex;flex-direction:column;gap:4px}.c2chip{border:1.5px solid var(--cb,var(--line));border-left:6px solid var(--cs,#a39a9c);background:var(--cf,#fff);border-radius:10px;padding:8px 12px;font:inherit;font-size:17px;cursor:pointer}
.c2tab{width:100%;border-collapse:separate;border-spacing:0 3px}.c2tab th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 6px}
.c2tab td{background:var(--cf,#fff);padding:5px 4px;vertical-align:middle}.c2tab tr:not(.c2arrrow) td{border-top:1.5px solid var(--cb,var(--line))}.c2tab tr td:first-child{border-left:6px solid var(--cs,#a39a9c)}
.c2tab tr.c2arrrow td{padding-top:0}.c2tab tr.c2arrant td{padding-top:5px;padding-bottom:0;border-top:1.5px solid var(--cb,var(--line))}.c2tab tr.c2trant td{border-top:0!important}.c2arrlb{border:0;background:none;font:inherit;color:inherit;padding:6px 2px;cursor:pointer;white-space:nowrap}.c2tc{width:1%}.c2or{display:flex;align-items:center;gap:2px}.c2or b{font-size:20px;min-width:28px;color:var(--brand)}.c2mv{display:flex;flex-direction:column;gap:2px}.c2mv button{width:26px;height:22px;border:1.5px solid var(--line);border-radius:6px;background:#fff;font-size:11px;line-height:1;padding:0}.c2mv button:disabled{opacity:.25}.c2nb{display:flex;gap:3px}.c2nb button{min-width:34px;min-height:40px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:16px;font-family:inherit}

.nav{display:flex;flex-direction:column;gap:2px}.navg{background:var(--brand-deep);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:4px 4px 6px;box-shadow:0 4px 14px rgba(0,0,0,.35);margin-bottom:26px}.navg .nav{gap:4px}.navg .nav button{padding:4px 12px;line-height:1.18;font-size:18px;white-space:normal;color:rgba(255,255,255,.88)}.navg .nav button small{font-size:13.5px;opacity:.85}body.esc .bar-t span{font-size:18px;font-weight:700;opacity:1}body.esc .top .bar-t{gap:14px}body.esc #vRecepC{zoom:.88}.side-logo{min-height:var(--hdrH,104px);margin:0 0 4px;padding:10px 10px 14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;flex:none;border-bottom:1px solid rgba(196,149,43,.5)}.side-logo .logo{padding:5px 14px;border-radius:9px;cursor:pointer}.side-logo .logo img{height:50px}.side-logo small{font-size:14px;opacity:.92;font-weight:500;line-height:1.2;text-align:center}.side-t{text-align:center;font-size:21px!important;border-bottom:0!important;padding:0 10px 6px!important;margin-bottom:30px!important}#side .sbot{display:grid;grid-template-columns:1fr 1fr;gap:6px}#side .sbot .navb{margin:0;font-size:16px;text-align:center;padding:9px 6px}body.esc #hZ{display:inline-block;align-self:flex-start;font-size:19px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#f3d27a;line-height:1.2;margin-bottom:2px}#hZ{display:none}body.esc .top .bar-t{flex-direction:column!important;align-items:flex-start!important;gap:2px!important}body.esc .bar-t b{font-size:26px!important}body.esc .brand .logo,body.esc .brand .ver,body.esc .brand .app-name{display:none}body.esc .brand{justify-content:flex-end}.navgt{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--gold);padding:5px 10px 4px;margin:0 4px 3px;border-bottom:2px solid rgba(196,149,43,.75)}
.nav button,.navb{display:block;width:100%;text-align:left;background:transparent;border:0;color:rgba(255,255,255,.82);padding:11px 12px;border-radius:10px;font-weight:600;font-size:15.5px}
.nav button:hover,.navb:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:rgba(255,255,255,.15);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav button small{display:block;font-weight:500;font-size:12px;opacity:.7}
.navb{border:1px solid rgba(255,255,255,.2);margin-top:6px;text-align:center}
.ofi2{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.ofi2 .lista{position:sticky;top:96px;max-height:calc(100vh - 116px);overflow:auto;padding:10px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:9px 10px;align-items:center}
.vrow:hover{background:var(--surface2)}.vrow.on{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.vrow small{display:block;font-size:12.5px;color:var(--muted)}.vrow .num{text-align:right}
.vrow .badge{font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px;background:var(--warn-soft);color:var(--warn)}
.dia{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:12px 10px 4px}
.kpis{display:flex;gap:10px;flex-wrap:wrap}.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:110px}
.kpi span{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.kpi b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
table.dt{width:100%;border-collapse:collapse;font-size:14.5px}
table.dt th{position:sticky;top:88px;background:var(--surface2);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);z-index:1}
table.dt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt td.n,table.dt th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt tr[class*="bg-"] td:first-child{box-shadow:inset 4px 0 0 var(--cs,transparent)}
table.dt tr.click{cursor:pointer}table.dt tr.click:hover td{background:var(--brand-soft)}
table.dt tr.sin td{opacity:.5}
.esc2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:20px;align-items:start}
table.dt td{text-align:left}table.dt td.n{text-align:right}table.dt td:nth-child(3){min-width:200px}table.dt td:nth-child(4){white-space:nowrap}
#vOfiE input:not([type=checkbox]):not(.big),#drawerIn input:not([type=checkbox]):not(.big){width:100%;font:inherit;font-size:17px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
#vOfiE label.row,#drawerIn label.row{justify-content:flex-start}#vOfiE label.row input,#drawerIn label.row input{flex:0 0 auto}
.esc2 .tally{grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.esc2 .dep-card>b:first-child{font-size:14px!important;white-space:nowrap}.esc2 .dep-card{padding:8px;overflow:hidden}.esc2 .dep-card b.num{font-size:22px}.esc2 .dep-card small b{font-size:12.5px}
.repw{display:inline-flex;flex-direction:column;align-items:center}.reparto{display:flex;justify-content:center;margin-top:3px;padding-top:3px;border-top:1px solid var(--line)}.reparto>span{display:flex;flex-direction:column;align-items:center;padding:0 7px;line-height:1.2}.reparto>span+span{border-left:1px solid var(--line)}.reparto b{font-size:14px}.reparto i{font-style:normal;font-size:12px;font-weight:700}
#veil{position:fixed;inset:0;background:rgba(29,22,24,.35);z-index:8}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--bg);box-shadow:-10px 0 30px rgba(0,0,0,.2);z-index:9;overflow:auto;padding:22px 24px 40px}

const D = () => S.datos;

   está abierta; se apaga solo con el botón de la tablet. Al volver a encenderla, se vuelve a pedir. */
// Dejar girar la pantalla también en la app instalada (aunque Android aún tenga el manifiesto antiguo, que la fijaba en vertical)
try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('any').catch(() => {}); } catch (e) {}

  try {
    const d = D(); if (!d || !(d.recepcion || d.calidad) || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    if (bloqueoPantalla && !bloqueoPantalla.released) return;

/* Pruebas: quien hace recepción toca el logotipo en la lista de Recepción y pasa a Recepción calidad (y al revés).
   Desde un camión a medias también: lo metido se queda en la tablet (borrador) y se recupera al volver a abrirlo. */
document.addEventListener('click', e => {
  if (!e.target.closest('.logo') || !D() || !(D().recepcion || D().oficina) || !['vRecep', 'vRecepC'].includes(U.view)) return;
  if (U.view === 'vRecepC') { if (!salirSinGuardar()) return; guardarBorrador(); }   // lo metido en un camión sin guardar se queda en la tablet
  R.modo = CONTADORES_1 ? (R.modo === 'esp' ? '' : R.modo === 'c2' ? 'esp' : 'c2') : (R.modo === 'esp' ? 'r3' : R.modo === 'r3' ? 'c2' : 'esp'); R.ed = null; recepcion();   // Contadores → Recepción → Recepción 2 (prueba) → Contadores
  toast(R.modo === 'esp' ? 'Recepción' : R.modo === 'r3' ? 'Recepción 2' : R.modo === 'c2' && CONTADORES_1 ? 'Contadores 2' : 'Contadores');
});
const CFG = () => D().config;
const misRutas = () => Object.keys(D().rutas).sort();
const ganRuta = r => D().ganaderos.filter(g => g.ruta === r);
const camiones = () => D().camiones.concat(S.nuevosCam);
const CAM = id => camiones().find(k => k.id === id);
const T = () => CAM(S.cam) || camiones()[0];
const rt = () => S.sel.map(x => +x).join(' y ');

  if (S.pref && S.sel.includes(S.pref)) return String(+S.pref);
  const p = S.sel.map(r => D().rutas[r] && D().rutas[r].pref).find(p => p && S.sel.includes(p));
  return String(+(p || S.sel[0]));
}
// Compartimentos de la ruta: los marcados con esa RUTA en COMPARTIMENTOS; si no hay, los generales (RUTA vacía)
const letrasDe = k => { const r = String(pref()).padStart(2, '0'), p = k.letras.filter(x => x.ruta === r); return p.length ? p : k.letras.filter(x => !x.ruta); };
const compsDe = k => letrasDe(k).map(x => ({ id: pref() + x.l, l: x.l, esp: x.esp, mezcla: x.mezcla || [], cap: Number(x.cap) || 0 }));
const comps = () => compsDe(T());
const comp = id => comps().find(c => c.id === id);
const compLabel = c => c.esp.map(e => SP[e] || e).join(' + ');
const spClass = c => c.esp.length > 1 ? 'sp-MX' : 'sp-' + c.esp[0];
const bgComp = c => spClass(c).replace('sp-', 'bg-');                          // sp-O → bg-O
const bgEsp = e => ({ D: 'bg-D', O: 'bg-O', C: 'bg-C', V: 'bg-V' })[String(e || '').toUpperCase()] || '';
const letraDe = id => String(id || '').replace(/^\d+/, '').toUpperCase();   // 5D → D, 4v → V
const bgId = id => bgEsp(letraDe(id));
const tq = id => `<span class="tank sp-${esc(letraDe(id))}">${esc(id)}</span>`;
function mezclaMsg(esp, c) {
  return c.esp.includes('D') && esp !== 'D'
    ? `${labelEsp(esp)} en ${c.id}: todo el compartimento deja de ser D.O.`
    : `${labelEsp(esp)} en ${c.id}, que es de ${compLabel(c)}: se mezclan.`;

function addTot(tot, x) { if (x.sin) return; const a = x.arr ? x.arr.l : 0, p = x.rep ? x.rep.l : 0; tot[x.dest] = (tot[x.dest] || 0) + x.litros - a - p; if (a) tot[x.arr.dest] = (tot[x.arr.dest] || 0) + a; if (p) tot[x.rep.dest] = (tot[x.rep.dest] || 0) + p; }
function totales() { const t = {}; comps().forEach(c => t[c.id] = 0); recsViaje().forEach(x => addTot(t, x)); return t; }

/* ═══════════ SERVIDOR Y COLA SIN COBERTURA ═══════════ */
async function api(accion, datos) {
  if (API.startsWith('PEGAR')) throw new Error('Falta configurar la dirección del servidor (API) en la app.');
  if (!S.dev) { S.dev = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); persistir(); }
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ accion, pin: S.pin, dev: S.dev }, datos)) });
  const j = await r.json();
  if (j.apiVer && j.apiVer !== U.apiVer) { U.apiVer = j.apiVer; const v = $('#ver'); if (v) { v.textContent = VERSION.split(' ')[0] + ' · API ' + j.apiVer; v.title = VERSION + ' · API ' + j.apiVer; } const sv = $('#sideVer'); if (sv) sv.textContent = VERSION.split(' ')[0] + ' · API ' + j.apiVer; }
  if (!j.ok) {
    if (j.error === 'PIN incorrecto' && accion !== 'login') { pinCaducado(); throw new Error('El PIN ha cambiado. Escribe el nuevo.'); }
    throw new Error(j.error || 'Error del servidor');
  }
  return j;
}
const esRed = e => !(e instanceof Error) || /fetch|network|Failed|Load failed|NetworkError/i.test(e.message);
const pendientes = () => Object.keys(S.cola.recs).length + S.cola.cierres.length;
function encolar(rec) { S.cola.recs[rec.recId] = rec; persistir(); syncPill(); flush(); }
let flushing = false;
async function flush() {
  if (flushing || !S.pin || !pendientes()) { syncPill(); return; }
  flushing = true;
  try {
    const recs = Object.values(S.cola.recs);
    if (recs.length) {
      const r = await api('guardar', { recs });
      r.ids.forEach(id => delete S.cola.recs[id]); persistir();
      if (r.sinViaje) toast(r.sinViaje + (r.sinViaje > 1 ? ' recogidas eran' : ' recogida era') + ' de un viaje que ya no existe: se han guardado aparte para la oficina');
    }
    while (S.cola.cierres.length) {
      await api('cerrarViaje', S.cola.cierres[0]);
      S.cola.cierres.shift(); persistir();
      toast('Viaje cerrado y enviado a la oficina');
    }
    S.online = true; U.errServ = null;
  } catch (e) { S.online = !esRed(e) ? S.online : false; if (!esRed(e)) { U.errServ = e.message; toast('Error al enviar: ' + e.message); } }
  flushing = false; syncPill();
}
function syncPill() {
  const p = pendientes(), on = navigator.onLine && S.online !== false;
  $('#sync').classList.toggle('off', !on || p > 0);
  $('#syncTxt').textContent = p ? `${p} sin enviar` : (on ? 'Todo enviado' : 'Sin cobertura');
}
window.addEventListener('online', () => { S.online = true; flush(); });
window.addEventListener('offline', () => { S.online = false; syncPill(); });
setInterval(flush, 30000);
$('#sync').onclick = () => { S.online = true; flush(); toast(pendientes() ? 'Intentando enviar…' : 'Todo está enviado'); };

/* 0. PIN */

function pinCaducado() { if (!S.pin) return; S.pin = null; persistir(); syncPill(); pinView('La oficina ha cambiado tu PIN. Escribe el nuevo. No se ha perdido nada de lo apuntado.'); }

/* 2. Iniciar viaje: genera el DeCA en el servidor */
async function iniciar() {
  if (U.ocupado) return;
  const b = $('#ini'), m = $('#iniMsg');
  const seen = new Set(), list = [];
  S.sel.forEach(r => ganRuta(r).forEach(g => { if (seen.has(kg(g))) return; seen.add(kg(g)); list.push({ cod: g.cod, esp: g.esp, k: kg(g), ruta: r, ord: g.ord }); }));
  const est = Math.round(num($('#estL').value) || 0);
  if (!(est > 0)) { m.hidden = false; m.className = 'msg bad'; m.textContent = 'Escribe los litros estimados de hoy. El DeCA no puede salir con 0 kg.'; $('#estL').focus(); return; }
  const id = 'V' + Date.now().toString(36).toUpperCase() + '-' + D().conductor.id;
  ocupado(b, 'Generando DeCA…');
  try {
    const r = await api('iniciarViaje', { viaje: { id, rutas: S.sel, pref: pref(), camion: camionPayload(T()), estLitros: est, confirmado: !!U.otroViaje } });
    if (r.hoy) { S.datos.hoy = r.hoy; persistir(); }
    if (r.aviso) {
      libre(b); m.hidden = false; m.className = 'msg bad';
      m.innerHTML = `<p><b>Hoy ya se ha hecho ${S.sel.length > 1 ? 'esta ruta' : 'la ruta ' + (+S.sel[0])}:</b></p><p class="small">${r.aviso.map(v => esc(txtViaje(v))).join('<br>')}</p>
        <p style="margin-top:6px">Si es un segundo viaje de verdad, confírmalo. Si no, no lo inicies: se repetirían los ganaderos.</p>
        <button class="btn" id="otroOk" style="margin-top:10px;background:var(--bad);box-shadow:none">Sí, es otro viaje. Iniciar</button>`;
      $('#otroOk').onclick = () => { U.otroViaje = true; iniciar(); };
      return;
    }
    U.otroViaje = false;
    S.cam = adoptarCamion(r, S.cam);
    S.viaje = Object.assign({}, r.viaje, { rutas: S.sel.slice(), prefijo: pref(), est, empezado: false });
    S.cadena = [r.viaje.id]; S.decas = []; S.list = list; S.rec = {}; S.lastI = null; S.estManual = '';
    persistir(); U.vistaPrev = null; deca();
  } catch (e) {
    libre(b); m.hidden = false; m.className = 'msg bad';
    m.textContent = esRed(e) ? 'Sin cobertura: el DeCA necesita conexión para generarse. Busca cobertura y vuelve a pulsar.' : e.message;
  }
}
// Lo ya recogido HOY en otros viajes (de esta u otra app): para no repetir la ruta por error
const HOY = () => (D() && D().hoy) || { viajes: [], recs: {} };
const hoyOtro = k => { const h = HOY().recs[k]; return h && !(S.cadena || []).includes(h.viaje) ? h : null; };
const viajesHoy = rs => HOY().viajes.filter(v => !(S.cadena || []).includes(v.id) && String(v.rutas).split(/[,\s]+/).some(r => rs.map(x => String(+x)).includes(String(+r))));
const txtViaje = v => `DeCA ${v.deca} · ${v.matricula} · ${v.ini}${v.fin ? '–' + v.fin : ''}${/CURSO/.test(v.estado) ? ' (sin cerrar)' : ''} · ${fmt(v.litros)} l${v.conductor !== D().conductor.id ? ' · ' + v.conductor : ''}`;
// Un mismo ganadero puede tener dos especies (oveja y cabra): cada especie es una parada distinta (clave código|especie)
const kg = g => g.cod + '|' + g.esp;
const gan = k => D().ganaderos.find(g => kg(g) === k) || D().ganaderos.find(g => g.cod === k) || { cod: String(k).split('|')[0], nom: String(k).split('|')[0], esp: String(k).split('|')[1] || 'O', dl: '', pue: '', ult: 0 };

function deca() {

  <div class="card deca"><div id="qr" aria-label="Código QR del DeCA"></div>
    <dl class="kv">

  <p class="small muted">Si te para la Guardia Civil, enseña esta pantalla: el QR descarga el PDF sin pedir clave. Durante el viaje lo tienes siempre en el botón <b>DeCA</b> de arriba.</p>
  <button class="btn" id="go">${enCurso ? 'Volver a la recogida' : 'Empezar recogida'}</button>
  ${anulable() ? '<button class="btn ghost" id="anular">Me he equivocado: anular este viaje</button>' : ''}`;
  try { new QRCode($('#qr'), { text: V.decaUrl, width: 130, height: 130, colorDark: '#1d1618', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { $('#qr').innerHTML = '<p class="small">QR no disponible</p>'; }

  $('#go').onclick = () => { S.viaje.empezado = true; persistir();
    if (U.vistaPrev === 'vFicha' && U.volver != null) ficha(U.volver); else if (U.vistaPrev === 'vFin') fin(); else lista(); };
  show('vDeca', 'DeCA · Ruta ' + S.viaje.rutas.map(x => +x).join(' y '), V.matricula);
}

/* Anular un viaje iniciado por error (sin ningún ganadero apuntado) */
const anulable = () => S.viaje && !Object.keys(S.rec).length && (S.cadena || []).length <= 1 && !pendientes();
function anular() {
  const v = U.view === 'vDeca' ? $('#vDeca') : $('#vLista'), b = $('#anular');
  if (!b.dataset.ok) {
    b.dataset.ok = '1'; b.className = 'btn'; b.style.background = 'var(--bad)'; b.style.boxShadow = 'none';
    b.textContent = 'Sí, anular. No voy a hacer este viaje';
    b.insertAdjacentHTML('beforebegin', '<div class="msg warn" id="anuMsg">Se anulará el DeCA ' + esc(S.viaje.decaNum) + '. No se envía nada a la oficina y podrás iniciar el viaje de nuevo cuando toque.</div>');
    return;
  }
  if (U.ocupado) return;
  ocupado(b, 'Anulando…');
  api('anularViaje', { viajeId: S.viaje.id }).then(() => {
    S.viaje = null; S.list = []; S.rec = {}; S.decas = []; S.cadena = []; S.lastI = null; persistir();
    toast('Viaje anulado'); rutas();
  }).catch(e => { libre(b); const m = $('#anuMsg'); if (m) { m.className = 'msg bad'; m.textContent = esRed(e) ? 'Sin cobertura: para anular hace falta conexión.' : e.message; } });
}

/* 3. Lista de ganaderos */
function siguiente() {
  const L = S.list, desde = S.lastI == null ? -1 : S.lastI;
  let k = L.findIndex((x, j) => j > desde && !S.rec[x.k]);
  if (k < 0) k = L.findIndex(x => !S.rec[x.k]);
  return k;
}
function lista() {
  const L = S.list, done = L.filter(x => S.rec[x.k]).length, next = siguiente(), tot = totales();
  const sum = Object.values(tot).reduce((a, b) => a + b, 0), nx = next >= 0 ? L[next] : null, v = $('#vLista');
  v.innerHTML = `${nx ? `<div class="next-card">
    <span class="lbl">Siguiente parada · ${next + 1} de ${L.length}</span>
    <h2>${esc(gan(nx.k).nom)}</h2>
    <p>${esc(gan(nx.k).pue)} · ${labelEsp(gan(nx.k).esp)} · destino ${habitual(gan(nx.k))}</p>
    <button class="btn" id="anotar">Anotar recogida</button>
  </div>` : `<div class="msg ok">Todos los ganaderos anotados. Ya puedes terminar el viaje.</div>`}
  <div class="card stack">
    <div class="route-head"><span class="lbl">${done} de ${L.length} ganaderos</span><b class="num" style="font-family:var(--display);font-size:24px">${fmt(sum)} l</b></div>
    <div class="progress"><i style="width:${L.length ? done / L.length * 100 : 0}%"></i></div>
    <div class="tally">${comps().map(c => `<div class="${bgComp(c)}"><span class="tank ${spClass(c)}">${c.id}</span><b class="num">${fmt(tot[c.id])}</b>${c.cap ? `<small class="muted">de ${fmt(c.cap)}</small>` : ''}${mixed(c) ? '<small style="color:var(--bad);font-weight:700">mezcla</small>' : ''}</div>`).join('')}</div>
  </div>
  <p class="small muted">Si hoy vas en otro orden, toca el ganadero que quieras.</p>
  <div class="stack">${L.map((x, i) => {
    const g = gan(x.k), r = S.rec[x.k];
    const cls = r ? (r.sin ? 'skip' : 'done') : (i === next ? 'next' : '');
    const ho = !r && hoyOtro(x.k);
    const xs = r && !r.sin ? [r.arr, r.rep].filter(z => z && z.l > 0) : [];
    const partes = xs.length ? [[r.dest, r.litros - xs.reduce((a, z) => a + z.l, 0)]].concat(xs.map(z => [z.dest, z.l])) : [];
    const st = r ? (r.sin ? 'No recogido' : xs.length
      ? `<span class="repw"><span>${fmt(r.litros)} l</span><span class="reparto">${partes.map(([d, l]) => `<span><b>${fmt(l)}</b><i class="mono sp-${esc(letraDe(d))}">${esc(d)}</i></span>`).join('')}</span></span>`
      : fmt(r.litros) + ' l · ' + r.dest) : ho ? `<span style="color:var(--bad)">Ya hoy ${esc(ho.hora)}<br>${fmt(ho.l)} l</span>` : (i === next ? 'Siguiente' : '');
    const prevRuta = i > 0 && L[i - 1].ruta !== x.ruta;
    const cambio = i > 0 && !prevRuta && grp(gan(L[i - 1].k).esp) !== grp(g.esp);
    return `${prevRuta || (i === 0 && S.viaje.rutas.length > 1) ? `<span class="lbl" style="margin-top:6px">Ruta ${+x.ruta}</span>` : ''}${cambio ? `<span class="small" style="color:var(--warn);font-weight:700;padding-left:4px">↓ Cambio de manguera: ${grp(g.esp) === 'OV' ? 'vaca/cabra → oveja' : 'oveja → vaca/cabra'}</span>` : ''}
      <button class="farm ${cls} ${bgEsp(g.esp)}" data-i="${i}"><span class="n">${i + 1}</span>
      <span class="main"><span class="name">${esc(g.nom)}</span><span class="sub">${esc(g.pue)} · <span class="sp-${g.esp}">${labelEsp(g.esp)}</span></span></span>
      <span class="st num">${st}</span></button>`;
  }).join('')}</div>
  <button class="btn ${done === L.length ? '' : 'sec'}" id="fin">Terminar viaje</button>
  <button class="btn ghost" id="averia">Avería: trasvase a otro camión</button>
  ${anulable() ? '<button class="btn ghost" id="anular">Me he equivocado: anular este viaje</button>' : ''}`;
  if ($('#anular')) $('#anular').onclick = anular;
  v.querySelectorAll('[data-i]').forEach(b => b.onclick = () => ficha(+b.dataset.i));
  if (nx) $('#anotar').onclick = () => ficha(next);
  $('#fin').onclick = fin;
  $('#averia').onclick = () => camion('trasvase');
  show('vLista', 'Ruta ' + S.viaje.rutas.map(x => +x).join(' y '), `${T().matricula} · DeCA ${S.viaje.decaNum}`);
}

/* 4. Ficha de recogida */
function ficha(i) {
  S.i = i;
  const x = S.list[i], g = gan(x.k), r = S.rec[x.k] || {}, cf = CFG();
  const hab = habitual(g); let dest = r.dest && comp(r.dest) ? r.dest : hab;
  U.pos = null;
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => U.pos = p.coords, () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 120000 });
  const v = $('#vFicha');
  v.innerHTML = `<div class="card farmer-head ${bgEsp(g.esp)}">
      <div style="min-width:0"><h3 class="fname">${esc(g.nom)}</h3><p class="small muted"><span class="mono">${esc(g.cod)}</span> · R${+x.ruta}/${esc(x.ord)} · ${esc(g.pue)}</p></div>
      <span class="sp-badge sp-${g.esp}">${labelEsp(g.esp)}</span></div>
    <div class="pair">
      <div class="field"><label class="lbl" for="lit">Litros</label>
        <div class="unit"><input class="big" id="lit" inputmode="numeric" enterkeyhint="next" autocomplete="off" value="${r.litros ?? ''}" placeholder="0"><span>L</span></div></div>
      <div class="field"><label class="lbl" for="tmp">Temp.</label>
        <div class="unit"><input class="big" id="tmp" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${r.temp != null ? String(r.temp).replace('.', ',') : ''}" placeholder="0,0"><span>°C</span></div></div>
    </div>
    <div id="litMsg" hidden></div><div id="tmpMsg" hidden></div>
    <div class="field"><label class="lbl" for="mue">Nº de la pegatina de la muestra</label>
      <div class="scan"><input id="mue" inputmode="numeric" enterkeyhint="done" autocomplete="off" value="${esc(r.muestra || '')}" placeholder="7226500…"><button id="scanBtn">Escanear</button></div></div>
    <div class="field"><span class="lbl">Destino</span>
      <div class="dests" id="dests"></div><div id="destMsg" hidden></div></div>
    <div id="capMsg" hidden></div>
    <div class="field" id="arrBox" hidden>
      <button class="btn sec" id="arrTog">Arrastre de manguera</button>
      <div id="arrBody" class="stack" hidden>
        <div id="arrHint" class="msg warn" hidden></div>
        <span class="lbl">Litros de arrastre</span>
        <input class="big" id="arrL" inputmode="numeric" autocomplete="off" placeholder="0" style="font-size:30px">
        <div class="row" id="arrQuick">${[10, 15, 20, 30].map(n => `<button class="btn sec" data-q="${n}" style="padding:8px;min-height:48px">${n}</button>`).join('')}</div>
        <span class="lbl">Al compartimento</span>
        <div class="dests" id="arrDests"></div>
        <p class="small muted">La oveja puede pasar a vaca/cabra, nunca al revés.</p>
        <div id="arrMsg" hidden></div>
      </div>
    </div>
    <div class="field" id="repBox" hidden>
      <button class="btn sec" id="repTog">No cabe todo: parte a otro compartimento</button>
      <div id="repBody" class="stack" hidden>
        <span class="lbl">Litros que van a otro compartimento</span>
        <input class="big" id="repL" inputmode="numeric" autocomplete="off" placeholder="0" style="font-size:30px">
        <span class="lbl">Al compartimento</span>
        <div class="dests" id="repDests"></div>
        <div id="repMsg" hidden></div>
      </div>
    </div>
    <div id="repRes" class="msg ok" hidden></div>
    <div id="err" class="msg bad" hidden></div>
    <button class="btn" id="save">Guardar y siguiente</button>
    <button class="btn ghost" id="sin">Hoy no se recoge</button>${S.rec[x.k] ? '<button class="btn ghost" id="quitarRec" style="color:var(--bad);border-color:var(--bad)">Quitar lo apuntado (vuelve a pendiente)</button>' : ''}`;
  const drawDests = () => {
    $('#dests').innerHTML = comps().map(c => `<button class="dest ${bgComp(c)}" aria-pressed="${c.id === dest}" data-d="${c.id}">
      <b class="${spClass(c)}">${c.id}</b><small>${compLabel(c)}</small>${c.id === hab ? '<span class="hab">habitual</span>' : ''}</button>`).join('');
    $('#dests').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { dest = b.dataset.d; confirmMix = false; drawDests(); drawArr(); drawRep(); chkCap(); });
    const m = $('#destMsg'), k = compat(g.esp, comp(dest));
    if (!k.ok) { m.hidden = false; m.className = 'msg bad'; m.textContent = mezclaMsg(g.esp, comp(dest)) + ' Si no hay otro sitio, puedes guardarla igualmente y quedará como incidencia.'; }
    else if (k.warn) { m.hidden = false; m.className = 'msg ' + (k.bad ? 'bad' : 'warn'); m.textContent = k.warn; }
    else if (dest !== hab) { m.hidden = false; m.className = 'msg warn'; m.textContent = `Cambiado. Lo habitual es ${hab}.`; }
    else m.hidden = true;
  };
  let confirmMix = !!r.mezcla, confirmDup = !!r.litros;
  drawDests();
  // Hasta tres destinos: el principal, el arrastre de manguera (oveja → vaca/cabra) y lo que no cabe (reparto)
  const otros = () => comps().filter(c => c.id !== dest);
  // Lo que ya lleva cada compartimento sin contar esta recogida
  const llevaYa = () => { const t = {}; comps().forEach(c => t[c.id] = 0); recsViaje().filter(y => y.recId !== r.recId).forEach(y => addTot(t, y)); return t; };
  const mejorOtro = () => {   // compatible > compatible con aviso > otro que no sea D.O. > el resto; a igualdad, el que tenga más sitio
    const t = llevaYa(), libre = c => c.cap ? c.cap - (t[c.id] || 0) : 1e9;
    const nota = c => { const k = compat(g.esp, c); return k.ok && !k.warn ? 0 : k.ok ? 1 : !c.esp.includes('D') ? 2 : 3; };
    return (otros().sort((a, b) => nota(a) - nota(b) || libre(b) - libre(a))[0] || {}).id; };
  const esOV = grp(g.esp) === 'OV' && vcComps().length > 0;
  // Recogidas guardadas con la v6–v8 (un solo "otro compartimento"): si era reparto, pasa al panel de reparto
  let rArr = r.arr && r.arr.tipo !== 'reparto' ? r.arr : null, rRep = r.rep || (r.arr && r.arr.tipo === 'reparto' ? r.arr : null);
  if (r.arr && r.arr.tipo === 'reparto' && r.rep) rArr = r.arr;
  let arrOn = !!rArr, arrDest = rArr ? rArr.dest : (vcComps()[0] || {}).id;
  let repOn = !!rRep, repDest = rRep ? rRep.dest : null;
  const vArr = () => arrOn ? (num($('#arrL').value) || 0) : 0, vRep = () => repOn ? (num($('#repL').value) || 0) : 0;
  let drawArr = () => {}, drawRep = () => {};
  const resumen = () => {
    const el = $('#repRes'), l = num($('#lit').value) || 0, a = vArr(), p = vRep();
    if (!(l > 0) || !(a > 0 || p > 0)) { el.hidden = true; return; }
    el.hidden = false; el.className = 'msg ' + (a + p >= l ? 'bad' : 'ok');
    el.innerHTML = a + p >= l ? 'Lo que va a otros compartimentos no puede ser igual o mayor que el total.'
      : `Reparto: <b>${esc(dest)} ${fmt(l - a - p)} l</b>${a > 0 ? ` · ${esc(arrDest)} ${fmt(a)} l (arrastre)` : ''}${p > 0 ? ` · ${esc(repDest)} ${fmt(p)} l (no cabía)` : ''}`;
  };
  const chkCap = () => {
    const m = $('#capMsg'), c = comp(dest), l = num($('#lit').value) || 0;
    if (!c || !c.cap || !(l > 0)) { m.hidden = true; return; }
    const lleva = llevaYa()[dest] || 0, libre = Math.max(c.cap - lleva, 0), va = l - vArr() - vRep();
    if (va <= libre) { m.hidden = true; return; }
    const resto = Math.round(va - libre), lleno = libre <= 0, alt = mejorOtro();
    m.hidden = false; m.className = 'msg warn';
    m.innerHTML = lleno
      ? `<b>${esc(dest)}</b> está lleno (lleva ${fmt(lleva)} de ${fmt(c.cap)}).${alt ? ` <button class="btn sec" id="capAll" style="margin-top:8px">Llevar todo a ${esc(alt)}</button>` : ''}`
      : `En <b>${esc(dest)}</b> quedan unos <b>${fmt(libre)} l</b> (lleva ${fmt(lleva)} de ${fmt(c.cap)}). Si no cabe todo, pasa el resto a otro compartimento.
      ${otros().length ? `<button class="btn sec" id="capOk" style="margin-top:8px">Pasar ${fmt(resto)} l a otro compartimento</button>` : ''}`;
    const ba = $('#capAll'); if (ba) ba.onclick = () => { dest = alt; confirmMix = false; repOn = false; $('#repL').value = ''; drawDests(); drawArr(); drawRep(); };
    const b = $('#capOk'); if (b) b.onclick = () => { repOn = true; $('#repL').value = Math.round(vRep() + resto); if (!repDest || repDest === dest) repDest = mejorOtro(); drawRep(); $('#repL').scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  };
  if (esOV) {
    $('#arrBox').hidden = false;
    const prev = i > 0 ? gan(S.list[i - 1].k) : null, next = i < S.list.length - 1 ? gan(S.list[i + 1].k) : null;
    const hint = prev && grp(prev.esp) === 'VC' ? `Vienes de ${labelEsp(prev.esp).toLowerCase()}: el arrastre del principio va a vaca/cabra.`
      : next && grp(next.esp) === 'VC' ? `El siguiente es ${labelEsp(next.esp).toLowerCase()}: si cambias la llave antes, anota aquí lo que pase.` : '';
    if (hint) { $('#arrHint').hidden = false; $('#arrHint').textContent = hint; if (!r.litros) arrOn = true; }
    if (rArr) $('#arrL').value = rArr.l;
    drawArr = () => {
      const vc = vcComps().filter(c => c.id !== dest);
      if (!vc.some(c => c.id === arrDest)) arrDest = (vc[0] || {}).id;
      $('#arrBody').hidden = !arrOn;
      $('#arrTog').textContent = arrOn ? 'Quitar arrastre' : 'Arrastre de manguera (a vaca/cabra)';
      $('#arrDests').innerHTML = vc.map(c => `<button class="dest ${bgComp(c)}" aria-pressed="${c.id === arrDest}" data-a="${c.id}"><b class="${spClass(c)}">${c.id}</b><small>${compLabel(c)}</small></button>`).join('');
      $('#arrDests').querySelectorAll('[data-a]').forEach(b => b.onclick = () => { arrDest = b.dataset.a; drawArr(); });
      const a = num($('#arrL').value), m = $('#arrMsg');
      if (a > cf.arrastreAviso) { m.hidden = false; m.className = 'msg bad'; m.textContent = `Más de ${cf.arrastreAviso} l de ${labelEsp(g.esp).toLowerCase()} en ${arrDest}: ya no es arrastre, se anota como mezcla.`; }
      else m.hidden = true;
      resumen(); chkCap();
    };
    $('#arrTog').onclick = () => { arrOn = !arrOn; if (!arrOn) $('#arrL').value = ''; drawArr(); };
    $('#arrQuick').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { $('#arrL').value = b.dataset.q; drawArr(); });
    $('#arrL').oninput = drawArr;
  }
  if (comps().length > 1) {
    $('#repBox').hidden = false;
    if (rRep) $('#repL').value = rRep.l;
    drawRep = () => {
      if (!repDest || repDest === dest) repDest = mejorOtro();
      $('#repBody').hidden = !repOn;

  </div>`).join('') : `<div class="msg ok">Todavía no hay leche recogida. Solo cambian el camión y el DeCA.</div>`}

  <div class="card stack">
    ${S.decas.map(d => `<p class="small muted">DeCA ${esc(d.num)} · <span class="mono">${esc(d.matricula)}</span> · cerrado por trasvase con ${fmt(d.litros)} l</p>`).join('')}

    </table></div>

    ocupado(b, 'Cerrando…');

/* ═══════════ TECLADO: la cabecera se encoge y se salta de campo con "Siguiente" ═══════════ */
// Solo en pantallas táctiles (móvil): en el ordenador, mover la pantalla al entrar en una casilla hacía que el siguiente clic cayera fuera del botón
const tactil = () => matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches;
document.addEventListener('focusin', e => { if (e.target.matches('input') && tactil()) { document.body.classList.add('kb'); setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 250); } });
document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement || !document.activeElement.matches('input')) document.body.classList.remove('kb'); }, 60));
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input')) return;
  // Recepción y agua: Intro guarda el dato y CIERRA el teclado (en la tablet ocupa media pantalla)
  if (e.target.closest('#vRecepC, #vAgua, #vRecep')) { e.preventDefault(); e.target.dispatchEvent(new Event('change', { bubbles: true })); e.target.blur(); return; }
  const orden = ['lit', 'tmp', 'mue'], i = orden.indexOf(e.target.id);
  if (i < 0) return; e.preventDefault();

    const cq = cuadreDatos().T, recep = { viajeId: E.x.id, fecha: R.esHoy ? '' : R.dia, total: tot, cuadre: E.x.otra ? null : { cartilla: cq.cart, cisterna: cq.cist }, limpieza: E.limpieza, filtro: E.filtro, obs: E.obs, matricula: E.x.matricula, proveedor: E.x.otra ? E.x.conductor : '', ruta: E.x.ruta,
      comps: usados.map(c => ({ id: c.id, esp: c.esp, decl: c.decl, contador: Math.round(num(c.contador)), nComp: c.nComp, temp: c.temp === '' ? '' : num(c.temp), ph: c.ph, dornic: c.dornic, visual: c.visual,
        reps: [{ dep: ppal(c), l: resto(c), tipo: 'PRINCIPAL' }].concat(extras(c).map(p => ({ dep: p.dep, l: Math.round(num(p.l)), tipo: p.tipo }))).filter(p => p.l > 0) })) };
    const b = $('#reGuardar'); ocupado(b, 'Guardando…');
    const firmaImg = ofi ? '' : FIRMAS[borrClave(E.x, false)] || '';
    if (!ofi && !firmaImg) { libre(b); $('#reFirmaBox').scrollIntoView({ block: 'center' }); return err('Firma en el recuadro antes de guardar.'); }
    try { const r = await api('guardarRecepcion', { recep, firmaImg }); toast('Recepción guardada' + (r.firmado ? ' · firmada por ' + r.firmado : '') + ' · fichero ' + r.fichero); borrarBorrador(E.x, false); delete FIRMAS[borrClave(E.x, false)]; R.ed = null; recepcion(); }
    catch (e) { libre(b); err(esRed(e) ? 'Sin conexión: no se ha guardado. Vuelve a pulsar cuando haya red.' : e.message); }
  };
  if ($('#reAnular')) {
    $('#reAnular').onclick = () => { $('#reAnu').hidden = false; $('#reAnular').hidden = true; $('#reAnu').scrollIntoView({ block: 'center' }); $('#reAnuMot').focus(); };
    $('#reAnuNo').onclick = () => { $('#reAnu').hidden = true; $('#reAnular').hidden = false; };
    $('#reAnuOk').onclick = async () => {
      const m = $('#reAnuMsg'), mot = $('#reAnuMot').value.trim(), b = $('#reAnuOk');
      if (!mot) { m.hidden = false; m.className = 'msg bad'; m.textContent = 'Escribe el motivo.'; return; }
      ocupado(b, 'Anulando…');
      try {
        const r = await api('anularRecepcion', { viajeId: x.id, motivo: mot });
        toast('Recepción anulada' + (r.fichero ? ' · fichero ' + r.fichero : '') + (r.revisarAgua ? ' · revisa el agua del día' : ''));
        R.ed = null; U.ag = null; recepcion();
      } catch (e) { libre(b); m.hidden = false; m.className = 'msg bad'; m.textContent = esRed(e) ? 'Sin conexión: no se ha anulado.' : e.message; }
    };
  }
  if (E.porEsp) {   // RECEPCIÓN 2: registro de calidad por especie. Se guarda aparte (RECEPCION_CALIDAD); no va al programa de gestión.
    v.querySelectorAll('#reAnular, #reAnu').forEach(el => { el.hidden = true; });
    const tt = $('#reTot'); if (tt) tt.closest('div').parentElement.hidden = true;
    // Registro ya guardado por error (p. ej. un «segundo viaje» que no existió): eliminarlo entero, con motivo
    if (x.cal && (R.esHoy || ofi) && !soloCal && $('#reGuardar')) {
      $('#reGuardar').insertAdjacentHTML('afterend', `<button class="btn ghost" id="reCalElim" style="color:var(--bad);border-color:var(--bad)">Eliminar este registro (puesto por error)</button>
        <div class="card stack" id="reCalEl" hidden style="border:2px solid var(--bad)">
          <b>Eliminar el registro de calidad de ${esc(x.conductor || '')} · ${esc(x.matricula || '')}</b>
          <p class="small">Se borra entero (todos sus compartimentos, su firma y la mezcla) y deja de salir en el parte. No toca los contadores ni el fichero del programa. Queda apuntado en CAMBIOS con tu nombre y el motivo.</p>
          <div class="field"><label class="lbl" for="reCalMot">Motivo</label><input class="sm" id="reCalMot" style="font-size:18px" placeholder="Ej.: no hubo segundo viaje / registro duplicado"></div>
          <div id="reCalMsg" hidden></div>
          <div class="row"><button class="btn" id="reCalOk" style="background:var(--bad)">Sí, eliminar</button><button class="btn sec" id="reCalNo">No</button></div>
        </div>`);
      $('#reCalElim').onclick = () => { $('#reCalEl').hidden = false; $('#reCalElim').hidden = true; $('#reCalEl').scrollIntoView({ block: 'center' }); $('#reCalMot').focus(); };
      $('#reCalNo').onclick = () => { $('#reCalEl').hidden = true; $('#reCalElim').hidden = false; };
      $('#reCalOk').onclick = async () => {
        const m = $('#reCalMsg'), mot = $('#reCalMot').value.trim(), b = $('#reCalOk');
        if (!mot) { m.hidden = false; m.className = 'msg bad'; m.textContent = 'Escribe el motivo.'; return; }
        ocupado(b, 'Eliminando…');
        try { await api('borrarRecepCalidad', { viajeId: x.id, motivo: mot }); borrarBorrador(x, true); delete FIRMAS[borrClave(x, true)]; if (R.firmados) R.firmados.delete('CAL|' + x.id);
          toast('Registro eliminado'); R.ed = null; recepcion(); }
        catch (e) { libre(b); m.hidden = false; m.className = 'msg bad'; m.textContent = esRed(e) ? 'Sin conexión: no se ha eliminado.' : e.message; }
      };
    }
  }
  if (soloCal) {   // calidad ve el parte completo pero solo cambia la mezcla
    v.querySelectorAll('input, textarea, select, button').forEach(el => { if (!el.hasAttribute('data-mz')) el.disabled = true; });
    v.querySelectorAll('.pendc, #reGuardar, #reAnular, #reAnu, [data-unord], #reFirmaBox').forEach(el => { el.hidden = true; });
    v.insertAdjacentHTML('afterbegin', '<div class="msg warn" style="margin:0">Calidad: aquí solo se marca la <b>mezcla</b> de cada leche (se guarda al pulsar). Lo demás es de recepción.</div>');
    v.insertAdjacentHTML('beforeend', '<button class="btn sec" id="calVolver">Volver a la lista</button>');
    $('#calVolver').onclick = () => recepcion(true);
  }
  const borrarTodo = () => { borrarBorrador(x, E.porEsp); delete FIRMAS[borrClave(x, E.porEsp)]; toast('Borrado lo metido'); const x0 = Object.assign({}, x); R.ed = null; E.porComp ? recepCamion2(x0) : recepCamion(x0); };
  if (E.tocado && !soloCal) U.borrarBarra = borrarTodo; else U.borrarBarra = null;   // papelera en la franja roja (las dos recepciones)
  if (false) {   // (antes: papelera junto a la matrícula en la ficha blanca, que ya no se muestra)
    const rh = v.querySelector('.route-head');
    rh.style.cssText += ';display:flex;align-items:center;gap:10px';
    rh.insertAdjacentHTML('beforeend', `<span style="margin-left:auto;display:flex;align-items:center;gap:8px" id="reBorrBox">
      <button class="btn ghost" id="reBorrar" title="Borrar lo metido en este camión (sin guardar)" style="width:auto;min-height:40px;padding:4px 12px;font-size:20px">🗑</button>
      <span id="reBorrarSi" hidden style="display:flex;align-items:center;gap:6px"><b>¿Borrar lo metido?</b> <button class="btn" id="reBorrarOk" style="width:auto;min-height:40px;padding:4px 14px;background:var(--bad)">Sí</button>
      <button class="btn ghost" id="reBorrarNo" style="width:auto;min-height:40px;padding:4px 14px">No</button></span></span>`);
    $('#reBorrar').onclick = () => { $('#reBorrar').hidden = true; $('#reBorrarSi').hidden = false; };
    $('#reBorrarNo').onclick = () => { $('#reBorrar').hidden = false; $('#reBorrarSi').hidden = true; };
    $('#reBorrarOk').onclick = borrarTodo;
  }
  show('vRecepC', (E.porEsp ? 'Recepción' : 'Contadores') + (R.esHoy === false ? ' · ' + R.dia : ''), x.conductor + (x.matricula ? ' · ' + x.matricula : '')
    + (E.porEsp || x.otra ? '' : ` · Ruta ${String(x.rutas).split(',').map(r => +r).join(' y ')} · DeCA ${x.deca || '—'}`));
  v.querySelectorAll('input').forEach(i => i.setAttribute('enterkeyhint', 'done'));   // la tecla Intro del teclado pone «Hecho»
  { const g = v.querySelector('.recgrid.rc'), d = $('#reDesl');   // flechas solo si hay compartimentos fuera de la pantalla
    if (g && sl0) { g.style.scrollSnapType = 'none'; g.scrollLeft = sl0; requestAnimationFrame(() => { g.style.scrollSnapType = ''; }); }
    if (g && d) { d.hidden = !(g.scrollWidth > g.clientWidth + 4);
      d.querySelectorAll('[data-desl]').forEach(b => b.onclick = () => { const c = g.firstElementChild; g.scrollBy({ left: (+b.dataset.desl) * ((c ? c.getBoundingClientRect().width : 300) + 12), behavior: 'smooth' }); }); } }
  if (U.borrarBarra) {   // Recepción: papelera en la franja roja; primer toque pregunta, segundo borra
    const bb = $('#barBorrar'); bb.hidden = false; bb.textContent = '🗑'; bb.style.background = '';
    bb.onclick = () => { if (bb.dataset.ok === '1') { bb.dataset.ok = ''; return U.borrarBarra(); }
      bb.dataset.ok = '1'; bb.textContent = '¿Borrar lo metido? Toca otra vez'; bb.style.background = 'var(--bad)'; bb.style.fontSize = '15px';
      clearTimeout(bb.t); bb.t = setTimeout(() => { bb.dataset.ok = ''; bb.textContent = '🗑'; bb.style.background = ''; bb.style.fontSize = '20px'; }, 4000); };
  }
  guardarBorrador();
}


/* Agua de arrastre del día (AG1 y, si hubo una segunda descarga tras limpiar, AG2).
   El colector pasa por delante de los depósitos 1 → 5: el agua de ARRANQUE va al primer depósito que recibe leche;
   el ARRASTRE FINAL va al último depósito al que se pasó leche y a todos los de número mayor que recibieron leche
   en esa descarga (nunca a los de número menor). Propuesta: 70 l cada uno (CONFIG: AGUA_ARRANQUE, AGUA_FINAL). */
function recepAgua(guardado) {
  const v = $('#vAgua'), d = R.aguaDef || { arranque: 70, final: 70 };
  const cams = R.viajes.filter(x => x.recep && x.recep.comps && x.recep.comps.length).sort((a, b) => String(a.recep.hora) < String(b.recep.hora) ? -1 : 1);
  if (!U.ag) {
    const ya = R.agua || [];
    U.ag = { corte: ya.length ? (ya.find(a => a.cod === 'AG2') ? (ya.find(a => a.cod === 'AG2').desde || '') : '') : '', manual: {}, l: {} };
    ya.forEach(a => { U.ag.manual[a.cod] = true; U.ag.l[a.cod + '|' + a.dep] = String(a.l); });
  }
  const A = U.ag, deps = R.deps.map(x => x.id);
  const cortei = A.corte ? cams.findIndex(x => x.id === A.corte) : -1;
  const sesiones = [{ cod: 'AG1', cams: cortei > 0 ? cams.slice(0, cortei) : cams }].concat(cortei > 0 ? [{ cod: 'AG2', cams: cams.slice(cortei), desde: A.corte }] : []);
  const propuesta = ses => {
    const pasos = []; ses.cams.forEach(x => x.recep.comps.forEach(c => pasos.push(c)));
    const ppalDe = c => (c.reps.find(r => r.tipo === 'PRINCIPAL') || c.reps[0] || {}).dep;
    const m = {}; if (!pasos.length) return { m, txt: '' };
    // Arranque: al primer depósito que recibe leche. Arrastre final: al depósito del último compartimento y a todos los de número mayor que recibieron leche
    const ini = ppalDe(pasos[0]), ult = ppalDe(pasos[pasos.length - 1]);
    const usados = [...new Set(pasos.flatMap(c => c.reps.map(r => r.dep)).filter(Boolean))];
    m[ini] = (m[ini] || 0) + d.arranque;
    const fin = usados.filter(x => x === ult || +x > +ult); fin.forEach(x => { m[x] = (m[x] || 0) + d.final; });
    return { m, txt: `Arranque → dep. ${ini} · Arrastre final → dep. ${fin.sort((a, b) => a - b).join(', ')}` };
  };
  const val = (ses, dep, pr) => A.manual[ses.cod] ? (A.l[ses.cod + '|' + dep] || '') : (pr.m[dep] ? String(pr.m[dep]) : '');
  v.innerHTML = `<div class="agGrid"><div class="agIzq"><div class="card stack"><h2>Agua de arrastre del día</h2>
      <p class="small muted">Es el agua que entra a los depósitos al arrancar el contador y al arrastrar la leche al final. La app la propone según el orden de descarga; ajústala si hoy ha sido distinto. No cuenta en el total de ningún camión.</p>
      ${cams.length ? `<span class="lbl">Orden de descarga de hoy</span>
      ${sesiones.filter(z => z.cams.length).map(ses => { let n = 0; const filas = ses.cams.flatMap(x => x.recep.comps.map((c, k) => ({ x, c, k }))); return `${sesiones.length > 1 ? `<span class="lbl" style="margin-top:6px">${ses.cod}</span>` : ''}
        <div class="tl">${filas.map((f, j) => { n++; const reps = f.c.reps; return `<span class="n">${n}</span>
          <span>${f.k === 0 ? `<b class="mono small">${esc(f.x.recep.hora)}</b> <span class="small">${esc(f.x.conductor)}</span>` : ''}</span>
          <span>${tq(f.c.id)} → ${reps.map(r => `<b>dep. ${esc(r.dep)}</b>${reps.length > 1 ? ' <span class="small muted">' + fmt(r.l) + ' l</span>' : ''}`).join(' + ')}${j === 0 ? '<span class="tag ini">arranque</span>' : ''}${j === filas.length - 1 ? '<span class="tag fin">último · arrastre final</span>' : ''}</span>`; }).join('')}</div>`; }).join('')}
      <p class="small muted">Si el orden no es el real, abre ese camión desde la lista de recepción: con «No era este» lo quitas y lo vuelves a tocar en su sitio.</p>
      ${cams.length > 1 ? `<div class="field"><label class="lbl" for="agCorte">¿Hubo limpieza y una segunda descarga (AG2)? Empieza en:</label>
        <select id="agCorte" class="big" style="font-size:20px"><option value="">No, todo es una descarga (solo AG1)</option>${cams.slice(1).map(x => `<option value="${esc(x.id)}" ${A.corte === x.id ? 'selected' : ''}>${esc(x.recep.hora)} · ${esc(x.matricula)} · ${esc(x.conductor)}</option>`).join('')}</select></div>` : ''}`
      : '<div class="msg warn">Todavía no hay ningún camión recibido hoy.</div>'}
    </div></div><div class="agDer stack">
    ${sesiones.filter(ses => ses.cams.length).map(ses => { const pr = propuesta(ses); const tot = deps.reduce((a, dp) => a + (num(val(ses, dp, pr)) || 0), 0);
      return `<div class="card stack"><div class="route-head"><h2>${ses.cod}</h2><b class="num">${fmt(tot)} l</b></div>
        <p class="small muted">${A.manual[ses.cod] ? 'Ajustado a mano.' : esc(pr.txt) + ` (${d.arranque} + ${d.final} l por depósito)`}</p>
        <div class="tally agt" style="--nd:${deps.length}">${deps.map(dp => `<div><b class="mono" style="font-size:18px">Dep. ${dp}</b><div class="unit agu"><input class="big" style="font-size:28px" data-ag="${ses.cod}" data-dep="${dp}" inputmode="numeric" maxlength="3" value="${esc(val(ses, dp, pr))}" placeholder="0"><span>L</span></div></div>`).join('')}</div>
        ${deps.filter(dp => (num(val(ses, dp, pr)) || 0) > 0).length > 3 ? `<div class="msg bad">${ses.cod} va a más de 3 depósitos y el programa solo admite 3: junta el agua de alguno (pon 0 en uno y súmalo a otro).</div>` : ''}
        ${A.manual[ses.cod] ? `<button class="btn ghost" data-rest="${ses.cod}">Volver a la propuesta</button>` : ''}</div>`; }).join('')}
    <div id="agMsg" hidden></div>
    ${cams.length ? '<button class="btn" id="agOk">Guardar agua del día</button>' : ''}</div></div>`;
  const sel = $('#agCorte'); if (sel) sel.onchange = () => { A.corte = sel.value; delete A.manual.AG2; recepAgua(); };
  v.querySelectorAll('[data-ag]').forEach(inp => inp.oninput = () => {
    const ses = sesiones.find(z => z.cod === inp.dataset.ag), pr = propuesta(ses);
    if (!A.manual[ses.cod]) { deps.forEach(dp => { A.l[ses.cod + '|' + dp] = pr.m[dp] ? String(pr.m[dp]) : ''; }); A.manual[ses.cod] = true; }
    A.l[ses.cod + '|' + inp.dataset.dep] = inp.value.replace(/\D/g, '');
  });
  v.querySelectorAll('[data-ag]').forEach(inp => inp.onchange = () => rehacer(() => recepAgua()));
  v.querySelectorAll('[data-rest]').forEach(b => b.onclick = () => { delete A.manual[b.dataset.rest]; recepAgua(); });
  if ($('#agOk')) $('#agOk').onclick = async () => {
    const filas = [];
    sesiones.filter(ses => ses.cams.length).forEach(ses => { const pr = propuesta(ses); deps.forEach(dp => { const l = Math.round(num(val(ses, dp, pr)) || 0); if (l > 0) filas.push({ cod: ses.cod, dep: dp, l, desde: ses.desde || '' }); }); });
    const b = $('#agOk'); ocupado(b, 'Guardando…');
    try { const r = await api('guardarAgua', { agua: filas, fecha: R.esHoy ? '' : R.dia }); R.agua = filas; U.ag = null; toast('Agua guardada' + (r.fichero ? ' · fichero ' + r.fichero : '')); recepcion(true); }
    catch (e) { libre(b); const m = $('#agMsg'); m.hidden = false; m.className = 'msg bad'; m.textContent = esRed(e) ? 'Sin conexión: no se ha guardado.' : e.message; }
  };
  show('vAgua', 'Agua de arrastre' + (R.esHoy === false ? ' · ' + R.dia : ''), D().usuario.nombre);
}

// Oficina: rehacer el fichero del programa de un viaje cerrado con lo que hay ahora en la hoja (primer toque pregunta)
document.addEventListener('click', async e => { const b = e.target.closest && e.target.closest('[data-rehacer]'); if (!b || b.disabled) return;
  if (!confirm2(b)) return; ocupado(b, 'Rehaciendo…');
  try { const r = await api('rehacerFichero', { viajeId: b.dataset.rehacer }); libre(b); toast('Fichero ' + r.fichero + ' rehecho: el puente lo vuelve a dejar en el servidor'); }
  catch (x) { libre(b); toast(esRed(x) ? 'Sin conexión: no se ha rehecho.' : x.message); } });
/* ═══════════ ARRANQUE ═══════════ */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
{ const v = $('#ver'); if (v) { v.textContent = VERSION.split(' ')[0]; v.title = VERSION; } }
if (!S.pin || !S.datos) pinView();
else if (S.datos.recepcion || S.datos.calidad) recepcion();
else if (S.datos.oficina) oficina();
else if (S.viaje) (S.viaje.empezado ? lista : deca)();
else rutas();
flush();

</script>
