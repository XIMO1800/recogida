<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#862133">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recogida">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Recogida de Leche · El Hidalgo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Tema único claro, a propósito: se usa en la cabina y al sol, necesita el máximo contraste. */
:root{
  color-scheme:light;
  --brand:#862133; --brand-deep:#6a1010; --brand-soft:#f7e8eb; --brand-ink:#ffffff;
  --gold:#c4952b; --gold-soft:#fbf1dc;
  --bg:#f2efee; --surface:#ffffff; --surface2:#f7f4f3; --ink:#1d1618; --muted:#6a5f61; --line:#ddd4d5;
  --accent:var(--brand); --accent-ink:#fff; --accent-soft:var(--brand-soft);
  --ok:#1e7443; --ok-soft:#e1f2e7; --warn:#9c5c00; --warn-soft:#fdf0d8; --bad:#c0262d; --bad-soft:#fde4e4;
  --sp-do:#1c6b35; --sp-ov:#1d5796; --sp-ca:#b3262d; --sp-va:#5a5254;   /* texto: colores del tapón del bote de muestra */
  --bg-do:#e0f1e4; --bg-ov:#e1ecf9; --bg-ca:#fbe3e3; --bg-va:#ffffff;   /* fondos suaves */
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:.02em}

/* Cabecera corporativa */
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top,0px);box-shadow:0 2px 0 var(--brand-deep)}
.top-in{max-width:480px;margin:0 auto;padding-inline:16px}
.brand{display:flex;align-items:center;gap:10px;padding-block:8px 6px;border-bottom:1px solid rgba(255,255,255,.18)}
.logo{display:flex;align-items:center;background:#fff;border-radius:8px;padding:3px 8px}
.logo img{height:34px;width:auto;display:block}
.wordmark{white-space:nowrap;font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.brand .pill{margin-left:auto}
.brand .app-name{white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.proto{font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#2a1d05;text-align:center;padding-block:3px;font-weight:700}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px}
.back{border:0;background:rgba(255,255,255,.16);color:#fff;width:44px;height:44px;border-radius:12px;font-size:26px;line-height:1;flex:none}
.bar-t{flex:1;min-width:0;display:flex;flex-direction:column}
.bar-t b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-t span{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:#6fdc97;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.pill.off .dot{background:#ffc04d}
.decabtn{border:0;background:#fff;color:var(--brand);border-radius:12px;height:44px;padding:0 14px;font-weight:700;font-size:15px;letter-spacing:.04em;flex:none;display:flex;align-items:center;gap:6px}
.decabtn svg{width:18px;height:18px}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
h2{font-family:var(--display);font-weight:700;font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

.btn{border:0;border-radius:14px;min-height:58px;padding:14px 16px;font-weight:700;font-size:19px;width:100%;background:var(--brand);color:#fff;box-shadow:0 2px 0 var(--brand-deep)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.sec{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px dashed var(--line);box-shadow:none;font-size:16px;min-height:48px}
.row{display:flex;gap:10px}
.row>*{flex:1}

.route{display:flex;flex-direction:column;gap:10px}
.route-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.route-head h2{font-size:32px}
.comps{display:flex;gap:6px;flex-wrap:wrap}
.tank{font-family:var(--mono);font-weight:600;font-size:14px;border:2px solid currentColor;border-radius:8px;padding:2px 8px;background:var(--surface)}
.sp-D{color:var(--sp-do)} .sp-O{color:var(--sp-ov)} .sp-C{color:var(--sp-ca)} .sp-V{color:var(--sp-va)}
.sp-MX{color:var(--sp-ca)}
/* Fondo suave por especie (tarjetas, filas, botones de destino, chapas de compartimento) */
.bg-D{background:var(--bg-do)!important} .bg-O{background:var(--bg-ov)!important} .bg-C{background:var(--bg-ca)!important}
.bg-V{background:var(--bg-va)!important} .bg-MX{background:linear-gradient(90deg,var(--bg-ca),var(--bg-va))!important}
.tank.sp-D{background:var(--bg-do)} .tank.sp-O{background:var(--bg-ov)} .tank.sp-C{background:var(--bg-ca)} .tank.sp-V{background:var(--bg-va)}
.tank.sp-MX{background:linear-gradient(90deg,var(--bg-ca),var(--bg-va))}
.sp-badge.sp-D{background:var(--bg-do)} .sp-badge.sp-O{background:var(--bg-ov)} .sp-badge.sp-C{background:var(--bg-ca)} .sp-badge.sp-V{background:#fff}
tr.bg-D td,tr.bg-O td,tr.bg-C td,tr.bg-V td{border-bottom-color:rgba(0,0,0,.08)}
.farmer-head.bg-D{border-left-color:var(--sp-do)} .farmer-head.bg-O{border-left-color:var(--sp-ov)} .farmer-head.bg-C{border-left-color:var(--sp-ca)} .farmer-head.bg-V{border-left-color:#b9b0b2}

.deca{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;border-top:6px solid var(--brand)}
#qr{background:#fff;padding:8px;border-radius:8px;width:148px;height:148px;border:1px solid var(--line)}
#qr img,#qr canvas{width:130px!important;height:130px!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
@media (max-width:440px){.brand .app-name{display:none}}
@media (max-width:400px){.deca{grid-template-columns:1fr}#qr{justify-self:center}}

.progress{height:12px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.tally div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column}
.tally b{font-family:var(--display);font-size:26px;font-weight:700}
.tally .tank{align-self:flex-start;font-size:13px;padding:0 6px}

.farm{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;min-height:64px}
.farm .n{font-family:var(--display);font-size:22px;font-weight:700;width:28px;flex:none;color:var(--muted)}
.farm .main{flex:1;min-width:0;display:flex;flex-direction:column}
.farm .name{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.farm .sub{font-size:14px;color:var(--muted)}
.farm .st{font-size:15px;font-weight:700;text-align:right;flex:none}
.farm.done{background:var(--surface2)}
.farm.done .n{color:var(--ok)}
.farm.done .st{color:var(--ok)}
.farm.skip{opacity:.7}
.farm.skip .st{color:var(--muted)}
.farm.next{border-color:var(--brand);border-width:2px;background:var(--brand-soft)}
.farm.next .n,.farm.next .st{color:var(--brand)}

.next-card{background:var(--brand);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 3px 0 var(--brand-deep)}
.next-card .lbl{color:rgba(255,255,255,.8)}
.next-card h2{font-size:32px}
.next-card p{opacity:.9}
.next-card .btn{background:#fff;color:var(--brand);box-shadow:none}

.field{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.pair .big{font-size:38px;padding:4px 12px}
.pair .unit span{font-size:17px;right:10px}
/* Con el teclado abierto la cabecera se encoge para que se vea lo que se escribe */
body.kb .proto,body.kb .brand{display:none}
body.kb .bar{padding-block:6px}
body.kb .bar-t b{font-size:20px}
body.kb .back,body.kb .decabtn{height:38px}
body.kb .back{width:38px}
.big{font-family:var(--display);font-size:46px;font-weight:700;width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 16px;font-variant-numeric:tabular-nums}
.big:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.unit{position:relative}
.unit span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;font-size:20px}
.msg{font-size:15px;font-weight:600;border-radius:12px;padding:10px 12px;border-left:5px solid currentColor}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.scan{display:flex;gap:8px}
.scan input{flex:1;min-width:0;font-family:var(--mono);font-size:22px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px}
.scan button{flex:none;border:0;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;padding:0 18px}
.dests{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.dest{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:64px;justify-content:center}
.dest b{font-family:var(--mono);font-size:22px}
.dest small{font-size:12px;color:var(--muted);text-align:center;line-height:1.2}
.dest[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 2px var(--brand)}
.dest .hab{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--brand)}
.fname{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.farmer-head{padding-block:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-left:6px solid var(--brand)}
.sp-badge{font-size:13px;font-weight:700;border:2px solid currentColor;border-radius:99px;padding:3px 10px;white-space:nowrap}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:700;padding:6px;border-bottom:2px solid var(--line)}
td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td input{width:80px;font:inherit;text-align:right;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px}
.d-ok{color:var(--ok);font-weight:700}.d-bad{color:var(--bad);font-weight:700}
pre{font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;margin:0;line-height:1.5}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:600;max-width:calc(100% - 32px);opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{margin:0}
.btn:disabled{opacity:.6}
#scanner{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:16px}
#scanner p{color:#fff;text-align:center;font-weight:700;margin:0}
#reader{width:100%;max-width:480px;margin:0 auto;background:#000;border-radius:12px;overflow:hidden}
#scanner .btn{max-width:480px;margin:0 auto;background:#fff;color:var(--brand)}
  table.hist { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.hist th { text-align: left; font-size: 12px; color: var(--muted, #777); font-weight: 600; padding: 4px 4px 6px; border-bottom: 1px solid rgba(0,0,0,.12); }
  table.hist td { padding: 8px 4px; border-bottom: 1px solid rgba(0,0,0,.07); vertical-align: top; }
  table.hist td.num { text-align: right; font-weight: 700; white-space: nowrap; }
  table.hist td:last-child { white-space: nowrap; }
  tr.muted td { opacity: .55; }
</style>
</head>

  if (S.pref && S.sel.includes(S.pref)) return String(+S.pref);
  const p = S.sel.map(r => D().rutas[r] && D().rutas[r].pref).find(p => p && S.sel.includes(p));
  return String(+(p || S.sel[0]));
}
// Compartimentos de la ruta: los marcados con esa RUTA en COMPARTIMENTOS; si no hay, los generales (RUTA vacía)
const letrasDe = k => { const r = String(pref()).padStart(2, '0'), p = k.letras.filter(x => x.ruta === r); return p.length ? p : k.letras.filter(x => !x.ruta); };
const compsDe = k => letrasDe(k).map(x => ({ id: pref() + x.l, l: x.l, esp: x.esp, mezcla: x.mezcla || [], cap: Number(x.cap) || 0 }));
const comps = () => compsDe(T());
const comp = id => comps().find(c => c.id === id);
const compLabel = c => c.esp.map(e => SP[e] || e).join(' + ');
const spClass = c => c.esp.length > 1 ? 'sp-MX' : 'sp-' + c.esp[0];
const bgComp = c => spClass(c).replace('sp-', 'bg-');                          // sp-O → bg-O
const bgEsp = e => ({ D: 'bg-D', O: 'bg-O', C: 'bg-C', V: 'bg-V' })[String(e || '').toUpperCase()] || '';
const letraDe = id => String(id || '').replace(/^\d+/, '').toUpperCase();   // 5D → D, 4v → V
const bgId = id => bgEsp(letraDe(id));
const tq = id => `<span class="tank sp-${esc(letraDe(id))}">${esc(id)}</span>`;
function mezclaMsg(esp, c) {
  return c.esp.includes('D') && esp !== 'D'
    ? `${labelEsp(esp)} en ${c.id}: todo el compartimento deja de ser D.O.`
    : `${labelEsp(esp)} en ${c.id}, que es de ${compLabel(c)}: se mezclan.`;
}
function compat(esp, c) {
  if (c.esp.includes(esp)) return { ok: true };
  if (esp === 'V' && c.esp.includes('C')) return { ok: true };
  if (esp === 'D' && c.esp.includes('O')) return { ok: true, warn: 'Leche D.O. en compartimento de oveja: pierde la D.O.' };
  if (c.mezcla.includes(esp)) return { ok: true, bad: true, warn: mezclaMsg(esp, c) };
  return { ok: false };
}
const recsViaje = () => Object.values(S.rec);
const mixed = c => recsViaje().some(x => !x.sin && (x.dest === c.id && !compat(x.esp, c).ok || x.arr && x.arr.dest === c.id && x.arr.tipo === 'reparto' && !compat(x.esp, c).ok || x.rep && x.rep.dest === c.id && !compat(x.esp, c).ok));
const grp = e => (e === 'O' || e === 'D') ? 'OV' : 'VC';
const vcComps = () => comps().filter(c => !c.esp.includes('O') && !c.esp.includes('D'));
function addTot(tot, x) { if (x.sin) return; const a = x.arr ? x.arr.l : 0, p = x.rep ? x.rep.l : 0; tot[x.dest] = (tot[x.dest] || 0) + x.litros - a - p; if (a) tot[x.arr.dest] = (tot[x.arr.dest] || 0) + a; if (p) tot[x.rep.dest] = (tot[x.rep.dest] || 0) + p; }
function totales() { const t = {}; comps().forEach(c => t[c.id] = 0); recsViaje().forEach(x => addTot(t, x)); return t; }
function habitual(g) { const c = comps().find(c => c.l === g.dl); return c ? c.id : (comps().find(c => compat(g.esp, c).ok) || comps()[0]).id; }

/* ═══════════ SERVIDOR Y COLA SIN COBERTURA ═══════════ */
async function api(accion, datos) {
  if (API.startsWith('PEGAR')) throw new Error('Falta configurar la dirección del servidor (API) en la app.');
  if (!S.dev) { S.dev = 'D' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); persistir(); }
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ accion, pin: S.pin, dev: S.dev }, datos)) });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'PIN incorrecto' && accion !== 'login') { pinCaducado(); throw new Error('El PIN ha cambiado. Escribe el nuevo.'); }
    throw new Error(j.error || 'Error del servidor');
  }
  return j;
}
const esRed = e => !(e instanceof Error) || /fetch|network|Failed|Load failed|NetworkError/i.test(e.message);
const pendientes = () => Object.keys(S.cola.recs).length + S.cola.cierres.length;
function encolar(rec) { S.cola.recs[rec.recId] = rec; persistir(); syncPill(); flush(); }
let flushing = false;
async function flush() {
  if (flushing || !S.pin || !pendientes()) { syncPill(); return; }
  flushing = true;
  try {
    const recs = Object.values(S.cola.recs);
    if (recs.length) {
      const r = await api('guardar', { recs });
      r.ids.forEach(id => delete S.cola.recs[id]); persistir();
    }
    while (S.cola.cierres.length) {
      await api('cerrarViaje', S.cola.cierres[0]);
      S.cola.cierres.shift(); persistir();
      toast('Viaje cerrado y enviado a la oficina');
    }
    S.online = true;
  } catch (e) { S.online = !esRed(e) ? S.online : false; if (!esRed(e)) toast('Error al enviar: ' + e.message); }
  flushing = false; syncPill();
}
function syncPill() {
  const p = pendientes(), on = navigator.onLine && S.online !== false;
  $('#sync').classList.toggle('off', !on || p > 0);
  $('#syncTxt').textContent = p ? `${p} sin enviar` : (on ? 'Todo enviado' : 'Sin cobertura');
}
window.addEventListener('online', () => { S.online = true; flush(); });
window.addEventListener('offline', () => { S.online = false; syncPill(); });
setInterval(flush, 30000);
$('#sync').onclick = () => { S.online = true; flush(); toast(pendientes() ? 'Intentando enviar…' : 'Todo está enviado'); };

/* ═══════════ PANTALLAS ═══════════ */
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 3200); }
const VIEWS = ['vPin', 'vRutas', 'vCamion', 'vTras', 'vDeca', 'vLista', 'vFicha', 'vFin', 'vHist', 'vOfi', 'vOfiV', 'vOfiE'];
function show(v, title, sub) {
  VIEWS.forEach(id => $('#' + id).hidden = id !== v);

  $('#back').hidden = ['vPin', 'vDeca', 'vRutas', 'vOfi'].includes(v) || (v === 'vLista');

}

};
function ocupado(btn, txt) { U.ocupado = true; btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = txt; }
function libre(btn) { U.ocupado = false; btn.disabled = false; if (btn.dataset.t) btn.textContent = btn.dataset.t; }

/* 0. PIN */
// La oficina ha cambiado el PIN: se pide el nuevo sin borrar el viaje ni lo pendiente de enviar
function pinCaducado() { if (!S.pin) return; S.pin = null; persistir(); syncPill(); pinView('La oficina ha cambiado tu PIN. Escribe el nuevo. No se ha perdido nada de lo apuntado.'); }

    <p class="muted">Escribe tu PIN de conductor. Solo verás tus rutas.</p>

const TIPOS = { D: { t: 'D.O.', l: 'D', esp: ['D'] }, O: { t: 'Oveja', l: 'O', esp: ['O'] }, CV: { t: 'Cabra + vaca', l: 'C', esp: ['C', 'V'] }, C: { t: 'Cabra', l: 'C', esp: ['C'] }, V: { t: 'Vaca', l: 'V', esp: ['V'] } };

function adoptarCamion(resp, localId) {
  if (resp.camion && !CAM(resp.camion.id)) D().camiones.push(resp.camion);

/* 2. Iniciar viaje: genera el DeCA en el servidor */
async function iniciar() {
  if (U.ocupado) return;
  const b = $('#ini'), m = $('#iniMsg');
  const seen = new Set(), list = [];
  S.sel.forEach(r => ganRuta(r).forEach(g => { if (seen.has(kg(g))) return; seen.add(kg(g)); list.push({ cod: g.cod, esp: g.esp, k: kg(g), ruta: r, ord: g.ord }); }));
  const est = Math.round(num($('#estL').value) || 0);
  if (!(est > 0)) { m.hidden = false; m.className = 'msg bad'; m.textContent = 'Escribe los litros estimados de hoy. El DeCA no puede salir con 0 kg.'; $('#estL').focus(); return; }
  const id = 'V' + Date.now().toString(36).toUpperCase() + '-' + D().conductor.id;
  ocupado(b, 'Generando DeCA…');
  try {
    const r = await api('iniciarViaje', { viaje: { id, rutas: S.sel, pref: pref(), camion: camionPayload(T()), estLitros: est, confirmado: !!U.otroViaje } });
    if (r.hoy) { S.datos.hoy = r.hoy; persistir(); }
    if (r.aviso) {
      libre(b); m.hidden = false; m.className = 'msg bad';
      m.innerHTML = `<p><b>Hoy ya se ha hecho ${S.sel.length > 1 ? 'esta ruta' : 'la ruta ' + (+S.sel[0])}:</b></p><p class="small">${r.aviso.map(v => esc(txtViaje(v))).join('<br>')}</p>
        <p style="margin-top:6px">Si es un segundo viaje de verdad, confírmalo. Si no, no lo inicies: se repetirían los ganaderos.</p>
        <button class="btn" id="otroOk" style="margin-top:10px;background:var(--bad);box-shadow:none">Sí, es otro viaje. Iniciar</button>`;
      $('#otroOk').onclick = () => { U.otroViaje = true; iniciar(); };
      return;
    }
    U.otroViaje = false;
    S.cam = adoptarCamion(r, S.cam);
    S.viaje = Object.assign({}, r.viaje, { rutas: S.sel.slice(), prefijo: pref(), est, empezado: false });
    S.cadena = [r.viaje.id]; S.decas = []; S.list = list; S.rec = {}; S.lastI = null; S.estManual = '';
    persistir(); U.vistaPrev = null; deca();
  } catch (e) {
    libre(b); m.hidden = false; m.className = 'msg bad';
    m.textContent = esRed(e) ? 'Sin cobertura: el DeCA necesita conexión para generarse. Busca cobertura y vuelve a pulsar.' : e.message;
  }
}
// Lo ya recogido HOY en otros viajes (de esta u otra app): para no repetir la ruta por error
const HOY = () => (D() && D().hoy) || { viajes: [], recs: {} };
const hoyOtro = k => { const h = HOY().recs[k]; return h && !(S.cadena || []).includes(h.viaje) ? h : null; };
const viajesHoy = rs => HOY().viajes.filter(v => !(S.cadena || []).includes(v.id) && String(v.rutas).split(/[,\s]+/).some(r => rs.map(x => String(+x)).includes(String(+r))));
const txtViaje = v => `DeCA ${v.deca} · ${v.matricula} · ${v.ini}${v.fin ? '–' + v.fin : ''}${/CURSO/.test(v.estado) ? ' (sin cerrar)' : ''} · ${fmt(v.litros)} l${v.conductor !== D().conductor.id ? ' · ' + v.conductor : ''}`;
// Un mismo ganadero puede tener dos especies (oveja y cabra): cada especie es una parada distinta (clave código|especie)
const kg = g => g.cod + '|' + g.esp;
const gan = k => D().ganaderos.find(g => kg(g) === k) || D().ganaderos.find(g => g.cod === k) || { cod: String(k).split('|')[0], nom: String(k).split('|')[0], esp: String(k).split('|')[1] || 'O', dl: '', pue: '', ult: 0 };

  <div class="card deca"><div id="qr" aria-label="Código QR del DeCA"></div>
    <dl class="kv">

  <p class="small muted">Si te para la Guardia Civil, enseña esta pantalla: el QR descarga el PDF sin pedir clave. Durante el viaje lo tienes siempre en el botón <b>DeCA</b> de arriba.</p>
  <button class="btn" id="go">${enCurso ? 'Volver a la recogida' : 'Empezar recogida'}</button>

  catch (e) { $('#qr').innerHTML = '<p class="small">QR no disponible</p>'; }

  $('#go').onclick = () => { S.viaje.empezado = true; persistir();
    if (U.vistaPrev === 'vFicha' && U.volver != null) ficha(U.volver); else if (U.vistaPrev === 'vFin') fin(); else lista(); };
  show('vDeca', 'DeCA · Ruta ' + S.viaje.rutas.map(x => +x).join(' y '), V.matricula);
}

/* Anular un viaje iniciado por error (sin ningún ganadero apuntado) */
const anulable = () => S.viaje && !Object.keys(S.rec).length && (S.cadena || []).length <= 1 && !pendientes();
function anular() {
  const v = U.view === 'vDeca' ? $('#vDeca') : $('#vLista'), b = $('#anular');
  if (!b.dataset.ok) {
    b.dataset.ok = '1'; b.className = 'btn'; b.style.background = 'var(--bad)'; b.style.boxShadow = 'none';
    b.textContent = 'Sí, anular. No voy a hacer este viaje';
    b.insertAdjacentHTML('beforebegin', '<div class="msg warn" id="anuMsg">Se anulará el DeCA ' + esc(S.viaje.decaNum) + '. No se envía nada a la oficina y podrás iniciar el viaje de nuevo cuando toque.</div>');
    return;
  }
  if (U.ocupado) return;
  ocupado(b, 'Anulando…');
  api('anularViaje', { viajeId: S.viaje.id }).then(() => {
    S.viaje = null; S.list = []; S.rec = {}; S.decas = []; S.cadena = []; S.lastI = null; persistir();
    toast('Viaje anulado'); rutas();
  }).catch(e => { libre(b); const m = $('#anuMsg'); if (m) { m.className = 'msg bad'; m.textContent = esRed(e) ? 'Sin cobertura: para anular hace falta conexión.' : e.message; } });
}

/* 3. Lista de ganaderos */
function siguiente() {
  const L = S.list, desde = S.lastI == null ? -1 : S.lastI;
  let k = L.findIndex((x, j) => j > desde && !S.rec[x.k]);
  if (k < 0) k = L.findIndex(x => !S.rec[x.k]);
  return k;
}
function lista() {
  const L = S.list, done = L.filter(x => S.rec[x.k]).length, next = siguiente(), tot = totales();
  const sum = Object.values(tot).reduce((a, b) => a + b, 0), nx = next >= 0 ? L[next] : null, v = $('#vLista');
  v.innerHTML = `${nx ? `<div class="next-card">
    <span class="lbl">Siguiente parada · ${next + 1} de ${L.length}</span>
    <h2>${esc(gan(nx.k).nom)}</h2>
    <p>${esc(gan(nx.k).pue)} · ${labelEsp(gan(nx.k).esp)} · destino ${habitual(gan(nx.k))}</p>
    <button class="btn" id="anotar">Anotar recogida</button>
  </div>` : `<div class="msg ok">Todos los ganaderos anotados. Ya puedes terminar el viaje.</div>`}
  <div class="card stack">
    <div class="route-head"><span class="lbl">${done} de ${L.length} ganaderos</span><b class="num" style="font-family:var(--display);font-size:24px">${fmt(sum)} l</b></div>
    <div class="progress"><i style="width:${L.length ? done / L.length * 100 : 0}%"></i></div>
    <div class="tally">${comps().map(c => `<div class="${bgComp(c)}"><span class="tank ${spClass(c)}">${c.id}</span><b class="num">${fmt(tot[c.id])}</b>${c.cap ? `<small class="muted">de ${fmt(c.cap)}</small>` : ''}${mixed(c) ? '<small style="color:var(--bad);font-weight:700">mezcla</small>' : ''}</div>`).join('')}</div>
  </div>
  <p class="small muted">Si hoy vas en otro orden, toca el ganadero que quieras.</p>
  <div class="stack">${L.map((x, i) => {
    const g = gan(x.k), r = S.rec[x.k];
    const cls = r ? (r.sin ? 'skip' : 'done') : (i === next ? 'next' : '');
    const ho = !r && hoyOtro(x.k);
    const st = r ? (r.sin ? 'No recogido' : fmt(r.litros) + ' l · ' + r.dest) : ho ? `<span style="color:var(--bad)">Ya hoy ${esc(ho.hora)}<br>${fmt(ho.l)} l</span>` : (i === next ? 'Siguiente' : '');
    const prevRuta = i > 0 && L[i - 1].ruta !== x.ruta;
    const cambio = i > 0 && !prevRuta && grp(gan(L[i - 1].k).esp) !== grp(g.esp);
    return `${prevRuta || (i === 0 && S.viaje.rutas.length > 1) ? `<span class="lbl" style="margin-top:6px">Ruta ${+x.ruta}</span>` : ''}${cambio ? `<span class="small" style="color:var(--warn);font-weight:700;padding-left:4px">↓ Cambio de manguera: ${grp(g.esp) === 'OV' ? 'vaca/cabra → oveja' : 'oveja → vaca/cabra'}</span>` : ''}
      <button class="farm ${cls} ${bgEsp(g.esp)}" data-i="${i}"><span class="n">${i + 1}</span>
      <span class="main"><span class="name">${esc(g.nom)}</span><span class="sub">${esc(g.pue)} · <span class="sp-${g.esp}">${labelEsp(g.esp)}</span></span></span>
      <span class="st num">${st}</span></button>`;
  }).join('')}</div>
  <button class="btn ${done === L.length ? '' : 'sec'}" id="fin">Terminar viaje</button>
  <button class="btn ghost" id="averia">Avería: trasvase a otro camión</button>
  ${anulable() ? '<button class="btn ghost" id="anular">Me he equivocado: anular este viaje</button>' : ''}`;
  if ($('#anular')) $('#anular').onclick = anular;
  v.querySelectorAll('[data-i]').forEach(b => b.onclick = () => ficha(+b.dataset.i));
  if (nx) $('#anotar').onclick = () => ficha(next);
  $('#fin').onclick = fin;
  $('#averia').onclick = () => camion('trasvase');
  show('vLista', 'Ruta ' + S.viaje.rutas.map(x => +x).join(' y '), `${T().matricula} · DeCA ${S.viaje.decaNum}`);
}

/* 4. Ficha de recogida */
function ficha(i) {
  S.i = i;
  const x = S.list[i], g = gan(x.k), r = S.rec[x.k] || {}, cf = CFG();
  const hab = habitual(g); let dest = r.dest && comp(r.dest) ? r.dest : hab;
  U.pos = null;
  if (navigator.geolocation) navigator.geolocation.getCurrentPosition(p => U.pos = p.coords, () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 120000 });
  const v = $('#vFicha');
  v.innerHTML = `<div class="card farmer-head ${bgEsp(g.esp)}">
      <div style="min-width:0"><h3 class="fname">${esc(g.nom)}</h3><p class="small muted"><span class="mono">${esc(g.cod)}</span> · R${+x.ruta}/${esc(x.ord)} · ${esc(g.pue)}</p></div>
      <span class="sp-badge sp-${g.esp}">${labelEsp(g.esp)}</span></div>
    <div class="pair">
      <div class="field"><label class="lbl" for="lit">Litros</label>
        <div class="unit"><input class="big" id="lit" inputmode="numeric" enterkeyhint="next" autocomplete="off" value="${r.litros ?? ''}" placeholder="0"><span>l</span></div></div>
      <div class="field"><label class="lbl" for="tmp">Temp.</label>
        <div class="unit"><input class="big" id="tmp" inputmode="decimal" enterkeyhint="next" autocomplete="off" value="${r.temp != null ? String(r.temp).replace('.', ',') : ''}" placeholder="0,0"><span>°C</span></div></div>
    </div>
    <div id="litMsg" hidden></div><div id="tmpMsg" hidden></div>
    <div class="field"><label class="lbl" for="mue">Nº de la pegatina de la muestra</label>
      <div class="scan"><input id="mue" inputmode="numeric" enterkeyhint="done" autocomplete="off" value="${esc(r.muestra || '')}" placeholder="7226500…"><button id="scanBtn">Escanear</button></div></div>
    <div class="field"><span class="lbl">Destino</span>
      <div class="dests" id="dests"></div><div id="destMsg" hidden></div></div>
    <div id="capMsg" hidden></div>
    <div class="field" id="arrBox" hidden>
      <button class="btn sec" id="arrTog">Arrastre de manguera</button>
      <div id="arrBody" class="stack" hidden>
        <div id="arrHint" class="msg warn" hidden></div>
        <span class="lbl">Litros de arrastre</span>
        <input class="big" id="arrL" inputmode="numeric" autocomplete="off" placeholder="0" style="font-size:30px">
        <div class="row" id="arrQuick">${[10, 15, 20, 30].map(n => `<button class="btn sec" data-q="${n}" style="padding:8px;min-height:48px">${n}</button>`).join('')}</div>
        <span class="lbl">Al compartimento</span>
        <div class="dests" id="arrDests"></div>
        <p class="small muted">La oveja puede pasar a vaca/cabra, nunca al revés.</p>
        <div id="arrMsg" hidden></div>
      </div>
    </div>
    <div class="field" id="repBox" hidden>
      <button class="btn sec" id="repTog">No cabe todo: parte a otro compartimento</button>
      <div id="repBody" class="stack" hidden>
        <span class="lbl">Litros que van a otro compartimento</span>
        <input class="big" id="repL" inputmode="numeric" autocomplete="off" placeholder="0" style="font-size:30px">
        <span class="lbl">Al compartimento</span>
        <div class="dests" id="repDests"></div>
        <div id="repMsg" hidden></div>
      </div>
    </div>
    <div id="repRes" class="msg ok" hidden></div>
    <div id="err" class="msg bad" hidden></div>
    <button class="btn" id="save">Guardar y siguiente</button>
    <button class="btn ghost" id="sin">Hoy no se recoge</button>`;
  const drawDests = () => {
    $('#dests').innerHTML = comps().map(c => `<button class="dest ${bgComp(c)}" aria-pressed="${c.id === dest}" data-d="${c.id}">
      <b class="${spClass(c)}">${c.id}</b><small>${compLabel(c)}</small>${c.id === hab ? '<span class="hab">habitual</span>' : ''}</button>`).join('');
    $('#dests').querySelectorAll('[data-d]').forEach(b => b.onclick = () => { dest = b.dataset.d; confirmMix = false; drawDests(); drawArr(); drawRep(); chkCap(); });
    const m = $('#destMsg'), k = compat(g.esp, comp(dest));
    if (!k.ok) { m.hidden = false; m.className = 'msg bad'; m.textContent = mezclaMsg(g.esp, comp(dest)) + ' Si no hay otro sitio, puedes guardarla igualmente y quedará como incidencia.'; }
    else if (k.warn) { m.hidden = false; m.className = 'msg ' + (k.bad ? 'bad' : 'warn'); m.textContent = k.warn; }
    else if (dest !== hab) { m.hidden = false; m.className = 'msg warn'; m.textContent = `Cambiado. Lo habitual es ${hab}.`; }
    else m.hidden = true;
  };
  let confirmMix = !!r.mezcla, confirmDup = !!r.litros;
  drawDests();
  // Hasta tres destinos: el principal, el arrastre de manguera (oveja → vaca/cabra) y lo que no cabe (reparto)
  const otros = () => comps().filter(c => c.id !== dest);
  // Lo que ya lleva cada compartimento sin contar esta recogida
  const llevaYa = () => { const t = {}; comps().forEach(c => t[c.id] = 0); recsViaje().filter(y => y.recId !== r.recId).forEach(y => addTot(t, y)); return t; };
  const mejorOtro = () => {   // compatible > compatible con aviso > otro que no sea D.O. > el resto; a igualdad, el que tenga más sitio
    const t = llevaYa(), libre = c => c.cap ? c.cap - (t[c.id] || 0) : 1e9;
    const nota = c => { const k = compat(g.esp, c); return k.ok && !k.warn ? 0 : k.ok ? 1 : !c.esp.includes('D') ? 2 : 3; };
    return (otros().sort((a, b) => nota(a) - nota(b) || libre(b) - libre(a))[0] || {}).id; };
  const esOV = grp(g.esp) === 'OV' && vcComps().length > 0;
  // Recogidas guardadas con la v6–v8 (un solo "otro compartimento"): si era reparto, pasa al panel de reparto
  let rArr = r.arr && r.arr.tipo !== 'reparto' ? r.arr : null, rRep = r.rep || (r.arr && r.arr.tipo === 'reparto' ? r.arr : null);
  if (r.arr && r.arr.tipo === 'reparto' && r.rep) rArr = r.arr;
  let arrOn = !!rArr, arrDest = rArr ? rArr.dest : (vcComps()[0] || {}).id;
  let repOn = !!rRep, repDest = rRep ? rRep.dest : null;
  const vArr = () => arrOn ? (num($('#arrL').value) || 0) : 0, vRep = () => repOn ? (num($('#repL').value) || 0) : 0;
  let drawArr = () => {}, drawRep = () => {};
  const resumen = () => {
    const el = $('#repRes'), l = num($('#lit').value) || 0, a = vArr(), p = vRep();
    if (!(l > 0) || !(a > 0 || p > 0)) { el.hidden = true; return; }
    el.hidden = false; el.className = 'msg ' + (a + p >= l ? 'bad' : 'ok');
    el.innerHTML = a + p >= l ? 'Lo que va a otros compartimentos no puede ser igual o mayor que el total.'
      : `Reparto: <b>${esc(dest)} ${fmt(l - a - p)} l</b>${a > 0 ? ` · ${esc(arrDest)} ${fmt(a)} l (arrastre)` : ''}${p > 0 ? ` · ${esc(repDest)} ${fmt(p)} l (no cabía)` : ''}`;
  };
  const chkCap = () => {
    const m = $('#capMsg'), c = comp(dest), l = num($('#lit').value) || 0;
    if (!c || !c.cap || !(l > 0)) { m.hidden = true; return; }
    const lleva = llevaYa()[dest] || 0, libre = Math.max(c.cap - lleva, 0), va = l - vArr() - vRep();
    if (va <= libre) { m.hidden = true; return; }
    const resto = Math.round(va - libre), lleno = libre <= 0, alt = mejorOtro();
    m.hidden = false; m.className = 'msg warn';
    m.innerHTML = lleno
      ? `<b>${esc(dest)}</b> está lleno (lleva ${fmt(lleva)} de ${fmt(c.cap)}).${alt ? ` <button class="btn sec" id="capAll" style="margin-top:8px">Llevar todo a ${esc(alt)}</button>` : ''}`
      : `En <b>${esc(dest)}</b> quedan unos <b>${fmt(libre)} l</b> (lleva ${fmt(lleva)} de ${fmt(c.cap)}). Si no cabe todo, pasa el resto a otro compartimento.
      ${otros().length ? `<button class="btn sec" id="capOk" style="margin-top:8px">Pasar ${fmt(resto)} l a otro compartimento</button>` : ''}`;
    const ba = $('#capAll'); if (ba) ba.onclick = () => { dest = alt; confirmMix = false; repOn = false; $('#repL').value = ''; drawDests(); drawArr(); drawRep(); };
    const b = $('#capOk'); if (b) b.onclick = () => { repOn = true; $('#repL').value = Math.round(vRep() + resto); if (!repDest || repDest === dest) repDest = mejorOtro(); drawRep(); $('#repL').scrollIntoView({ block: 'center', behavior: 'smooth' }); };
  };
  if (esOV) {
    $('#arrBox').hidden = false;
    const prev = i > 0 ? gan(S.list[i - 1].k) : null, next = i < S.list.length - 1 ? gan(S.list[i + 1].k) : null;
    const hint = prev && grp(prev.esp) === 'VC' ? `Vienes de ${labelEsp(prev.esp).toLowerCase()}: el arrastre del principio va a vaca/cabra.`
      : next && grp(next.esp) === 'VC' ? `El siguiente es ${labelEsp(next.esp).toLowerCase()}: si cambias la llave antes, anota aquí lo que pase.` : '';
    if (hint) { $('#arrHint').hidden = false; $('#arrHint').textContent = hint; if (!r.litros) arrOn = true; }
    if (rArr) $('#arrL').value = rArr.l;
    drawArr = () => {
      const vc = vcComps().filter(c => c.id !== dest);
      if (!vc.some(c => c.id === arrDest)) arrDest = (vc[0] || {}).id;
      $('#arrBody').hidden = !arrOn;
      $('#arrTog').textContent = arrOn ? 'Quitar arrastre' : 'Arrastre de manguera (a vaca/cabra)';
      $('#arrDests').innerHTML = vc.map(c => `<button class="dest ${bgComp(c)}" aria-pressed="${c.id === arrDest}" data-a="${c.id}"><b class="${spClass(c)}">${c.id}</b><small>${compLabel(c)}</small></button>`).join('');
      $('#arrDests').querySelectorAll('[data-a]').forEach(b => b.onclick = () => { arrDest = b.dataset.a; drawArr(); });
      const a = num($('#arrL').value), m = $('#arrMsg');
      if (a > cf.arrastreAviso) { m.hidden = false; m.className = 'msg bad'; m.textContent = `Más de ${cf.arrastreAviso} l de ${labelEsp(g.esp).toLowerCase()} en ${arrDest}: ya no es arrastre, se anota como mezcla.`; }
      else m.hidden = true;
      resumen(); chkCap();
    };
    $('#arrTog').onclick = () => { arrOn = !arrOn; if (!arrOn) $('#arrL').value = ''; drawArr(); };
    $('#arrQuick').querySelectorAll('[data-q]').forEach(b => b.onclick = () => { $('#arrL').value = b.dataset.q; drawArr(); });
    $('#arrL').oninput = drawArr;
  }
  if (comps().length > 1) {
    $('#repBox').hidden = false;
    if (rRep) $('#repL').value = rRep.l;
    drawRep = () => {
      if (!repDest || repDest === dest) repDest = mejorOtro();
      $('#repBody').hidden = !repOn;
      $('#repTog').textContent = repOn ? 'Quitar: todo cabe en ' + dest : 'No cabe todo: parte a otro compartimento';
      $('#repDests').innerHTML = otros().map(c => `<button class="dest ${bgComp(c)}" aria-pressed="${c.id === repDest}" data-p="${c.id}"><b class="${spClass(c)}">${c.id}</b><small>${compLabel(c)}</small></button>`).join('');
      $('#repDests').querySelectorAll('[data-p]').forEach(b => b.onclick = () => { repDest = b.dataset.p; drawRep(); });
      const m = $('#repMsg'), c2 = comp(repDest), k2 = c2 ? compat(g.esp, c2) : { ok: true };
      if (c2 && !k2.ok) { m.hidden = false; m.className = 'msg bad'; m.textContent = mezclaMsg(g.esp, c2) + ' Quedará anotado como mezcla.'; }
      else if (c2 && k2.warn) { m.hidden = false; m.className = 'msg ' + (k2.bad ? 'bad' : 'warn'); m.textContent = k2.warn; }
      else m.hidden = true;
      resumen(); chkCap();
    };
    $('#repTog').onclick = () => { repOn = !repOn; if (!repOn) $('#repL').value = ''; drawRep(); };
    $('#repL').oninput = drawRep;
  }
  drawArr(); drawRep(); chkCap();
  const chkLit = () => { const l = num($('#lit').value), m = $('#litMsg');

/* 4b. Escáner del código de barras de la muestra */
let lector = null;
async function escanear(onCode) {
  if (!window.Html5Qrcode) { toast('Escáner no disponible: escribe el número'); return; }
  const m = $('#scanner'); m.hidden = false;
  lector = new Html5Qrcode('reader');
  const cerrar = async () => { try { await lector.stop(); } catch (e) {} try { lector.clear(); } catch (e) {} m.hidden = true; };
  $('#scanCancel').onclick = cerrar;
  try {
    await lector.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(Math.min(w * 0.9, 360)), height: Math.floor(Math.min(h * 0.35, 150)) }) },
      txt => { if (navigator.vibrate) navigator.vibrate(80); cerrar(); onCode(((txt.match(/\d{6,}/) || [txt])[0]).trim()); });
  } catch (e) { cerrar(); toast('No se pudo abrir la cámara. Da permiso a la cámara o escribe el número.'); }
}

/* 1c. Trasvase por avería */
function trasvase() {
  const nuevo = CAM(U.camNuevo), v = $('#vTras'), tot = totales();
  const nc = compsDe(nuevo);
  const okPara = (o, d) => o.esp.every(e => { const k = compat(e, d); return k.ok && !k.bad; });
  if (!U.map) { U.map = {}; comps().forEach(o => { const d = nc.find(d => d.l === o.l && okPara(o, d)) || nc.find(d => okPara(o, d)) || nc[0]; U.map[o.id] = d.id; }); }
  const conL = comps().filter(o => tot[o.id] > 0);
  const destDe = o => nc.find(d => d.id === U.map[o.id]);
  const errores = conL.filter(o => !okPara(o, destDe(o)));
  v.innerHTML = `<div class="card stack"><span class="lbl">De <span class="mono">${esc(T().matricula)}</span> a <span class="mono">${esc(nuevo.matricula)}</span></span>
    <p class="small muted">Indica a qué compartimento del camión nuevo pasa cada uno. Hace falta cobertura para generar el DeCA nuevo.</p></div>
  ${conL.length ? conL.map(o => `<div class="card stack">
    <div class="route-head"><span><span class="tank ${spClass(o)}">${o.id}</span> <span class="small muted">${compLabel(o)}</span></span><b class="num">${fmt(tot[o.id])} l</b></div>
    <span class="lbl">Pasa a</span>
    <div class="dests">${nc.map(d => `<button class="dest ${bgComp(d)}" aria-pressed="${U.map[o.id] === d.id}" data-o="${o.id}" data-d="${d.id}"><b class="${spClass(d)}">${d.id}</b><small>${compLabel(d)}</small></button>`).join('')}</div>
    ${!okPara(o, destDe(o)) ? `<div class="msg bad">${compLabel(o)} a un compartimento de ${compLabel(destDe(o))}: se mezclan${destDe(o).esp.includes('D') ? ' y deja de ser D.O.' : ''}. Si no hay otro sitio, confirma igualmente y quedará como incidencia.</div>` : ''}
  </div>`).join('') : `<div class="msg ok">Todavía no hay leche recogida. Solo cambian el camión y el DeCA.</div>`}
  <div id="trMsg" hidden></div>
  <button class="btn" id="trOk" ${errores.length ? 'style="background:var(--bad);box-shadow:none"' : ''}>${errores.length ? 'Confirmar trasvase con mezcla' : 'Confirmar trasvase'}</button>`;
  v.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { U.map[b.dataset.o] = b.dataset.d; trasvase(); });
  $('#trOk').onclick = async () => {
    if (U.ocupado) return;
    const b = $('#trOk'), m = $('#trMsg');
    const litros = Object.values(tot).reduce((a, b) => a + b, 0);
    const pend = S.list.filter(x => !S.rec[x.k]).reduce((a, x) => a + (gan(x.k).ult || 0), 0);
    const id = 'V' + Date.now().toString(36).toUpperCase() + '-' + D().conductor.id;
    ocupado(b, 'Generando DeCA nuevo…');
    try {
      const r = await api('trasvase', { viajeId: S.viaje.id, litrosHasta: litros,
        nuevo: { id, rutas: S.viaje.rutas, pref: S.viaje.prefijo, camion: camionPayload(nuevo), estLitros: litros + pend } });
      const antes = { num: S.viaje.decaNum, matricula: S.viaje.matricula, litros };
      const map = Object.assign({}, U.map);
      S.cam = adoptarCamion(r, nuevo.id);
      // Las recogidas ya hechas pasan a figurar en el compartimento del camión nuevo (se reenvían)
      recsViaje().forEach(x => { if (x.sin) return; x.destOrig = x.destOrig || x.dest; x.dest = map[x.dest] || x.dest; x.letra = (comp(x.dest) || {}).l || x.letra; x.noHabitual = true; x.mezcla = x.mezcla || !compat(x.esp, comp(x.dest)).ok; if (x.arr) x.arr.dest = map[x.arr.dest] || x.arr.dest; if (x.rep) x.rep.dest = map[x.rep.dest] || x.rep.dest; S.cola.recs[x.recId] = x; });
      S.decas.push(antes);
      S.viaje = Object.assign({}, r.viaje, { rutas: S.viaje.rutas, prefijo: S.viaje.prefijo, est: litros + pend, empezado: true,
        trasvase: { anterior: antes.num, desde: antes.matricula, litros } });
      S.cadena.push(r.viaje.id); U.map = null; persistir(); flush();
      toast('Trasvase registrado. DeCA nuevo generado.'); U.vistaPrev = 'vLista'; deca();
    } catch (e) {
      libre(b); m.hidden = false; m.className = 'msg bad';
      m.textContent = esRed(e) ? 'Sin cobertura: el DeCA nuevo necesita conexión. Busca cobertura y vuelve a pulsar.' : e.message;
    }
  };
  show('vTras', 'Trasvase', `${T().matricula} → ${nuevo.matricula}`);
}

/* 6. Consulta de días anteriores (solo lectura). Si hay un error, se avisa a la oficina y la oficina lo corrige. */
const DIAS_SEM = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function diaTxt(f) { const m = String(f).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); if (!m) return f; const d = new Date(+m[3], +m[2] - 1, +m[1]); return DIAS_SEM[d.getDay()] + ' ' + m[1] + '/' + m[2]; }
function totDia(viajes) {
  const t = {}; let total = 0, n = 0;
  viajes.forEach(v => v.recs.forEach(r => { if (r.sin) return; n++; total += r.l;
    if (r.d1) t[r.d1] = (t[r.d1] || 0) + (r.l1 || r.l); if (r.d2 && r.l2) t[r.d2] = (t[r.d2] || 0) + r.l2; if (r.d3 && r.l3) t[r.d3] = (t[r.d3] || 0) + r.l3; }));
  return { t, total, n };
}

  const tarjeta = x => { const ult = x.recs.filter(r => r.hora).sort((a, b) => a.hora < b.hora ? 1 : -1)[0], hechos = x.recs.length, total = hechos + x.falta.length;

      <span class="sub">${esc(x.matricula)} · ${esc(x.ini)}${x.fin ? '–' + esc(x.fin) : ''}${/CURSO/.test(x.estado) ? ` · ${hechos} de ${total} · último ${ult ? esc(ult.hora) : '—'}` : ''}${x.recs.some(r => r.cor) ? ' · <b style="color:var(--warn)">corregido</b>' : ''}${/TRASVASE/.test(x.estado) ? ' · trasvase' : ''}</span></span>

  $('#ofiSalir').onclick = () => { S = Object.assign({}, S0, { cola: { recs: {}, cierres: [] }, dev: S.dev }); O.viajes = null; persistir(); pinView(); };
  show('vOfi', 'Oficina', u.nombre);

    <div class="card"><table class="hist"><thead><tr><th>Ganadero</th><th>Litros</th><th>Destino</th></tr></thead><tbody>
      ${x.recs.map((r, i) => `<tr class="${bgEsp(r.esp)}${r.sin ? ' muted' : ''}" ${cerrado ? `data-r="${i}" style="cursor:pointer"` : ''}><td><b>${esc(r.nom || r.cod)}</b><br><span class="small muted">${esc(r.cod)} · R${+r.ruta}/${esc(r.ord)} · ${labelEsp(r.esp)}${r.sin ? '' : ' · ' + esc(r.t) + ' °C'}${r.hora ? ' · ' + esc(r.hora) : ''}${r.cor ? `<br><b style="color:var(--warn)">Corregido: ${esc(r.cor)}</b>` : ''}</span></td>
        <td class="num">${r.sin ? '—' : fmt(r.l)}</td><td>${r.sin ? '<span class="small">No recogido</span>' : (r.d2 ? [[r.d1, r.l1], [r.d2, r.l2], [r.d3, r.l3]].filter(z => z[0]).map(z => tq(z[0]) + ' ' + fmt(z[1])).join('<br>') : tq(r.d1))}</td></tr>`).join('')}
    </tbody></table></div>
    ${x.falta.length ? `<div class="card stack"><span class="lbl">${cerrado ? 'Sin apuntar en este viaje' : 'Faltan por recoger'}</span>
      ${x.falta.map((g, i) => `<button class="farm ${bgEsp(g.esp)}" ${cerrado ? `data-f="${i}"` : 'disabled'}><span class="main"><span class="name">${esc(g.nom)}</span><span class="sub">${esc(g.cod)} · R${+g.ruta}/${esc(g.ord)} · ${labelEsp(g.esp)}</span></span><span class="st">${cerrado ? 'Añadir' : ''}</span></button>`).join('')}</div>` : ''}`;
  v.querySelectorAll('[data-r]').forEach(tr => tr.onclick = () => ofiEditar(x, x.recs[+tr.dataset.r], null));
  v.querySelectorAll('[data-f]').forEach(b => b.onclick = () => ofiEditar(x, null, x.falta[+b.dataset.f]));
  show('vOfiV', 'Viaje', x.nombre);
}
function ofiEditar(x, r, nuevo) {
  const v = $('#vOfiE'), g = r || nuevo, comps = x.comps.length ? x.comps : Array.from(new Set(x.recs.flatMap(y => [y.d1, y.d2, y.d3]).filter(Boolean)));
  let d1 = r ? r.d1 : (comps[0] || ''), d2 = r ? r.d2 : '', d3 = r ? r.d3 : '';
  const chips = (id, sel) => `<div class="dests" id="${id}">${comps.map(c => `<button class="dest ${bgId(c)}" aria-pressed="${c === sel}" data-c="${esc(c)}"><b class="sp-${esc(letraDe(c))}">${esc(c)}</b></button>`).join('')}</div>`;
  v.innerHTML = `<div class="card stack ${bgEsp(g.esp)}"><h3 class="fname">${esc(g.nom || g.cod)}</h3>
      <p class="small muted">${esc(g.cod)} · R${+g.ruta}/${esc(g.ord)} · ${labelEsp(g.esp)} · ${esc(diaTxt(x.fecha))} · DeCA ${esc(x.deca)}</p>
      ${r ? `<p class="small">Ahora: <b>${r.sin ? 'no recogido' : fmt(r.l) + ' l'}</b>${r.sin ? '' : ' · ' + esc(r.t) + ' °C · muestra ' + esc(r.mue) + ' · ' + [[r.d1, r.l1], [r.d2, r.l2], [r.d3, r.l3]].filter(z => z[0]).map(z => esc(z[0]) + ' ' + fmt(z[1])).join(' + ')}</p>` : '<div class="msg warn">Se añadirá este ganadero al viaje.</div>'}
    </div>
    <label class="row small" style="gap:8px;align-items:center"><input type="checkbox" id="eSin" ${r && r.sin ? 'checked' : ''} style="width:22px;height:22px"> No se le recogió</label>
    <div id="eDatos" class="stack">
      <div class="pair"><div class="field"><label class="lbl" for="eL">Litros totales</label><div class="unit"><input class="big" id="eL" inputmode="numeric" value="${r && !r.sin ? r.l : ''}"><span>l</span></div></div>
        <div class="field"><label class="lbl" for="eT">Temperatura</label><div class="unit"><input class="big" id="eT" inputmode="decimal" value="${r && !r.sin ? esc(r.t) : ''}"><span>°C</span></div></div></div>
      <div class="field"><label class="lbl" for="eM">Muestra</label><input id="eM" inputmode="numeric" value="${r ? esc(r.mue) : ''}"></div>
      <div class="field"><span class="lbl">Destino principal</span>${chips('eD1', d1)}<input id="eD1t" value="${esc(d1)}" placeholder="p. ej. 5D" style="margin-top:6px"></div>
      <div class="field"><span class="lbl">Otro destino (si se repartió)</span>${chips('eD2', d2)}<div class="pair"><input id="eD2t" value="${esc(d2)}" placeholder="destino"><input id="eL2" inputmode="numeric" value="${r && r.l2 ? r.l2 : ''}" placeholder="litros"></div></div>
      <div class="field"><span class="lbl">Tercer destino</span>${chips('eD3', d3)}<div class="pair"><input id="eD3t" value="${esc(d3)}" placeholder="destino"><input id="eL3" inputmode="numeric" value="${r && r.l3 ? r.l3 : ''}" placeholder="litros"></div></div>
      <div id="eRes" class="msg ok" hidden></div>
    </div>
    <div class="field"><label class="lbl" for="eMot">Motivo de la corrección (obligatorio)</label>
      <div class="row" id="eMq">${['Error al teclear', 'Cuadre de contador', 'Destino equivocado', 'Se olvidó apuntar'].map(t => `<button class="btn sec" data-m="${t}" style="padding:6px 10px;min-height:40px;font-size:14px">${t}</button>`).join('')}</div>
      <input id="eMot" placeholder="Escribe el motivo" style="margin-top:6px"></div>
    <div id="eErr" class="msg bad" hidden></div>
    <button class="btn" id="eOk">Guardar corrección</button>
    <button class="btn ghost" id="eNo">Cancelar</button>
    <p class="small muted">Se guardará con tu nombre (${esc(D().usuario.nombre)}), la fecha y la hora, y se rehará el fichero del viaje para el programa de gestión.</p>`;
  const sync = () => {
    ['1', '2', '3'].forEach(n => v.querySelectorAll('#eD' + n + ' [data-c]').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === $('#eD' + n + 't').value.trim())));
    const sin = $('#eSin').checked; $('#eDatos').hidden = sin;
    const L = Math.round(num($('#eL').value) || 0), a = Math.round(num($('#eL2').value) || 0), b = Math.round(num($('#eL3').value) || 0), el = $('#eRes');
    if (!sin && L > 0 && (a || b)) { el.hidden = false; el.className = 'msg ' + (a + b >= L ? 'bad' : 'ok'); el.textContent = a + b >= L ? 'Lo que va a otros destinos no puede ser igual o mayor que el total.' : `${$('#eD1t').value} ${fmt(L - a - b)} l${a ? ' · ' + $('#eD2t').value + ' ' + fmt(a) + ' l' : ''}${b ? ' · ' + $('#eD3t').value + ' ' + fmt(b) + ' l' : ''}`; }
    else el.hidden = true;
  };
  ['1', '2', '3'].forEach(n => { v.querySelectorAll('#eD' + n + ' [data-c]').forEach(b => b.onclick = () => { const t = $('#eD' + n + 't'); t.value = t.value.trim() === b.dataset.c && n !== '1' ? '' : b.dataset.c; sync(); }); $('#eD' + n + 't').oninput = sync; });
  ['eL', 'eL2', 'eL3'].forEach(id => $('#' + id).oninput = sync); $('#eSin').onchange = sync;
  $('#eMq').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { $('#eMot').value = b.dataset.m; });
  $('#eNo').onclick = () => ofiViaje(x.id);
  $('#eOk').onclick = async () => {
    if (U.ocupado) return; const b = $('#eOk'), e = $('#eErr'); e.hidden = true;
    const datos = { sin: $('#eSin').checked, litros: $('#eL').value, temp: $('#eT').value.trim(), muestra: $('#eM').value.trim(),
      d1: $('#eD1t').value.trim(), d2: $('#eD2t').value.trim(), l2: $('#eL2').value, d3: $('#eD3t').value.trim(), l3: $('#eL3').value };
    ocupado(b, 'Guardando…');
    try {
      const res = await api('corregir', { viajeId: x.id, recId: r ? r.id : null, cod: g.cod, esp: g.esp, ruta: g.ruta, ord: g.ord, datos, motivo: $('#eMot').value.trim() });
      toast(res.sinCambios ? 'No había nada que cambiar' : `Corrección guardada${res.fichero && res.fichero !== 'NO' ? ' · fichero ' + res.fichero + ' rehecho' : ''}`);
      await oficina(); ofiViaje(x.id);
    } catch (err) { libre(b); e.hidden = false; e.textContent = esRed(err) ? 'Sin cobertura: la corrección necesita conexión.' : err.message; }
  };
  sync();
  show('vOfiE', r ? 'Corregir' : 'Añadir ganadero', x.nombre);
}

/* 5. Terminar viaje */
function fin() {
  const tot = totales(), sum = Object.values(tot).reduce((a, b) => a + b, 0), n = {};
  recsViaje().forEach(x => { if (!x.sin) n[x.dest] = (n[x.dest] || 0) + 1; });
  const pend = S.list.filter(x => !S.rec[x.k]).length;
  const inc = recsViaje().filter(x => x.inc).length, mez = recsViaje().filter(x => x.mezcla).length;
  const arrs = recsViaje().filter(x => x.arr), arrSum = arrs.reduce((a, x) => a + x.arr.l, 0);
  const v = $('#vFin');
  v.innerHTML = `${pend ? `<div class="msg warn">${pend} ganadero${pend > 1 ? 's' : ''} sin anotar. Si no se han recogido, márcalos como "Hoy no se recoge".</div>` : ''}
  <div class="card stack">
    ${S.decas.map(d => `<p class="small muted">DeCA ${esc(d.num)} · <span class="mono">${esc(d.matricula)}</span> · cerrado por trasvase con ${fmt(d.litros)} l</p>`).join('')}
    <div class="route-head"><span class="lbl">DeCA ${esc(S.viaje.decaNum)}</span><span class="small muted mono">${esc(S.viaje.matricula)}</span></div>
    <p>Total recogido: <b class="num">${fmt(sum)} l</b></p>
    ${arrs.length ? `<p class="small">Arrastres: <b class="num">${fmt(arrSum)} l</b> en ${arrs.length} recogida${arrs.length > 1 ? 's' : ''}.</p>` : ''}
    ${inc ? `<p class="small" style="color:var(--warn);font-weight:700">${inc} recogida${inc > 1 ? 's' : ''} por encima de ${CFG().tempAviso} °C.</p>` : ''}
    ${mez ? `<p class="small" style="color:var(--bad);font-weight:700">${mez} recogida${mez > 1 ? 's' : ''} con mezcla.</p>` : ''}
  </div>
  <div class="card stack">
    <span class="lbl">Por compartimento</span>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Dst</th><th>Ganaderos</th><th>Litros</th></tr></thead>
      <tbody>${comps().map(c => `<tr><td><span class="tank ${spClass(c)}">${c.id}</span>${mixed(c) ? ' <small style="color:var(--bad);font-weight:700">mezcla</small>' : ''}</td><td>${n[c.id] || 0}</td><td>${fmt(tot[c.id])}</td></tr>`).join('')}</tbody>
    </table></div>
  </div>
  <div id="finMsg" hidden></div>
  <button class="btn" id="cerrar">Cerrar viaje</button>
  <button class="btn sec" id="volver">Volver a la lista</button>`;
  $('#volver').onclick = lista;
  $('#cerrar').onclick = async () => {
    if (U.ocupado) return;
    const b = $('#cerrar');
    const payload = { viajeId: S.viaje.id, viajes: S.cadena.slice(), litros: sum };
    ocupado(b, 'Cerrando…');
    // Se encola el cierre (va después de las recogidas pendientes) y se limpia el viaje del móvil
    S.cola.cierres.push(payload);
    S.viaje = null; S.list = []; S.rec = {}; S.decas = []; S.cadena = []; S.lastI = null; S.nuevosCam = S.nuevosCam.filter(k => k.id === S.cam);
    persistir(); await flush();
    libre(b);
    if (pendientes()) toast('Viaje cerrado en el móvil. Se enviará en cuanto haya cobertura.');
    rutas();
  };
  show('vFin', 'Terminar viaje', T().matricula);
}

/* ═══════════ TECLADO: la cabecera se encoge y se salta de campo con "Siguiente" ═══════════ */
document.addEventListener('focusin', e => { if (e.target.matches('input')) { document.body.classList.add('kb'); setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 250); } });
document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement || !document.activeElement.matches('input')) document.body.classList.remove('kb'); }, 60));
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input')) return;
  const orden = ['lit', 'tmp', 'mue'], i = orden.indexOf(e.target.id);
  if (i < 0) return; e.preventDefault();
  if (i < orden.length - 1) $('#' + orden[i + 1]).focus(); else e.target.blur();
});

/* ═══════════ ARRANQUE ═══════════ */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
{ const v = $('#ver'); if (v) v.textContent = VERSION; }
if (!S.pin || !S.datos) pinView();
else if (S.datos.oficina) oficina();
else if (S.viaje) (S.viaje.empezado ? lista : deca)();
else rutas();
flush();

</script>
</body>
