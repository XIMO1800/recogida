        <div class="row"><button class="btn" id="reAnuOk" style="background:var(--bad)">Sí, anular</button><button class="btn sec" id="reAnuNo">No</button></div>
      </div>` : ''}
    </div>`;
  const C = i => E.comps[+i];
  v.querySelectorAll('[data-f]').forEach(inp => inp.oninput = () => { const c = C(inp.dataset.i); c[inp.dataset.f] = inp.value.replace(inp.dataset.f === 'contador' ? /\D/g : /[^\d,.]/g, ''); if (inp.dataset.f === 'contador') { const q = $('#reCuadre'); if (q) q.innerHTML = cuadreHtml(); } });
  v.querySelectorAll('[data-f="contador"]').forEach(inp => inp.onchange = () => rehacer(recepRender));
  v.querySelectorAll('[data-ci]').forEach(b => b.onclick = () => { if (b.dataset.i !== '') C(b.dataset.i)[b.dataset.ci] = b.dataset.val; else E[b.dataset.ci] = b.dataset.val; recepRender(); });
  v.querySelectorAll('[data-mz]').forEach(b => b.onclick = async () => {
    const k = b.dataset.mz, comp = k.split('|')[1], val = (R.mezclas[k] || '') === b.dataset.val ? '' : b.dataset.val;
    b.disabled = true;
    try { await api('guardarMezcla', { viajeId: x.id, comp, mezcla: val }); R.mezclas[k] = val; toast(val ? `Mezcla ${comp}: ${val === 'C' ? 'correcta' : 'INCORRECTA'}` : `Mezcla ${comp} sin marcar`); conFoco(recepRender); }
    catch (e) { b.disabled = false; toast(esRed(e) ? 'Sin conexión: no se ha guardado' : e.message); }
  });
  v.querySelectorAll('[data-nc]').forEach(b => b.onclick = () => { const c = C(b.dataset.i); c.nComp = c.nComp === b.dataset.nc ? '' : b.dataset.nc; recepRender(); });
  v.querySelectorAll('[data-silo]').forEach(b => b.onclick = () => { const c = C(b.dataset.i); c.reps = c.reps.filter(r => (r.tipo || 'PRINCIPAL') !== 'PRINCIPAL' && r.dep !== b.dataset.silo); c.reps.unshift({ dep: b.dataset.silo, l: '', tipo: 'PRINCIPAL' }); recepRender(); });
  v.querySelectorAll('[data-xadd]').forEach(b => b.onclick = () => { const c = C(b.dataset.xadd); const mez = R.deps.find(d => /mezcla/i.test(d.uso) && d.id !== ppal(c)); c.reps.push({ dep: b.dataset.t === 'ARRASTRE' && mez ? mez.id : '', l: b.dataset.t === 'ARRASTRE' ? '100' : '', tipo: b.dataset.t === 'ARRASTRE' ? 'ARRASTRE' : 'OTRO' }); recepRender(); });
  v.querySelectorAll('[data-xdep]').forEach(b => b.onclick = () => { extras(C(b.dataset.i))[+b.dataset.j].dep = b.dataset.xdep; recepRender(); });
  v.querySelectorAll('[data-xl]').forEach(inp => { inp.oninput = () => { extras(C(inp.dataset.xl))[+inp.dataset.j].l = inp.value.replace(/\D/g, ''); }; inp.onchange = () => rehacer(recepRender); });
  v.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { extras(C(b.dataset.i))[+b.dataset.j].l = b.dataset.q; recepRender(); });
  v.querySelectorAll('[data-xdel]').forEach(b => b.onclick = () => { const c = C(b.dataset.xdel), p = extras(c)[+b.dataset.j]; c.reps = c.reps.filter(r => r !== p); recepRender(); });
  v.querySelectorAll('[data-addc]').forEach(b => b.onclick = () => { const e = b.dataset.addc, n = E.comps.filter(c => c.esp === e).length;
    const id = 'V' + e + (n ? n + 1 : ''); E.comps.push({ id, esp: e, decl: 0, nComp: '', ord: desc.length + 1, contador: '', temp: '', ph: '', dornic: '', visual: 'C', reps: [] }); recepRender();
    setTimeout(() => { const inp = v.querySelector(`[data-f="contador"][data-i="${E.comps.length - 1}"]`); if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); } }, 50); });
  v.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { const c = C(b.dataset.sel); c.ord = desc.length + 1; recepRender(); setTimeout(() => { const inp = v.querySelector(`[data-f="contador"][data-i="${b.dataset.sel}"]`); if (inp) { inp.scrollIntoView({ block: 'center' }); inp.focus(); } }, 50); });
  v.querySelectorAll('[data-unord]').forEach(b => b.onclick = () => { const c = C(b.dataset.unord), o = c.ord; c.ord = 0; E.comps.forEach(z => { if (z.ord > o) z.ord--; }); if (x.otra) E.comps.splice(E.comps.indexOf(c), 1); recepRender(); });
  $('#reTot').oninput = e => { E.total = e.target.value.replace(/\D/g, ''); }; $('#reTot').onchange = () => rehacer(recepRender);
  $('#reObs').oninput = e => { E.obs = e.target.value; };
  $('#reGuardar').onclick = async () => {
    const m = $('#reMsg'), err = t => { m.hidden = false; m.className = 'msg bad'; m.textContent = t; };
    const usados = desc.filter(c => num(c.contador) > 0);
    if (!usados.length) return err('Escribe el parcial del contador de al menos un compartimento.');
    for (const c of usados) {
      if (!ppal(c)) return err(`Elige el depósito de ${c.id}.`);
      if (!c.nComp) return err(`Marca en qué compartimento de la cisterna venía ${c.id} (1 = junto a la cabina).`);
      if (usados.some(z => z !== c && z.nComp === c.nComp)) return err(`El compartimento ${c.nComp} de la cisterna está puesto en más de una leche.`);
      if (resto(c) < 0) return err(`En ${c.id} lo pasado a otros depósitos es más que el parcial.`);
      if (extras(c).some(p => !p.dep || !(num(p.l) > 0))) return err(`En ${c.id} hay un arrastre o reparto sin depósito o sin litros.`);
      if (new Set([ppal(c)].concat(extras(c).map(p => p.dep))).size > 3) return err(`En ${c.id} hay más de 3 depósitos: el programa admite como máximo 3.`);
    }
    if (E.x.otra) for (const e of new Set(usados.map(c => c.esp))) {
      const ds = new Set(); usados.filter(c => c.esp === e).forEach(c => { ds.add(ppal(c)); extras(c).forEach(p => ds.add(p.dep)); });
      if (ds.size > 3) return err(`V${e} va a ${ds.size} depósitos entre todos sus compartimentos: el programa admite como máximo 3.`);
    }
    if (!(tot > 0) && E.x.otra && usados.length === 1) { E.total = String(suma); return recepRender(), $('#reGuardar').click(); }   // otra entrada: el total es el parcial
    if (!(tot > 0)) return err('Escribe el total del contador del camión.');
    if (Math.round(tot) !== Math.round(suma) && !m.dataset.ok) { m.dataset.ok = '1'; m.hidden = false; m.className = 'msg warn'; m.textContent = `El total (${fmt(tot)} l) no cuadra con la suma de parciales (${fmt(suma)} l). Revisa; si es correcto, pulsa otra vez Guardar.`; return; }
    const cq = cuadreDatos().T, recep = { viajeId: E.x.id, fecha: R.esHoy ? '' : R.dia, total: tot, cuadre: E.x.otra ? null : { cartilla: cq.cart, cisterna: cq.cist }, limpieza: E.limpieza, filtro: E.filtro, obs: E.obs, matricula: E.x.matricula, proveedor: E.x.otra ? E.x.conductor : '', ruta: E.x.ruta,
      comps: usados.map(c => ({ id: c.id, esp: c.esp, decl: c.decl, contador: Math.round(num(c.contador)), nComp: c.nComp, temp: c.temp === '' ? '' : num(c.temp), ph: c.ph, dornic: c.dornic, visual: c.visual,
        reps: [{ dep: ppal(c), l: resto(c), tipo: 'PRINCIPAL' }].concat(extras(c).map(p => ({ dep: p.dep, l: Math.round(num(p.l)), tipo: p.tipo }))).filter(p => p.l > 0) })) };
    const b = $('#reGuardar'); ocupado(b, 'Guardando…');
    const firma = ofi ? '' : ($('#reFirma').value || '').trim();
    if (!ofi && !firma) { libre(b); $('#reFirma').focus(); return err('Escribe tu PIN para firmar la recepción.'); }
    try { const r = await api('guardarRecepcion', { recep, firma }); toast('Recepción guardada' + (r.firmado ? ' · firmada por ' + r.firmado : '') + ' · fichero ' + r.fichero); R.ed = null; recepcion(); }
    catch (e) { libre(b); err(esRed(e) ? 'Sin conexión: no se ha guardado. Vuelve a pulsar cuando haya red.' : e.message); }
  };
  if ($('#reAnular')) {
    $('#reAnular').onclick = () => { $('#reAnu').hidden = false; $('#reAnular').hidden = true; $('#reAnu').scrollIntoView({ block: 'center' }); $('#reAnuMot').focus(); };
    $('#reAnuNo').onclick = () => { $('#reAnu').hidden = true; $('#reAnular').hidden = false; };
    $('#reAnuOk').onclick = async () => {
      const m = $('#reAnuMsg'), mot = $('#reAnuMot').value.trim(), b = $('#reAnuOk');
      if (!mot) { m.hidden = false; m.className = 'msg bad'; m.textContent = 'Escribe el motivo.'; return; }
      ocupado(b, 'Anulando…');
      try {
        const r = await api('anularRecepcion', { viajeId: x.id, motivo: mot });
        toast('Recepción anulada' + (r.fichero ? ' · fichero ' + r.fichero : '') + (r.revisarAgua ? ' · revisa el agua del día' : ''));
        R.ed = null; U.ag = null; recepcion();
      } catch (e) { libre(b); m.hidden = false; m.className = 'msg bad'; m.textContent = esRed(e) ? 'Sin conexión: no se ha anulado.' : e.message; }
    };
  }
  if (soloCal) {   // calidad ve el parte completo pero solo cambia la mezcla
    v.querySelectorAll('input, textarea, select, button').forEach(el => { if (!el.hasAttribute('data-mz')) el.disabled = true; });
    v.querySelectorAll('.pendc, #reGuardar, #reAnular, #reAnu, [data-unord], .field:has(#reFirma)').forEach(el => { el.hidden = true; });
    v.insertAdjacentHTML('afterbegin', '<div class="msg warn" style="margin:0">Calidad: aquí solo se marca la <b>mezcla</b> de cada leche (se guarda al pulsar). Lo demás es de recepción.</div>');
    v.insertAdjacentHTML('beforeend', '<button class="btn sec" id="calVolver">Volver a la lista</button>');
    $('#calVolver').onclick = () => recepcion(true);
  }
  show('vRecepC', 'Recepción' + (R.esHoy === false ? ' · ' + R.dia : ''), (x.matricula || '') + ' · ' + x.conductor);
}


/* Agua de arrastre del día (AG1 y, si hubo una segunda descarga tras limpiar, AG2).
   El colector pasa por delante de los depósitos 1 → 5: el agua de ARRANQUE va al primer depósito que recibe leche;
   el ARRASTRE FINAL va al último depósito al que se pasó leche y a todos los de número mayor que recibieron leche
   en esa descarga (nunca a los de número menor). Propuesta: 70 l cada uno (CONFIG: AGUA_ARRANQUE, AGUA_FINAL). */
function recepAgua(guardado) {
  const v = $('#vAgua'), d = R.aguaDef || { arranque: 70, final: 70 };
  const cams = R.viajes.filter(x => x.recep && x.recep.comps && x.recep.comps.length).sort((a, b) => String(a.recep.hora) < String(b.recep.hora) ? -1 : 1);
  if (!U.ag) {
    const ya = R.agua || [];
    U.ag = { corte: ya.length ? (ya.find(a => a.cod === 'AG2') ? (ya.find(a => a.cod === 'AG2').desde || '') : '') : '', manual: {}, l: {} };
    ya.forEach(a => { U.ag.manual[a.cod] = true; U.ag.l[a.cod + '|' + a.dep] = String(a.l); });
  }
  const A = U.ag, deps = R.deps.map(x => x.id);
  const cortei = A.corte ? cams.findIndex(x => x.id === A.corte) : -1;
  const sesiones = [{ cod: 'AG1', cams: cortei > 0 ? cams.slice(0, cortei) : cams }].concat(cortei > 0 ? [{ cod: 'AG2', cams: cams.slice(cortei), desde: A.corte }] : []);
  const propuesta = ses => {
    const pasos = []; ses.cams.forEach(x => x.recep.comps.forEach(c => pasos.push(c)));
    const ppalDe = c => (c.reps.find(r => r.tipo === 'PRINCIPAL') || c.reps[0] || {}).dep;
    const m = {}; if (!pasos.length) return { m, txt: '' };
    // Arranque: al primer depósito que recibe leche. Arrastre final: al depósito del último compartimento y a todos los de número mayor que recibieron leche
    const ini = ppalDe(pasos[0]), ult = ppalDe(pasos[pasos.length - 1]);
    const usados = [...new Set(pasos.flatMap(c => c.reps.map(r => r.dep)).filter(Boolean))];
    m[ini] = (m[ini] || 0) + d.arranque;
    const fin = usados.filter(x => x === ult || +x > +ult); fin.forEach(x => { m[x] = (m[x] || 0) + d.final; });
    return { m, txt: `Arranque → dep. ${ini} · Arrastre final → dep. ${fin.sort((a, b) => a - b).join(', ')}` };
  };
  const val = (ses, dep, pr) => A.manual[ses.cod] ? (A.l[ses.cod + '|' + dep] || '') : (pr.m[dep] ? String(pr.m[dep]) : '');
  v.innerHTML = `<div class="agGrid"><div class="agIzq"><div class="card stack"><h2>Agua de arrastre del día</h2>
      <p class="small muted">Es el agua que entra a los depósitos al arrancar el contador y al arrastrar la leche al final. La app la propone según el orden de descarga; ajústala si hoy ha sido distinto. No cuenta en el total de ningún camión.</p>
      ${cams.length ? `<span class="lbl">Orden de descarga de hoy</span>
      ${sesiones.filter(z => z.cams.length).map(ses => { let n = 0; const filas = ses.cams.flatMap(x => x.recep.comps.map((c, k) => ({ x, c, k }))); return `${sesiones.length > 1 ? `<span class="lbl" style="margin-top:6px">${ses.cod}</span>` : ''}
        <div class="tl">${filas.map((f, j) => { n++; const reps = f.c.reps; return `<span class="n">${n}</span>
          <span>${f.k === 0 ? `<b class="mono small">${esc(f.x.recep.hora)}</b> <span class="small">${esc(f.x.conductor)}</span>` : ''}</span>
          <span>${tq(f.c.id)} → ${reps.map(r => `<b>dep. ${esc(r.dep)}</b>${reps.length > 1 ? ' <span class="small muted">' + fmt(r.l) + ' l</span>' : ''}`).join(' + ')}${j === 0 ? '<span class="tag ini">arranque</span>' : ''}${j === filas.length - 1 ? '<span class="tag fin">último · arrastre final</span>' : ''}</span>`; }).join('')}</div>`; }).join('')}
      <p class="small muted">Si el orden no es el real, abre ese camión desde la lista de recepción: con «No era este» lo quitas y lo vuelves a tocar en su sitio.</p>
      ${cams.length > 1 ? `<div class="field"><label class="lbl" for="agCorte">¿Hubo limpieza y una segunda descarga (AG2)? Empieza en:</label>
        <select id="agCorte" class="big" style="font-size:20px"><option value="">No, todo es una descarga (solo AG1)</option>${cams.slice(1).map(x => `<option value="${esc(x.id)}" ${A.corte === x.id ? 'selected' : ''}>${esc(x.recep.hora)} · ${esc(x.matricula)} · ${esc(x.conductor)}</option>`).join('')}</select></div>` : ''}`
      : '<div class="msg warn">Todavía no hay ningún camión recibido hoy.</div>'}
    </div></div><div class="agDer stack">
    ${sesiones.filter(ses => ses.cams.length).map(ses => { const pr = propuesta(ses); const tot = deps.reduce((a, dp) => a + (num(val(ses, dp, pr)) || 0), 0);
      return `<div class="card stack"><div class="route-head"><h2>${ses.cod}</h2><b class="num">${fmt(tot)} l</b></div>
        <p class="small muted">${A.manual[ses.cod] ? 'Ajustado a mano.' : esc(pr.txt) + ` (${d.arranque} + ${d.final} l por depósito)`}</p>
        <div class="tally">${deps.map(dp => `<div><b class="mono" style="font-size:18px">Dep. ${dp}</b><div class="unit"><input class="big" style="font-size:28px" data-ag="${ses.cod}" data-dep="${dp}" inputmode="numeric" value="${esc(val(ses, dp, pr))}" placeholder="0"><span>l</span></div></div>`).join('')}</div>
        ${deps.filter(dp => (num(val(ses, dp, pr)) || 0) > 0).length > 3 ? `<div class="msg bad">${ses.cod} va a más de 3 depósitos y el programa solo admite 3: junta el agua de alguno (pon 0 en uno y súmalo a otro).</div>` : ''}
        ${A.manual[ses.cod] ? `<button class="btn ghost" data-rest="${ses.cod}">Volver a la propuesta</button>` : ''}</div>`; }).join('')}
    <div id="agMsg" hidden></div>
    ${cams.length ? '<button class="btn" id="agOk">Guardar agua del día</button>' : ''}</div></div>`;
  const sel = $('#agCorte'); if (sel) sel.onchange = () => { A.corte = sel.value; delete A.manual.AG2; recepAgua(); };
  v.querySelectorAll('[data-ag]').forEach(inp => inp.oninput = () => {
    const ses = sesiones.find(z => z.cod === inp.dataset.ag), pr = propuesta(ses);
    if (!A.manual[ses.cod]) { deps.forEach(dp => { A.l[ses.cod + '|' + dp] = pr.m[dp] ? String(pr.m[dp]) : ''; }); A.manual[ses.cod] = true; }
    A.l[ses.cod + '|' + inp.dataset.dep] = inp.value.replace(/\D/g, '');
  });
  v.querySelectorAll('[data-ag]').forEach(inp => inp.onchange = () => rehacer(() => recepAgua()));
  v.querySelectorAll('[data-rest]').forEach(b => b.onclick = () => { delete A.manual[b.dataset.rest]; recepAgua(); });
  if ($('#agOk')) $('#agOk').onclick = async () => {
    const filas = [];
    sesiones.filter(ses => ses.cams.length).forEach(ses => { const pr = propuesta(ses); deps.forEach(dp => { const l = Math.round(num(val(ses, dp, pr)) || 0); if (l > 0) filas.push({ cod: ses.cod, dep: dp, l, desde: ses.desde || '' }); }); });
    const b = $('#agOk'); ocupado(b, 'Guardando…');
    try { const r = await api('guardarAgua', { agua: filas, fecha: R.esHoy ? '' : R.dia }); R.agua = filas; U.ag = null; toast('Agua guardada' + (r.fichero ? ' · fichero ' + r.fichero : '')); recepcion(true); }
    catch (e) { libre(b); const m = $('#agMsg'); m.hidden = false; m.className = 'msg bad'; m.textContent = esRed(e) ? 'Sin conexión: no se ha guardado.' : e.message; }
  };
  show('vAgua', 'Agua de arrastre' + (R.esHoy === false ? ' · ' + R.dia : ''), D().usuario.nombre);
}

/* ═══════════ ARRANQUE ═══════════ */
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
{ const v = $('#ver'); if (v) { v.textContent = VERSION.split(' ')[0]; v.title = VERSION; } }
if (!S.pin || !S.datos) pinView();
else if (S.datos.recepcion || S.datos.calidad) recepcion();
else if (S.datos.oficina) oficina();
else if (S.viaje) (S.viaje.empezado ? lista : deca)();
else rutas();
flush();

</script>
</body>
